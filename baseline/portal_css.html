<style>
  :root {
    --portal-primary: #7651ff;
    --portal-primary-soft: #f2f0ff;
    --portal-ink: #1e1e2f;
    --portal-muted: #7c7c91;
    --portal-border: #eaebfa;
    --portal-bg: #f8f9fc;
    --portal-danger: #ef5d67;
    --portal-success: #20a779;
    --portal-warning: #e49b21;
  }
  .portal-hidden { display: none !important; }
  .portal-session-splash { position:fixed; inset:0; z-index:200001; display:grid; place-items:center; overflow:hidden; padding:24px; opacity:1; background:radial-gradient(circle at 16% 12%,#eee9ff 0,#f8f8fc 38%,#eef3fb 100%); transition:opacity .3s ease,visibility .3s ease; }
  .portal-session-splash::before { content:''; position:absolute; inset:0; opacity:.48; background-image:radial-gradient(circle at center,rgba(118,81,255,.14) 0 1px,transparent 1.5px); background-size:26px 26px; -webkit-mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent); mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent); }
  .portal-session-splash.portal-session-leaving { opacity:0; visibility:hidden; }
  .portal-session-ambient { position:absolute; inset:0; pointer-events:none; }
  .portal-session-ambient span { position:absolute; display:block; border-radius:50%; filter:blur(3px); animation:portalAmbientFloat 7s ease-in-out infinite alternate; }
  .portal-session-ambient span:nth-child(1) { width:360px; height:360px; left:-90px; top:-120px; background:rgba(137,108,255,.13); }
  .portal-session-ambient span:nth-child(2) { width:300px; height:300px; right:-60px; bottom:-90px; background:rgba(103,178,255,.12); animation-delay:-2.4s; }
  .portal-session-ambient span:nth-child(3) { width:150px; height:150px; right:18%; top:13%; background:rgba(255,255,255,.8); filter:blur(10px); animation-delay:-4.2s; }
  .portal-session-splash-card { position:relative; isolation:isolate; display:grid; justify-items:center; width:min(600px,calc(100vw - 42px)); padding:18px 30px; overflow:visible; border:0; border-radius:0; color:var(--portal-ink); text-align:center; background:transparent; box-shadow:none; opacity:0; transform:translateY(12px) scale(.96); transition:opacity .42s ease,transform .55s cubic-bezier(.22,1,.36,1); }
  .portal-session-splash-card::before { content:''; position:absolute; z-index:-1; width:360px; height:360px; left:50%; top:28px; border-radius:50%; background:radial-gradient(circle,rgba(118,81,255,.15),rgba(255,255,255,.35) 42%,transparent 70%); transform:translateX(-50%); animation:portalGlowBreathe 2.4s ease-in-out infinite; }
  .portal-session-active .portal-session-splash-card { opacity:1; transform:translateY(0) scale(1); }
  .portal-session-brand { width:min(500px,100%); display:flex; align-items:center; gap:10px; color:#858197; font-size:10px; font-weight:900; letter-spacing:.15em; }
  .portal-session-brand-mark { display:grid; width:34px; height:34px; place-items:center; border-radius:11px; color:#fff; background:linear-gradient(135deg,var(--portal-primary),#9b83ff); box-shadow:0 8px 18px rgba(118,81,255,.25); font-size:15px; }
  .portal-session-brand b { margin-left:auto; padding:0; color:var(--portal-primary); background:transparent; font-size:9px; letter-spacing:.12em; }
  .portal-session-visual { position:relative; width:190px; height:190px; margin:12px 0 4px; display:grid; place-items:center; }
  .portal-session-orbit { position:absolute; inset:8px; border:1px solid rgba(118,81,255,.18); border-radius:50%; animation:portalOrbitSpin 4.5s linear infinite; }
  .portal-session-orbit::before { content:''; position:absolute; inset:20px; border:1px dashed rgba(118,81,255,.16); border-radius:50%; animation:portalOrbitSpin 7s linear infinite reverse; }
  .portal-session-orbit i { position:absolute; display:block; border-radius:50%; background:linear-gradient(135deg,var(--portal-primary),#ac94ff); box-shadow:0 0 0 6px rgba(118,81,255,.08),0 7px 16px rgba(118,81,255,.23); }
  .portal-session-orbit i:nth-child(1) { width:12px; height:12px; left:10px; top:32px; }
  .portal-session-orbit i:nth-child(2) { width:9px; height:9px; right:7px; bottom:45px; animation:portalDotPulse 1.3s ease-in-out infinite; }
  .portal-session-orbit i:nth-child(3) { width:6px; height:6px; left:48%; bottom:-3px; background:#62c6ae; }
  .portal-session-receipt { position:relative; display:flex; width:72px; height:94px; flex-direction:column; gap:8px; padding:19px 15px 13px; overflow:hidden; border:1px solid rgba(118,81,255,.2); border-radius:20px 20px 15px 15px; background:rgba(255,255,255,.96); box-shadow:0 20px 38px rgba(57,43,122,.17); animation:portalReceiptFloat 2.2s ease-in-out infinite; }
  .portal-session-receipt::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:9px; background:linear-gradient(135deg,transparent 6px,#fff 0) 0 0/12px 12px repeat-x; }
  .portal-session-receipt i { display:block; height:4px; border-radius:999px; background:#dfdaf8; }
  .portal-session-receipt i:nth-child(1) { width:55%; height:7px; background:linear-gradient(90deg,var(--portal-primary),#a98fff); }
  .portal-session-receipt i:nth-child(2) { width:100%; }
  .portal-session-receipt i:nth-child(3) { width:76%; }
  .portal-session-receipt i:nth-child(4) { width:90%; }
  .portal-session-receipt em { display:block; width:38%; height:6px; margin-top:auto; margin-left:auto; border-radius:999px; background:#b8adef; }
  .portal-session-scan { position:absolute; z-index:3; width:86px; height:3px; top:52px; border-radius:999px; opacity:.8; background:linear-gradient(90deg,transparent,#7651ff 22%,#bbaaff 78%,transparent); box-shadow:0 0 12px rgba(118,81,255,.65); animation:portalReceiptScan 1.7s ease-in-out infinite; }
  .portal-session-ready { position:absolute; z-index:4; right:24px; bottom:29px; display:grid; width:36px; height:36px; place-items:center; border:4px solid #fff; border-radius:13px; color:#fff; background:#42b994; box-shadow:0 9px 20px rgba(32,167,121,.28); font-size:16px; animation:portalReadyPop 2.2s ease-in-out infinite; }
  .portal-session-copy { display:grid; gap:7px; min-height:62px; align-content:center; }
  .portal-session-copy strong { font-size:24px; font-weight:900; letter-spacing:-.025em; animation:portalCopyFade .45s ease-out; }
  .portal-session-copy small { color:var(--portal-muted); font-size:13px; font-weight:750; }
  .portal-session-progress { width:min(470px,100%); height:7px; margin-top:20px; overflow:hidden; border-radius:999px; background:#e7e4f3; }
  .portal-session-progress span { display:block; width:42%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--portal-primary),#a88cff,#69c8b1); box-shadow:0 0 12px rgba(118,81,255,.28); animation:portalProgressTravel 1.55s cubic-bezier(.65,0,.35,1) infinite; }
  .portal-session-secure { display:flex; align-items:center; gap:8px; margin-top:13px; color:#8f8ba0; font-size:10px; font-weight:900; letter-spacing:.07em; text-transform:uppercase; }
  .portal-session-secure>i:first-child { color:#42b994; font-size:13px; }
  .portal-session-live { width:7px; height:7px; margin-left:2px; border-radius:50%; background:#42b994; box-shadow:0 0 0 5px rgba(66,185,148,.12); animation:portalDotPulse 1.25s ease-in-out infinite; }
  @keyframes portalAmbientFloat { to { transform:translate3d(22px,18px,0) scale(1.06); } }
  @keyframes portalGlowBreathe { 50% { opacity:.55; transform:translateX(-50%) scale(1.15); } }
  @keyframes portalOrbitSpin { to { transform:rotate(360deg); } }
  @keyframes portalReceiptFloat { 50% { transform:translateY(-4px) rotate(-1deg); } }
  @keyframes portalReceiptScan { 0%,100% { transform:translateY(0); opacity:.25; } 50% { transform:translateY(74px); opacity:1; } }
  @keyframes portalReadyPop { 0%,100% { transform:scale(.88) rotate(-5deg); } 50% { transform:scale(1) rotate(0); } }
  @keyframes portalProgressTravel { 0% { transform:translateX(-112%); } 100% { transform:translateX(240%); } }
  @keyframes portalDotPulse { 50% { opacity:.35; transform:scale(.72); } }
  @keyframes portalCopyFade { from { opacity:0; transform:translateY(3px); } }
  #sidebar { width:240px; height:100dvh; max-height:100dvh; overflow:hidden; contain:layout paint style; transition:width .18s ease-out,opacity .18s ease-out; }
  #sidebar>div:first-child { flex:0 0 auto; }

  #sidebar.sidebar-collapsed .nav-text,

  #sidebar .nav-item { flex:0 0 auto; transition:color .1s ease,background-color .1s ease !important; }
  .legacy-global-skeleton { position:absolute; z-index:40; top:32px; left:32px; right:32px; width:auto !important; max-width:1400px; pointer-events:none; }
  #historyPageSkeleton { min-height:520px; }
  #historyPage.history-page-loading #historyPageSkeleton { display:block; }
  #historyPage.history-page-loading #historyPageContent { display:none; }
  body.portal-logging-out #sidebar { opacity:0; transform:translateX(-14px); filter:blur(2px); pointer-events:none; }
  body.portal-logging-out #mainContent { opacity:0; transform:translateY(10px) scale(.994); filter:blur(2px); pointer-events:none; }
  #portalLogoutButton.portal-logout-busy { color:var(--portal-primary); background:var(--portal-primary-soft); box-shadow:0 8px 22px rgba(118,81,255,.14); }
