<style>
  /*
   * Database Nota UI System v3
   *
   * Presentation-only compatibility layer. Every rule is scoped to the
   * opt-in body class so the current UI remains the rollback path until the
   * new theme is enabled from the shell.
   */
  body.portal-ui-v3 {
    --ui-canvas: #fefeff;
    --ui-canvas-soft: #fbfbfe;
    --ui-surface: #ffffff;
    --ui-surface-subtle: #f8f8fd;
    --ui-surface-hover: #f8f7ff;
    --ui-surface-active: #f1efff;
    --ui-ink: #11152b;
    --ui-ink-soft: #363b52;
    --ui-muted: #687086;
    --ui-muted-soft: #6f768b;
    --ui-border: #ececf5;
    --ui-border-strong: #dddceb;
    --ui-primary: #6d5dfb;
    --ui-primary-strong: #5846ee;
    --ui-primary-soft: #f1efff;
    --ui-blue: #3f7cff;
    --ui-blue-soft: #eef4ff;
    --ui-success: #0f7054;
    --ui-success-soft: #e8f8f2;
    --ui-warning: #875000;
    --ui-warning-soft: #fff6df;
    --ui-danger: #a93646;
    --ui-danger-soft: #fff0f2;
    --ui-neutral-soft: #f1f2f6;
    --ui-gradient: linear-gradient(135deg, #6d5dfb 0%, #4f6ff8 55%, #3f7cff 100%);
    --ui-shadow-xs: 0 2px 8px rgba(27, 25, 65, .035);
    --ui-shadow-sm: 0 8px 24px rgba(27, 25, 65, .055);
    --ui-shadow-md: 0 16px 42px rgba(27, 25, 65, .09);
    --ui-shadow-lg: 0 28px 80px rgba(24, 21, 61, .17);
    --ui-focus: 0 0 0 4px rgba(109, 93, 251, .13);
    --ui-radius-sm: 10px;
    --ui-radius-md: 13px;
    --ui-radius-lg: 18px;
    --ui-radius-xl: 22px;
    --ui-radius-2xl: 28px;
    --ui-space-1: 4px;
    --ui-space-2: 8px;
    --ui-space-3: 12px;
    --ui-space-4: 16px;
    --ui-space-5: 20px;
    --ui-space-6: 24px;
    --ui-space-8: 32px;
    --ui-control-height: 44px;
    --ui-control-compact: 36px;
    --ui-motion-fast: 140ms;
    --ui-motion: 200ms;
    --ui-motion-slow: 280ms;

    min-height: 100dvh;
    color: var(--ui-ink);
    background: var(--ui-canvas);
    font-family: "Plus Jakarta Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    font-synthesis-weight: none;
    text-rendering: optimizeLegibility;
  }

  body.portal-ui-v3 *,
  body.portal-ui-v3 *::before,
  body.portal-ui-v3 *::after {
    box-sizing: border-box;
  }

  body.portal-ui-v3 button,
  body.portal-ui-v3 input,
  body.portal-ui-v3 select,
  body.portal-ui-v3 textarea {
    font-family: inherit;
  }

  body.portal-ui-v3 button,
  body.portal-ui-v3 a,
  body.portal-ui-v3 input,
  body.portal-ui-v3 select,
  body.portal-ui-v3 textarea,
  body.portal-ui-v3 [role="button"] {
    -webkit-tap-highlight-color: transparent;
  }

  body.portal-ui-v3 :focus-visible {
    outline: 3px solid rgba(109, 93, 251, .24);
    outline-offset: 2px;
  }

  body.portal-ui-v3 ::selection {
    color: var(--ui-ink);
    background: #ddd8ff;
  }

  body.portal-ui-v3 ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  body.portal-ui-v3 ::-webkit-scrollbar-track {
    background: transparent;
  }

  body.portal-ui-v3 ::-webkit-scrollbar-thumb {
    border: 2px solid transparent;
    border-radius: 999px;
    background: #d9d8e7;
    background-clip: padding-box;
  }

  body.portal-ui-v3 ::-webkit-scrollbar-thumb:hover {
    background: #c8c5dc;
    background-clip: padding-box;
  }

  /* Bridge existing portal variables to the bright-white system. */
  body.portal-ui-v3 {
    --portal-primary: var(--ui-primary);
    --portal-primary-soft: var(--ui-primary-soft);
    --portal-ink: var(--ui-ink);
    --portal-muted: var(--ui-muted);
    --portal-border: var(--ui-border);
    --portal-bg: var(--ui-surface-subtle);
    --portal-danger: var(--ui-danger);
    --portal-success: var(--ui-success);
    --portal-warning: var(--ui-warning);
  }

  body.portal-ui-v3 .bg-brand-paper {
    background-color: var(--ui-surface-subtle) !important;
  }

  body.portal-ui-v3 .bg-brand-stone {
    background-color: var(--ui-border) !important;
  }

  body.portal-ui-v3 .border-brand-stone {
    border-color: var(--ui-border) !important;
  }

  body.portal-ui-v3 .text-brand-black {
    color: var(--ui-ink) !important;
  }

  body.portal-ui-v3 .text-brand-muted {
    color: var(--ui-muted) !important;
  }

  body.portal-ui-v3 .text-brand-coral {
    color: var(--ui-primary) !important;
  }

  body.portal-ui-v3 .bg-brand-coral {
    background-color: var(--ui-primary) !important;
  }

  body.portal-ui-v3 .bg-brand-black {
    background-color: var(--ui-ink) !important;
  }

  body.portal-ui-v3 .bg-gradient-primary {
    background-image: var(--ui-gradient) !important;
  }

  /* App shell */
  body.portal-ui-v3 #mainContent {
    position: relative;
    padding: 34px clamp(24px, 3vw, 48px) 56px;
    color: var(--ui-ink);
    background:
      radial-gradient(circle at 98% 0%, rgba(109, 93, 251, .055), transparent 25%),
      radial-gradient(circle at 76% 100%, rgba(63, 124, 255, .035), transparent 28%),
      var(--ui-canvas);
    scrollbar-gutter: stable;
  }

  body.portal-ui-v3 #sidebar {
    width: 240px;
    flex-basis: 240px;
    padding: 22px 18px 18px !important;
    border-color: var(--ui-border) !important;
    color: var(--ui-ink);
    background: rgba(255, 255, 255, .985) !important;
    box-shadow: 8px 0 32px rgba(31, 27, 71, .025) !important;
    transition: width var(--ui-motion) cubic-bezier(.22, 1, .36, 1),
      flex-basis var(--ui-motion) cubic-bezier(.22, 1, .36, 1),
      opacity var(--ui-motion-fast) ease;
  }

  body.portal-ui-v3 #sidebar > div:first-child {
    min-height: 46px;
    margin-bottom: 30px !important;
    padding: 0 7px !important;
  }

  body.portal-ui-v3 #sidebar > div:first-child > div:first-child {
    width: 42px !important;
    height: 42px !important;
    border-radius: 14px !important;
    background: var(--ui-gradient) !important;
    box-shadow: 0 10px 24px rgba(92, 75, 240, .24) !important;
  }

  body.portal-ui-v3 #sidebar .brand-text {
    color: var(--ui-ink) !important;
    font-size: 14px !important;
    font-weight: 800 !important;
    letter-spacing: -.025em !important;
  }

  body.portal-ui-v3 #sidebar > nav {
    gap: 5px !important;
    padding: 2px 1px 10px;
    scrollbar-color: #d9d8e7 transparent;
  }

  body.portal-ui-v3 #sidebar .nav-item {
    position: relative;
    min-height: 46px;
    padding: 11px 13px !important;
    gap: 12px !important;
    border: 1px solid transparent;
    border-radius: 13px !important;
    color: var(--ui-muted) !important;
    background: transparent !important;
    box-shadow: none !important;
    font-size: 12px;
    font-weight: 700 !important;
    transition: color var(--ui-motion-fast) ease,
      background-color var(--ui-motion-fast) ease,
      border-color var(--ui-motion-fast) ease,
      transform var(--ui-motion-fast) ease !important;
  }

  body.portal-ui-v3 #sidebar .nav-item:hover {
    color: var(--ui-primary) !important;
    border-color: #ebe7ff;
    background: #faf9ff !important;
    transform: translateX(2px);
  }

  body.portal-ui-v3 #sidebar .nav-item > i {
    display: grid;
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    place-items: center;
    color: #858ba0;
    font-size: 17px !important;
    transition: color var(--ui-motion-fast) ease, transform var(--ui-motion-fast) ease;
  }

  body.portal-ui-v3 #sidebar .nav-item:hover > i {
    color: var(--ui-primary);
  }

  body.portal-ui-v3 #sidebar .nav-item.active-page,
  body.portal-ui-v3 #sidebar .nav-item[aria-current="page"] {
    color: var(--ui-primary-strong) !important;
    border-color: #e3deff !important;
    background: linear-gradient(135deg, #f3f0ff, #f7f5ff) !important;
    box-shadow: 0 8px 20px rgba(86, 67, 224, .08) !important;
    transform: none;
  }

  body.portal-ui-v3 #sidebar .nav-item.active-page::before,
  body.portal-ui-v3 #sidebar .nav-item[aria-current="page"]::before {
    content: "";
    position: absolute;
    left: -7px;
    top: 12px;
    bottom: 12px;
    width: 3px;
    border-radius: 999px;
    background: var(--ui-gradient);
  }

  body.portal-ui-v3 #sidebar .nav-item.active-page > i,
  body.portal-ui-v3 #sidebar .nav-item[aria-current="page"] > i {
    color: var(--ui-primary);
  }

  body.portal-ui-v3 #sidebar > div:last-child {
    gap: 9px !important;
    margin-top: 10px !important;
    padding-top: 14px !important;
    border-color: var(--ui-border) !important;
  }

  body.portal-ui-v3 .portal-shell-user {
    padding: 11px 12px;
    border-color: var(--ui-border);
    border-radius: var(--ui-radius-md);
    background: var(--ui-surface-subtle);
    box-shadow: none;
  }

  body.portal-ui-v3 .portal-shell-user:hover {
    border-color: #dcd6ff;
    background: var(--ui-primary-soft);
  }

  body.portal-ui-v3 .portal-shell-user strong {
    color: var(--ui-ink);
    font-size: 12px;
    font-weight: 800;
  }

  body.portal-ui-v3 .portal-shell-user span {
    color: var(--ui-muted);
    font-size: 10px;
    font-weight: 700;
  }

  body.portal-ui-v3 #portalLogoutButton {
    min-height: 40px;
  }

  body.portal-ui-v3 #toggleSidebarButton {
    color: var(--ui-muted) !important;
    border-color: var(--ui-border) !important;
    background: var(--ui-surface) !important;
    box-shadow: var(--ui-shadow-xs);
  }

  body.portal-ui-v3 #toggleSidebarButton:hover {
    color: var(--ui-primary) !important;
    border-color: #dad4ff !important;
    background: var(--ui-primary-soft) !important;
  }

  body.portal-ui-v3 #sidebar.sidebar-collapsed {
    width: 78px !important;
    flex-basis: 78px !important;
    padding-right: 12px !important;
    padding-left: 12px !important;
  }

  body.portal-ui-v3 #sidebar.sidebar-collapsed .nav-item {
    justify-content: center;
    gap: 0 !important;
    padding-right: 0 !important;
    padding-left: 0 !important;
  }

  body.portal-ui-v3 #sidebar.sidebar-collapsed #portalLogoutButton {
    justify-content: center;
    padding-right: 0;
    padding-left: 0;
  }

  body.portal-ui-v3 #sidebar.sidebar-collapsed .nav-item.active-page::before,
  body.portal-ui-v3 #sidebar.sidebar-collapsed .nav-item[aria-current="page"]::before {
    left: -6px;
  }

  /* Page hierarchy */
  body.portal-ui-v3 .portal-page {
    max-width: 1480px;
  }

  body.portal-ui-v3 .portal-page-head {
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 24px;
  }

  body.portal-ui-v3 .portal-page-head h1,
  body.portal-ui-v3 .page-section > div:first-child h1 {
    color: var(--ui-ink);
    font-size: clamp(26px, 2.4vw, 32px);
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -.04em;
  }

  body.portal-ui-v3 .portal-page-head p,
  body.portal-ui-v3 .page-section > div:first-child p {
    color: var(--ui-muted);
    font-size: 13px;
    line-height: 1.6;
    font-weight: 600;
  }

  body.portal-ui-v3 .portal-page-refreshing::after,
  body.portal-ui-v3 .page-section.portal-page-refreshing::after {
    top: 18px;
    right: 24px;
    padding: 9px 13px;
    color: var(--ui-ink-soft);
    border-color: var(--ui-border);
    background: rgba(255, 255, 255, .96);
    box-shadow: var(--ui-shadow-sm);
    font-size: 11px;
  }

  /* Surfaces, KPI cards, and empty states */
  body.portal-ui-v3 .portal-card {
    padding: 22px;
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-xl);
    background: var(--ui-surface);
    box-shadow: var(--ui-shadow-sm);
  }

  body.portal-ui-v3 .portal-stat {
    min-height: 150px;
    padding: 20px;
    border-color: var(--ui-border);
    border-radius: var(--ui-radius-lg);
    background: var(--ui-surface);
    box-shadow: var(--ui-shadow-xs);
    transition: transform var(--ui-motion) ease,
      border-color var(--ui-motion) ease,
      box-shadow var(--ui-motion) ease;
  }

  body.portal-ui-v3 .portal-stat:hover {
    border-color: #ded9ff;
    box-shadow: var(--ui-shadow-sm);
    transform: translateY(-2px);
  }

  body.portal-ui-v3 .portal-stat span {
    color: var(--ui-muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .035em;
  }

  body.portal-ui-v3 .portal-stat strong {
    margin-top: 10px;
    color: var(--ui-ink);
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
  }

  body.portal-ui-v3 .portal-stat small {
    color: var(--ui-muted);
    font-size: 11px;
    font-weight: 600;
  }

  body.portal-ui-v3 .portal-stat-top > i {
    width: 38px;
    height: 38px;
    flex-basis: 38px;
    border-radius: 12px;
    font-size: 16px;
  }

  body.portal-ui-v3 .portal-empty,
  body.portal-ui-v3 .portal-bank-empty,
  body.portal-ui-v3 .portal-queue-no-results {
    color: var(--ui-muted);
    font-size: 12px;
    font-weight: 600;
  }

  body.portal-ui-v3 .portal-bank-empty,
  body.portal-ui-v3 .portal-empty:not(td) {
    border-color: var(--ui-border);
    border-radius: var(--ui-radius-lg);
  }

  /* Buttons and action hierarchy */
  body.portal-ui-v3 .portal-btn {
    min-height: var(--ui-control-height);
    padding: 10px 16px;
    gap: 8px;
    border: 1px solid transparent;
    border-radius: var(--ui-radius-md);
    font-size: 12px;
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -.005em;
    box-shadow: none;
    transition: color var(--ui-motion-fast) ease,
      background-color var(--ui-motion-fast) ease,
      border-color var(--ui-motion-fast) ease,
      box-shadow var(--ui-motion-fast) ease,
      transform var(--ui-motion-fast) ease;
  }

  body.portal-ui-v3 .portal-btn:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  body.portal-ui-v3 .portal-btn:active:not(:disabled) {
    transform: translateY(0) scale(.98);
  }

  body.portal-ui-v3 .portal-btn-primary {
    color: #fff;
    border-color: transparent;
    background: var(--ui-gradient);
    box-shadow: 0 9px 22px rgba(88, 70, 238, .20);
  }

  body.portal-ui-v3 .portal-btn-primary:hover:not(:disabled) {
    box-shadow: 0 12px 28px rgba(88, 70, 238, .26);
  }

  body.portal-ui-v3 .portal-btn-soft {
    color: var(--ui-primary-strong);
    border-color: #e4e0ff;
    background: #f7f5ff;
  }

  body.portal-ui-v3 .portal-btn-soft:hover:not(:disabled) {
    color: var(--ui-primary-strong);
    border-color: #d6cfff;
    background: var(--ui-primary-soft);
  }

  body.portal-ui-v3 .portal-btn-dark {
    color: #fff;
    border-color: var(--ui-ink);
    background: var(--ui-ink);
    box-shadow: 0 8px 20px rgba(17, 21, 43, .14);
  }

  body.portal-ui-v3 .portal-btn-danger {
    color: #fff;
    border-color: var(--ui-danger);
    background: var(--ui-danger);
  }

  body.portal-ui-v3 .portal-btn-success {
    color: #fff;
    border-color: var(--ui-success);
    background: var(--ui-success);
  }

  body.portal-ui-v3 .portal-btn-icon,
  body.portal-ui-v3 .portal-icon-button {
    width: var(--ui-control-height);
    min-width: var(--ui-control-height);
    height: var(--ui-control-height);
    min-height: var(--ui-control-height);
    padding: 0;
    border: 1px solid var(--ui-border);
    border-radius: 12px;
    color: var(--ui-muted);
    background: var(--ui-surface);
    box-shadow: var(--ui-shadow-xs);
  }

  body.portal-ui-v3 .portal-icon-button:hover:not(:disabled) {
    color: var(--ui-primary);
    border-color: #d8d2ff;
    background: var(--ui-primary-soft);
  }

  body.portal-ui-v3 .portal-btn[aria-busy="true"],
  body.portal-ui-v3 .portal-btn-icon[aria-busy="true"] {
    opacity: .78;
    cursor: wait;
  }

  /* Inputs, filters, dropdowns, and calendars */
  body.portal-ui-v3 .portal-label {
    margin-bottom: 7px;
    color: var(--ui-ink-soft);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .045em;
  }

  body.portal-ui-v3 .portal-input,
  body.portal-ui-v3 .portal-select,
  body.portal-ui-v3 .portal-textarea,
  body.portal-ui-v3 .portal-inline-input,
  body.portal-ui-v3 .portal-combobox-trigger,
  body.portal-ui-v3 .portal-combobox-main-input {
    min-height: var(--ui-control-height);
    padding: 10px 13px;
    color: var(--ui-ink);
    border: 1px solid var(--ui-border-strong);
    border-radius: var(--ui-radius-md);
    background: var(--ui-surface);
    box-shadow: var(--ui-shadow-xs);
    font-size: 13px;
    line-height: 1.35;
    font-weight: 600;
    transition: border-color var(--ui-motion-fast) ease,
      box-shadow var(--ui-motion-fast) ease,
      background-color var(--ui-motion-fast) ease;
  }

  body.portal-ui-v3 .portal-input::placeholder,
  body.portal-ui-v3 .portal-textarea::placeholder,
  body.portal-ui-v3 .portal-combobox-main-input::placeholder {
    color: var(--ui-muted-soft);
    opacity: 1;
  }

  body.portal-ui-v3 .portal-login-panel .portal-input-wrap > i {
    z-index: 1;
    left: 16px;
  }

  body.portal-ui-v3 .portal-login-panel .portal-input-wrap > .portal-input {
    padding-left: 44px;
  }

  body.portal-ui-v3 .portal-login-panel .portal-input-wrap > .portal-input[type="password"],
  body.portal-ui-v3 .portal-login-panel .portal-input-wrap > #portalPassword[type="text"] {
    padding-right: 48px;
  }

  body.portal-ui-v3 .portal-input:hover:not(:disabled):not([readonly]),
  body.portal-ui-v3 .portal-select:hover:not(:disabled),
  body.portal-ui-v3 .portal-textarea:hover:not(:disabled):not([readonly]),
  body.portal-ui-v3 .portal-inline-input:hover:not(:disabled):not([readonly]),
  body.portal-ui-v3 .portal-combobox-trigger:hover {
    border-color: #cbc7df;
  }

  body.portal-ui-v3 .portal-input:focus,
  body.portal-ui-v3 .portal-select:focus,
  body.portal-ui-v3 .portal-textarea:focus,
  body.portal-ui-v3 .portal-inline-input:focus,
  body.portal-ui-v3 .portal-combobox-main-input:focus,
  body.portal-ui-v3 .portal-combobox.open .portal-combobox-trigger {
    color: var(--ui-ink);
    border-color: var(--ui-primary);
    background: #fff;
    box-shadow: var(--ui-focus);
    outline: 0;
  }

  body.portal-ui-v3 .portal-input[readonly],
  body.portal-ui-v3 .portal-input:disabled,
  body.portal-ui-v3 .portal-select:disabled,
  body.portal-ui-v3 .portal-textarea:disabled {
    color: var(--ui-muted);
    border-color: var(--ui-border);
    background: var(--ui-surface-subtle);
    box-shadow: none;
  }

  /* Flatpickr keeps date fields readonly to prevent an invalid manual value.
     They are interactive controls, so Bank Nota must not style them as disabled. */
  body.portal-ui-v3 #taxBankPage .portal-date-input[readonly] {
    color: var(--ui-ink);
    border-color: var(--ui-border-strong);
    background-color: #fff;
    box-shadow: var(--ui-shadow-xs);
    cursor: pointer;
  }

  body.portal-ui-v3 #taxBankPage .portal-date-input[readonly]:hover {
    border-color: #c8c1ee;
  }

  body.portal-ui-v3 #taxBankPage .portal-date-input[readonly]:focus {
    border-color: var(--ui-primary);
    box-shadow: var(--ui-focus);
  }

  body.portal-ui-v3 .portal-combobox-menu,
  body.portal-ui-v3 .portal-action-menu-list,
  body.portal-ui-v3 .portal-calendar-menu,
  body.portal-ui-v3 .portal-month-picker {
    border-color: var(--ui-border);
    border-radius: var(--ui-radius-lg);
    background: rgba(255, 255, 255, .985);
    box-shadow: var(--ui-shadow-md);
    backdrop-filter: blur(18px);
  }

  body.portal-ui-v3 .portal-action-menu-list button,
  body.portal-ui-v3 .portal-combobox-option,
  body.portal-ui-v3 .portal-calendar-choice {
    min-height: 38px;
