      const nameCell = editing
        ? `<label class="portal-master-field"><span>Nama cabang</span><input class="portal-inline-input" data-master-name="${escapeHtml(branch.id)}" value="${escapeHtml(branch.name)}" aria-label="Nama cabang"></label>`
        : `<div class="portal-master-read-field"><span>Nama cabang</span><strong>${escapeHtml(branch.name)}</strong></div>`;
      const typeCell = editing
        ? `<label class="portal-master-field"><span>Jenis cabang</span><select class="portal-inline-input" data-master-type="${escapeHtml(branch.id)}" data-portal-combo aria-label="Jenis cabang"><option value="Mandiri" ${branch.type === 'Mandiri' ? 'selected' : ''}>Mandiri</option><option value="Central Kitchen" ${branch.type === 'Central Kitchen' ? 'selected' : ''}>Central Kitchen</option></select></label>`
        : `<div class="portal-master-read-field"><span>Jenis cabang</span><strong>${escapeHtml(branch.type)}</strong></div>`;
      return `<article data-master-row="${escapeHtml(branch.id)}" class="portal-master-card ${editing ? 'portal-master-row-editing' : ''}">
        <header class="portal-master-card-head">
          <span class="portal-master-index">${String(sequence).padStart(2, '0')}</span>
          <div class="portal-master-identity"><div class="portal-master-identity-grid">${nameCell}${typeCell}</div><span class="portal-master-code">ID ${escapeHtml(branch.id)}</span></div>
          <div data-master-status="${escapeHtml(branch.id)}"><span class="portal-badge ${safeUrl?'portal-badge-approved':'portal-badge-pending'}"><i class="bi ${safeUrl?'bi-check-circle-fill':'bi-exclamation-circle-fill'}"></i> ${invalidUrl?'Link tidak valid':safeUrl?'Terhubung':'Perlu link'}</span></div>
        </header>
        <div class="portal-master-connection">
          <label for="master-url-${escapeHtml(branch.id)}">URL Spreadsheet</label>
          <div class="portal-link-cell ${editing ? 'is-editable' : 'is-readonly'}"><i class="bi bi-file-earmark-spreadsheet"></i><input id="master-url-${escapeHtml(branch.id)}" class="portal-inline-input" data-master-url="${escapeHtml(branch.id)}" value="${escapeHtml(url)}" placeholder="${editing ? 'Tempel URL Google Spreadsheet' : 'Belum ada URL. Klik Edit untuk menambahkan.'}" aria-label="URL spreadsheet ${escapeHtml(branch.name)}" inputmode="url" autocomplete="off" spellcheck="false" ${editing ? '' : 'readonly aria-readonly="true"'}><a class="portal-link-open ${safeUrl ? '' : 'portal-hidden'}" data-master-open="${escapeHtml(branch.id)}" href="${escapeHtml(safeUrl || '#')}" target="_blank" rel="noopener noreferrer" title="Buka spreadsheet"><i class="bi bi-box-arrow-up-right"></i></a></div>
        </div>
        <footer class="portal-master-card-foot">
          <span><i class="bi bi-cloud-check"></i> ${safeUrl ? 'Tujuan siap digunakan' : 'Belum menjadi tujuan transaksi'}</span>

    body.querySelectorAll('[data-master-type]').forEach(input => input.addEventListener('change', () => markMasterUrlDirty(input.dataset.masterType)));

  function masterLinkPeriod() {
    return document.getElementById('taxLinkPeriod').value.replace('-', '') || monthNow().replace('-', '');
  }

  async function saveMasterBranchInline(id) {
    const branch = Portal.taxBranches.find(item => item.id === id);
    const row = document.querySelector(`[data-master-row="${safeCssEscape(id)}"]`);
    if (!branch || !row) return;
    const name = row.querySelector(`[data-master-name="${safeCssEscape(id)}"]`).value;
    const type = row.querySelector(`[data-master-type="${safeCssEscape(id)}"]`).value;
    const url = row.querySelector(`[data-master-url="${safeCssEscape(id)}"]`).value;
    const saveButton = row.querySelector(`[data-master-save="${safeCssEscape(id)}"]`);
    if (String(url || '').trim() && !strictSpreadsheetUrl(url)) {
      portalNotifyError('Link tidak valid', new Error('Gunakan URL HTTPS Google Spreadsheet dengan format https://docs.google.com/spreadsheets/d/...'));
      return;
    }
    setMasterRowBusy(row, true, saveButton, 'Menyimpan...');
    try {
      await api('UPSERT_MASTER_BRANCH', { id:branch.id, name, type, url, period:Portal.masterEditingPeriod || masterLinkPeriod() });
      Object.assign(branch, { name:String(name).trim(), type });
      Portal.taxLinks[id] = Object.assign({}, Portal.taxLinks[id] || {}, { url:String(url).trim(), spreadsheetUrl:String(url).trim() });
      Portal.masterEditingId = '';
      Portal.masterEditingPeriod = '';
      renderMasterLinks();
      Swal.fire({ toast:true, position:'top-end', icon:'success', title:'Baris diperbarui', showConfirmButton:false, timer:1400 });
    } catch (error) {
      Swal.fire('Gagal menyimpan perubahan', error.message, 'error');
      setMasterRowBusy(row, false, saveButton);
    }
  }

  function setMasterRowBusy(row, busy, button, label) {
    if (!row) return;
    row.classList.toggle('portal-master-row-busy', busy);
    row.querySelectorAll('input, select, button').forEach(control => { control.disabled = busy; });
    if (button) setBusy(button, busy, label || 'Memproses...');
  }

  function parseCsv(text) {
    const lines=String(text||'').trim().split(/\r?\n/).filter(Boolean); if(lines.length<2)throw new Error('CSV harus memiliki header dan minimal satu baris.');
    const headers=lines.shift().split(',').map(h=>h.trim()); return lines.map(line=>{const values=line.split(',').map(v=>v.trim());const row={};headers.forEach((h,i)=>row[h]=values[i]||'');return row;});
  }

  async function importBranchBulkFile(event) {

    const reader = new FileReader();
    reader.onerror = () => Swal.fire('File gagal dibaca', 'Pilih file Excel atau CSV yang valid.', 'error');
    reader.onload = async () => {
      try {
        const rows = isExcel ? NotaImport.workbookRows(XLSX.read(reader.result,{type:'array'}),'branch',XLSX) : NotaImport.csvRows(String(reader.result||''),'branch');

        const deleting = (preview.summary || {}).remove || 0;

        const confirm = await Swal.fire({ title:`Periksa ${total} perubahan cabang`, html:bulkBranchPreviewHtml(preview), icon:deleting ? 'warning' : 'question', customClass:{popup:'portal-import-dialog'}, showCancelButton:true, confirmButtonText:'Terapkan perubahan', confirmButtonColor:deleting ? '#c2414b' : undefined, cancelButtonText:'Batal', width:760 });
        if (!confirm.isConfirmed) return;

  function analyzeAccountImportRows(rows, existingAccounts) {
    const filledRows = (rows || []).filter(row => String(row && row.username || '').trim() !== '');
    const usernames = {};
    const existingUsernames = {};
    const existingBranches = {};
    const fileBranches = {};
    const errors = [];
    const branchWarnings = [];
    const roleCounts = { TOKO:0, TAX:0, ADMIN:0 };
    (existingAccounts || []).forEach(account => {
      const username = String(account && account.username || '').trim().toLocaleLowerCase('id-ID');
      if (username) existingUsernames[username] = account;
      if (String(account && account.role || '').toUpperCase() === 'TOKO') {
        const branchKey = String(account.branchId || account.branchName || '').trim().toLocaleUpperCase('id-ID');
        if (branchKey) existingBranches[branchKey] = account;
      }
    });
    filledRows.forEach((row, index) => {
      const rowNumber = row._sourceRow || index + 2;
      const username = String(row.username || '').trim().toLocaleLowerCase('id-ID');
      const role = String(row.role || '').trim().toUpperCase();
      if (!['TOKO','TAX','ADMIN'].includes(role)) errors.push(`Baris ${rowNumber}: role harus TOKO, TAX, atau ADMIN.`);
      else roleCounts[role] += 1;
      if (usernames[username]) errors.push(`Baris ${rowNumber}: username ${username} duplikat di file.`);
      else usernames[username] = true;
      if (existingUsernames[username]) errors.push(`Baris ${rowNumber}: username ${username} sudah tersedia pada daftar akun.`);
      if (row.password) {
        try { validatePortalPassword(String(row.password)); }
        catch (error) { errors.push(`Baris ${rowNumber}: ${error.message}`); }
      }
      if (role === 'TOKO') {
        const branchLabel = String(row.branchName || row.namaCabang || row.branchId || row.branchCode || '').trim();
        const branchKey = branchLabel.toLocaleUpperCase('id-ID');
        if (!branchKey) errors.push(`Baris ${rowNumber}: cabang wajib diisi untuk akun TOKO.`);
        else {
          if (existingBranches[branchKey]) branchWarnings.push(`Baris ${rowNumber}: ${branchLabel} sudah memiliki akun ${existingBranches[branchKey].username}.`);
          if (fileBranches[branchKey]) branchWarnings.push(`Baris ${rowNumber}: cabang ${branchLabel} muncul lebih dari sekali dalam file.`);
          fileBranches[branchKey] = true;
        }
      }
    });
    return { filledRows, errors, branchWarnings, roleCounts };
  }

  async function provisionAccountsRows(rows, options) {
    if (Portal.accountImportRunning) {
      Swal.fire({ toast:true, position:'top-end', icon:'info', title:'Import masih berjalan', showConfirmButton:false, timer:2600 });
      return;
    }
    Portal.accountImportRunning = true;
    const uploadButton = document.getElementById('taxUploadAccountsButton');
    const menuButton = document.getElementById('taxAccountImportMenuButton');
    const fileInput = document.getElementById('taxAccountsFile');
    if (uploadButton) uploadButton.disabled = true;
    if (menuButton) menuButton.disabled = true;
    if (fileInput) fileInput.disabled = true;
    try {
      Swal.fire({ title:'Memeriksa file…', text:'Mencocokkan username dan cabang. Belum ada akun yang dibuat.', allowOutsideClick:false, allowEscapeKey:false, showConfirmButton:false, didOpen:()=>Swal.showLoading() });
      const latestAccounts = await api('GET_ACCOUNTS');
      Portal.accounts = Array.isArray(latestAccounts) ? latestAccounts : [];
      const analysis = analyzeAccountImportRows(rows, Portal.accounts);
      const filledRows = analysis.filledRows;
      if (!filledRows.length) throw new Error('Isi minimal satu username pada template sebelum diimport.');
      if (analysis.errors.length) {
        await Swal.fire({ title:'Import dibatalkan', icon:'error', width:760, customClass:{popup:'portal-import-dialog'}, html:NotaImport.importErrorsHtml(analysis.errors, 'akun') });
        return;
      }
      const confirmation = await Swal.fire({
        title:`Konfirmasi import ${filledRows.length} akun`,
        icon:analysis.branchWarnings.length ? 'warning' : 'question',
        width:760,
        customClass:{popup:'portal-import-dialog'},
        html:accountImportPreviewHtml(analysis, options && options.fileName),
        showCancelButton:true,
        confirmButtonText:analysis.branchWarnings.length ? 'Tetap import akun tambahan' : 'Mulai import',
        cancelButtonText:'Batal',
        focusCancel:analysis.branchWarnings.length > 0,
        allowOutsideClick:false
      });
      if (!confirmation.isConfirmed) {
        const hint = document.getElementById('taxAccountsImportHint');
        if (hint) hint.textContent = 'Import dibatalkan. Tidak ada akun yang dibuat.';
        return;
      }
      const results = [];
      const batchSize = 25;
      const batchTotal = Math.ceil(filledRows.length / batchSize);
      Swal.fire({ title:'Mengimport akun…', html:'Menyiapkan proses import.', allowOutsideClick:false, allowEscapeKey:false, showConfirmButton:false, didOpen:()=>Swal.showLoading() });
      for (let offset = 0; offset < filledRows.length; offset += batchSize) {
        const batchNumber = Math.floor(offset / batchSize) + 1;
        const hint = document.getElementById('taxAccountsImportHint');
        if (hint) hint.textContent = `Memproses batch ${batchNumber}/${batchTotal} · ${Math.min(offset + batchSize, filledRows.length)}/${filledRows.length} akun`;
        updateAccountImportProgress(offset, filledRows.length, batchNumber, batchTotal);
        const batch = filledRows.slice(offset, offset + batchSize);
        try {
          const response = await api('PROVISION_ACCOUNTS', { rows:batch });
          results.push(...(response.results || []));
        } catch (error) {
          // Preserve credentials/results from earlier batches and make this batch's
          // failure explicit instead of losing the whole import summary.
          batch.forEach(row => results.push({
            username:String(row && row.username || '').trim(),
            success:false,
            error:error && error.message ? error.message : 'Batch gagal diproses.'
          }));
        }
        updateAccountImportProgress(Math.min(offset + batch.length, filledRows.length), filledRows.length, batchNumber, batchTotal);
      }
      const ok = results.filter(row => row.success); const fail = results.filter(row => !row.success);
      const hint = document.getElementById('taxAccountsImportHint');
      if (hint) hint.textContent = `Import selesai: ${ok.length} berhasil, ${fail.length} gagal dari ${filledRows.length} akun.`;
      await showOneTimeCredentials({
        title:fail.length ? 'Import akun selesai' : 'Akun berhasil diimport',
        intro:ok.length ? 'Salin kredensial sekarang. Password tidak disimpan dan tidak dapat ditampilkan kembali.' : 'Tidak ada akun baru yang berhasil dibuat.',
        rows:ok,
        failures:fail
      });
      await loadAccounts({ background:true }).catch(() => {});
    } catch(error) { Swal.fire('Import gagal', error.message, 'error'); }
    finally {
      Portal.accountImportRunning = false;
      if (uploadButton) uploadButton.disabled = false;
      if (menuButton) menuButton.disabled = false;
      if (fileInput) fileInput.disabled = false;
      if (fileInput) fileInput.value = '';
    }
  }

  async function copyPortalText(text) {
    const value = String(text == null ? '' : text);
    if (window.navigator && window.navigator.clipboard && typeof window.navigator.clipboard.writeText === 'function' && window.isSecureContext) {
      try {
        await window.navigator.clipboard.writeText(value);
        return true;
      } catch (error) {
        // Browser tertentu menolak Clipboard API walaupun halaman HTTPS.
        // Lanjutkan ke fallback selection tanpa mengubah isi password.
      }
    }
    const field = document.createElement('textarea');
    field.value = value;
    field.setAttribute('readonly', '');
    field.style.position = 'fixed';
    field.style.left = '-9999px';
    document.body.appendChild(field);
    field.select();
    const copied = document.execCommand('copy');
    field.remove();
    if (!copied) throw new Error('Browser menolak akses salin. Salin kredensial secara manual.');
    return true;
  }

  function portalCsvCell(value) {
    const text = String(value == null ? '' : value);
    return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;

  function portalCredentialCopyText(rows) {
    const credentials = Array.isArray(rows) ? rows : [];
    if (credentials.length === 1) return String(credentials[0] && credentials[0].password == null ? '' : credentials[0].password);
    return ['username,password'].concat(credentials.map(row => `${portalCsvCell(row && row.username)},${portalCsvCell(row && row.password)}`)).join('\n');
  }

  async function loadAccounts(options = {}) {
    if (!Portal.user || Portal.user.role !== 'ADMIN') return;
    const reloadBtn = document.getElementById('taxReloadAccounts');
    if (reloadBtn) setIconBusy(reloadBtn, true);
    try {
      const body = document.getElementById('taxAccountsBody');
      const pagination = document.getElementById('taxAccountsPagination');
      const firstLoad = !Portal.pageRendered.taxAccountsPage && !options.background;
      if (firstLoad && body) body.innerHTML = tableSkeleton(8, 7);
      if (firstLoad && pagination) pagination.innerHTML = '<div class="portal-skeleton" style="height:34px;width:210px"></div>';
      Portal.accounts = await api('GET_ACCOUNTS');
      if (!options.background) Portal.accountPage = 1;
      renderAccounts();
      Portal.pageLoadedAt.taxAccountsPage = Date.now();
      Portal.pageRendered.taxAccountsPage = true;
    } finally {
      if (reloadBtn) setIconBusy(reloadBtn, false);
    }
  }

  function renderAccounts() {
    const body = document.getElementById('taxAccountsBody');
    const role = document.getElementById('taxAccountsRoleFilter').value;
    const status = document.getElementById('taxAccountsStatusFilter').value;
    const query = (document.getElementById('taxAccountsQuery').value || '').trim().toLocaleLowerCase('id-ID');
    const rows = Portal.accounts.filter(account => (!role || account.role === role) && (!status || (status === 'active' ? account.active : !account.active)) && (!query || `${account.username} ${account.displayName} ${account.branchName || ''}`.toLocaleLowerCase('id-ID').includes(query)));
    const pageSize = 10;
    Portal.accountPage = renderPagination(document.getElementById('taxAccountsPagination'), Portal.accountPage, rows.length, pageSize, page => { Portal.accountPage = page; renderAccounts(); }) || 1;
    const visible = rows.slice((Portal.accountPage - 1) * pageSize, Portal.accountPage * pageSize);
    if (!visible.length) { body.innerHTML = '<tr><td colspan="8" class="portal-empty" style="text-align:center;padding:24px">Belum ada akun pada filter ini.</td></tr>'; return; }
    const pageOffset = (Portal.accountPage - 1) * pageSize;
    body.innerHTML = visible.map((account, index) => {
      const editable = account.role !== 'ADMIN' || account.uid === Portal.user.uid;
      const resettable = account.uid !== Portal.user.uid && (account.role === 'TOKO' || account.role === 'TAX');
      const passwordCell = resettable
        ? `<div class="portal-account-password"><span class="portal-password-mask" aria-label="Password tersimpan secara aman">••••••</span><button class="portal-btn portal-btn-soft" type="button" data-account-reset="${escapeHtml(account.uid)}"><i class="bi bi-key"></i> Ganti</button></div>`
        : account.uid === Portal.user.uid && account.role === 'ADMIN'
          ? '<button class="portal-btn portal-btn-soft" type="button" data-account-security><i class="bi bi-shield-lock"></i> Akun & Keamanan</button>'
          : '<span class="portal-row-muted"><i class="bi bi-lock-fill"></i> Terlindungi</span>';
      return `<tr><td><span class="portal-account-number">${pageOffset + index + 1}</span></td><td><strong>${escapeHtml(account.username)}</strong></td><td>${escapeHtml(account.displayName)}</td><td><span class="portal-badge ${account.role === 'ADMIN' ? 'portal-badge-pending' : 'portal-badge-approved'}">${escapeHtml(account.role)}</span></td><td>${escapeHtml(account.branchName || '-')}</td><td><span class="portal-badge ${account.active ? 'portal-badge-approved' : 'portal-badge-correction'}">${account.active ? 'Aktif' : 'Nonaktif'}</span></td><td>${passwordCell}</td><td><div class="portal-inline-actions">${editable ? `<button class="portal-btn portal-btn-soft" data-account-edit="${escapeHtml(account.uid)}"><i class="bi bi-pencil-square"></i> Edit</button>` : '<span class="portal-row-muted">Terlindungi</span>'}${Portal.user.role === 'ADMIN' && account.uid !== Portal.user.uid && account.role !== 'ADMIN' ? `<button class="portal-btn portal-btn-soft" data-account-toggle="${escapeHtml(account.uid)}" data-next-active="${account.active ? 'false' : 'true'}">${account.active ? 'Nonaktifkan' : 'Aktifkan'}</button>` : ''}</div></td></tr>`;
    }).join('');
    body.querySelectorAll('[data-account-edit]').forEach(button => button.addEventListener('click', () => openAccountEdit(Portal.accounts.find(account => account.uid === button.dataset.accountEdit))));
    body.querySelectorAll('[data-account-toggle]').forEach(button => button.addEventListener('click', () => toggleAccountActive(button)));
    body.querySelectorAll('[data-account-reset]').forEach(button => button.addEventListener('click', () => resetAccountPassword(button)));
    body.querySelectorAll('[data-account-security]').forEach(button => button.addEventListener('click', () => showPage('tokoAccountPage')));
  }

  async function resetAccountPassword(button) {
    if (!button || button.disabled) return;
    const uid = String(button.dataset.accountReset || '');
    const account = Portal.accounts.find(item => item.uid === uid);
    if (!account) return;
    const passwordDialog = await Swal.fire({
      title:'Ganti password akun',
      width:560,
      html:`<div style="text-align:left"><p class="portal-row-muted" style="margin:0 0 16px">Tetapkan password final untuk <strong>${escapeHtml(account.username)}</strong>. Pengguna dapat langsung login dengan password ini; seluruh sesi lamanya akan dicabut.</p><div class="portal-field"><label class="portal-label" for="managedAccountPassword">Password baru</label><input id="managedAccountPassword" class="portal-input" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"></div><div class="portal-field" style="margin-bottom:0"><label class="portal-label" for="managedAccountPasswordConfirm">Ulangi password baru</label><input id="managedAccountPasswordConfirm" class="portal-input" type="password" autocomplete="new-password" placeholder="Ketik ulang password"></div><p class="portal-row-muted" style="margin:12px 0 0">Wajib mengandung huruf besar, huruf kecil, angka, dan simbol. Password membedakan huruf besar/kecil.</p></div>`,
      showCancelButton:true,
      confirmButtonText:'Ganti password',
      cancelButtonText:'Batal',
      focusConfirm:false,
      didOpen:() => document.getElementById('managedAccountPassword')?.focus({ preventScroll:true }),
      preConfirm:() => {
        const password = document.getElementById('managedAccountPassword').value;
        const confirmation = document.getElementById('managedAccountPasswordConfirm').value;
        try { validatePortalPassword(password); }
        catch (error) { Swal.showValidationMessage(error.message); return false; }
        if (password !== confirmation) { Swal.showValidationMessage('Konfirmasi password belum sama.'); return false; }
        return password;
      }
    });
    if (!passwordDialog.isConfirmed) return;
    let newPassword = passwordDialog.value;
    setBusy(button, true, 'Mengganti...');
    Swal.fire({ title:'Mengganti password...', text:'Menyimpan password final dan mencabut sesi lama.', allowOutsideClick:false, allowEscapeKey:false, showConfirmButton:false, didOpen:()=>Swal.showLoading() });
    try {
      const result = await api('RESET_ACCOUNT_PASSWORD', { uid, newPassword });
      if (result && result.account) {
        const index = Portal.accounts.findIndex(item => item.uid === uid);
        if (index >= 0) Portal.accounts[index] = result.account;
        renderAccounts();
      }
      await Swal.fire('Password berhasil diganti', `${account.username} dapat langsung login menggunakan password baru.`, 'success');
      loadAccounts({ background:true }).catch(() => {});
    } catch (error) {
      const uncertain = /terlalu lama|network|failed to fetch|koneksi|tidak merespons/i.test(String(error && error.message || error));
      Swal.fire(
        uncertain ? 'Status perubahan belum dapat dipastikan' : 'Ganti password gagal',
        uncertain ? 'Koneksi terputus saat proses berlangsung. Muat ulang daftar akun sebelum mencoba lagi; sistem tidak melakukan retry otomatis.' : error.message,
        uncertain ? 'warning' : 'error'
      );
    } finally {
      newPassword = '';
      if (button.isConnected) setBusy(button, false);
    }
  }

  async function toggleAccountActive(button) {
    if (!button || button.disabled) return;
    const uid = String(button.dataset.accountToggle || '');
    const nextActive = button.dataset.nextActive === 'true';
    const account = Portal.accounts.find(item => item.uid === uid);
    const accountName = account && (account.displayName || account.username) || 'Akun';
    const progressText = nextActive ? 'Mengaktifkan...' : 'Menonaktifkan...';
    setBusy(button, true, progressText);
    try {
      await api('SET_ACCOUNT_ACTIVE', { uid, active:nextActive });
      if (account) account.active = nextActive;
      renderAccounts();
      Swal.fire({
        toast:true,
        position:'top-end',
        icon:'success',
        title:nextActive ? 'Akun diaktifkan' : 'Akun dinonaktifkan',
        text:`${accountName} sekarang ${nextActive ? 'dapat' : 'tidak dapat'} masuk ke aplikasi.`,
        showConfirmButton:false,
        timer:2400,
        timerProgressBar:true
      });
      loadAccounts({ background:true }).catch(() => {});
    } catch (error) {
      setBusy(button, false);
      Swal.fire({
        toast:true,
        position:'top-end',
        icon:'error',
        title:nextActive ? 'Gagal mengaktifkan akun' : 'Gagal menonaktifkan akun',
        text:error.message,
        showConfirmButton:false,
        timer:3200,
        timerProgressBar:true
      });
    }
  }

  async function openAccountEdit(account) {
    if (!account) return;
    const canSetRole = Portal.user.role === 'ADMIN' && account.uid !== Portal.user.uid;
    const result = await Swal.fire({
      title:'Edit akun', width:680,
      html:`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left"><div><label class="portal-label">Username</label><input id="accountEditUsername" class="portal-input" value="${escapeHtml(account.username)}"></div><div><label class="portal-label">Nama</label><input id="accountEditName" class="portal-input" value="${escapeHtml(account.displayName)}"></div><div><label class="portal-label">Role</label><select id="accountEditRole" class="portal-select" data-portal-combo ${canSetRole ? '' : 'disabled'}><option value="TOKO" ${account.role === 'TOKO' ? 'selected' : ''}>TOKO</option><option value="TAX" ${account.role === 'TAX' ? 'selected' : ''}>TAX</option><option value="ADMIN" ${account.role === 'ADMIN' ? 'selected' : ''}>ADMIN</option></select></div><input id="accountEditBranchId" type="hidden" value="${escapeHtml(account.branchId || '')}"><div><label class="portal-label">Nama Cabang</label><input id="accountEditBranchName" class="portal-input" value="${escapeHtml(account.branchName || '')}" ${account.role === 'TOKO' ? '' : 'disabled'}></div><div><label class="portal-label">Tipe Cabang</label><select id="accountEditBranchType" class="portal-select" data-portal-combo ${account.role === 'TOKO' ? '' : 'disabled'}><option value="Mandiri">Mandiri</option><option value="Central Kitchen">Central Kitchen</option></select></div><p style="grid-column:span 2;margin:0;color:var(--portal-muted);font-size:11px;font-weight:700">ID dan tipe cabang dicocokkan otomatis dengan Master Link. Gunakan tombol Ganti pada kolom Password untuk menetapkan password final akun TAX/TOKO.</p></div>`,
      showCancelButton:true, confirmButtonText:'Simpan perubahan', cancelButtonText:'Batal',
      didOpen: () => {
        const popup = Swal.getPopup();
        const role = document.getElementById('accountEditRole');
        const branchName = document.getElementById('accountEditBranchName');
        const type = document.getElementById('accountEditBranchType');
        if (type) type.value = account.branchType || 'Mandiri';
        const syncBranchAccess = () => {
          const isStore = role && role.value === 'TOKO';
          if (branchName) branchName.disabled = !isStore;
          if (type) {
            type.disabled = !isStore;
            refreshPortalCombo(type);
          }
        };
        if (role) role.addEventListener('change', syncBranchAccess);
        setupPortalControls(popup);
        syncBranchAccess();
      },
      preConfirm: () => {
        return { uid:account.uid, username:document.getElementById('accountEditUsername').value, displayName:document.getElementById('accountEditName').value, role:document.getElementById('accountEditRole').value, branchId:document.getElementById('accountEditBranchId').value, branchName:document.getElementById('accountEditBranchName').value, branchType:document.getElementById('accountEditBranchType').value };
      }
    });
    if (!result.isConfirmed) return;
    Swal.fire({
      title:'Menyimpan perubahan...',
      text:'Data akun sedang diperbarui. Mohon tunggu.',
      allowOutsideClick:false,
      allowEscapeKey:false,
      showConfirmButton:false,
      didOpen:() => Swal.showLoading()
    });
    try {
      const response = await api('UPDATE_ACCOUNT', result.value);
      if (response && response.account) {
        const saved = response.account;
        const index = Portal.accounts.findIndex(item => item.uid === saved.uid);
        if (index >= 0) Portal.accounts[index] = saved;
        else Portal.accounts.push(saved);
        Portal.accounts.sort((left, right) => String(left.username || '').localeCompare(String(right.username || '')));
        if (Portal.user && saved.uid === Portal.user.uid) {
          Portal.user.username = saved.username;
          Portal.user.displayName = saved.displayName;
          Portal.user.role = saved.role;
          Portal.user.branchId = saved.branchId || '';
          Portal.user.branchName = saved.branchName || '';
        }
        renderAccounts();
      }
      await Swal.fire('Tersimpan', 'Data akun berhasil diperbarui dan daftar sudah disegarkan.', 'success');
      loadAccounts({ background:true }).catch(() => {});
    } catch (error) {
      await Swal.fire('Gagal menyimpan akun', error.message, 'error');
    }
  }

  function ensureExpenseMatrixUi(type) {
    if (type === 'listrik') {
      const page=document.getElementById('listrikPage');
      const body=document.getElementById('kontrolTableBody');
      if(!page||!body||page.dataset.matrixEnhanced==='true')return;
      page.dataset.matrixEnhanced='true';
      const title=document.querySelector('#tabListrikKontrol h3');if(title)title.textContent='Matriks Nota Listrik';
      const header=title&&title.parentElement;
      const search=document.createElement('label');search.className='portal-expense-matrix-search';search.innerHTML='<span class="sr-only">Cari cabang pada matriks listrik</span><i class="bi bi-search"></i><input id="listrikMatrixSearch" type="search" autocomplete="off" placeholder="Cari cabang">';
      if(header)header.insertBefore(search,header.lastElementChild);
      const wrap=body.closest('.overflow-x-auto');if(wrap)wrap.classList.add('portal-expense-matrix-box');
      lockApprovedBankActions('listrikTableBody');
      const apply=()=>{const query=String(search.querySelector('input').value||'').trim().toLocaleLowerCase('id-ID');let shown=0;body.querySelectorAll('tr').forEach(row=>{const match=!query||String(row.querySelector('td')?.textContent||'').toLocaleLowerCase('id-ID').includes(query);const visible=match&&shown<50;row.hidden=!visible;if(visible)shown++;});body.querySelectorAll('[data-listrik-action="kontrol"]').forEach(button=>{button.title=String(button.title||'').replace(/^Lunas:/,'Nota tercatat:');});};
      search.querySelector('input').addEventListener('input',()=>schedulePortalInputWork('listrik-matrix-search',apply));
      new MutationObserver(apply).observe(body,{childList:true});apply();
      return;
    }
    const page=document.getElementById('umumPage');if(!page||page.dataset.matrixEnhanced==='true')return;
    page.dataset.matrixEnhanced='true';
    lockApprovedBankActions('umumTableBody');
    const header=page.firstElementChild,detail=header&&header.nextElementSibling;if(!header||!detail)return;
    detail.id='tabUmumDetail';
    const toggle=document.createElement('div');toggle.className='portal-expense-view-toggle';toggle.setAttribute('role','tablist');toggle.setAttribute('aria-label','Tampilan Nota Umum');toggle.innerHTML='<button type="button" class="is-active" data-umum-view="list" role="tab" aria-selected="true">Daftar</button><button type="button" data-umum-view="matrix" role="tab" aria-selected="false">Matriks</button>';
    header.appendChild(toggle);
    const matrix=document.createElement('section');matrix.id='tabUmumMatrix';matrix.className='portal-expense-matrix-panel portal-hidden';matrix.innerHTML='<div class="portal-expense-matrix-toolbar"><div><h2>Matriks Nota Umum</h2><p>Nota yang sudah disetujui berdasarkan tanggal transaksi.</p></div><div class="portal-expense-matrix-controls"><label class="portal-expense-matrix-search"><span class="sr-only">Cari cabang</span><i class="bi bi-search"></i><input id="umumMatrixSearch" type="search" autocomplete="off" placeholder="Cari cabang"></label><input id="umumMatrixMonth" type="hidden" data-portal-month></div></div><div id="umumMatrixBox" class="portal-expense-matrix-box" aria-live="polite"></div><div id="umumMatrixPagination" class="portal-pagination"></div>';
    detail.insertAdjacentElement('afterend',matrix);
    const month=matrix.querySelector('#umumMatrixMonth');month.value=monthNow();setupPortalControls(matrix);
    toggle.querySelectorAll('[data-umum-view]').forEach(button=>button.addEventListener('click',()=>{
      const matrixMode=button.dataset.umumView==='matrix';detail.classList.toggle('portal-hidden',matrixMode);matrix.classList.toggle('portal-hidden',!matrixMode);
      toggle.querySelectorAll('button').forEach(item=>{const active=item===button;item.classList.toggle('is-active',active);item.setAttribute('aria-selected',String(active));});
      if(matrixMode)loadExpenseMatrix('umum');
    }));
    matrix.querySelector('#umumMatrixSearch').addEventListener('input',()=>schedulePortalInputWork('umum-matrix-search',()=>{Portal.umumMatrixPage=1;loadExpenseMatrix('umum');}));
    month.addEventListener('change',()=>{Portal.umumMatrixPage=1;loadExpenseMatrix('umum');});
  }

  async function loadExpenseMatrix(type) {
    const root=document.getElementById(type==='umum'?'umumMatrixBox':'listrikMatrixBox');if(!root)return;
    const month=document.getElementById(type==='umum'?'umumMatrixMonth':'listrikMatrixMonth');
    const search=document.getElementById(type==='umum'?'umumMatrixSearch':'listrikMatrixSearch');
    const pageKey=type==='umum'?'umumMatrixPage':'listrikMatrixPage';Portal[pageKey]=Number(Portal[pageKey]||1);
    root.setAttribute('aria-busy','true');root.innerHTML='<div class="portal-expense-matrix-state"><i class="bi bi-arrow-repeat"></i><span>Memuat matriks nota...</span></div>';
    try {
      const data=await api('GET_EXPENSE_MATRIX',{type,month:(month&&month.value)||monthNow(),search:search?search.value:'',page:Portal[pageKey],limit:25});
      if(!data.branches.length){root.innerHTML='<div class="portal-expense-matrix-state"><i class="bi bi-inbox"></i><strong>Cabang tidak ditemukan</strong><span>Ubah pencarian atau bulan yang dipilih.</span></div>';renderPagination(document.getElementById(type==='umum'?'umumMatrixPagination':'listrikMatrixPagination'),1,0,25,()=>{});return;}
      const days=Array.from({length:Number(data.days)},(_,index)=>index+1);
      root.innerHTML=`<table class="portal-expense-matrix-table"><thead><tr><th>Cabang</th>${days.map(day=>`<th>${day}</th>`).join('')}</tr></thead><tbody>${data.branches.map(branch=>`<tr><th scope="row"><strong>${escapeHtml(branch.name)}</strong><span>${escapeHtml(branch.id)}</span></th>${days.map(day=>{const cell=data.cells[branch.id]&&data.cells[branch.id][day];return cell?`<td><button type="button" data-matrix-branch="${escapeHtml(branch.id)}" data-matrix-day="${day}" aria-label="${cell.count} nota ${branch.name} tanggal ${day}, total ${rupiah(cell.total)}"><strong>${cell.count}</strong><span>${escapeHtml(compactRupiah(cell.total))}</span></button></td>`:'<td><span class="portal-matrix-empty" aria-label="Tidak ada nota">·</span></td>'}).join('')}</tr>`).join('')}</tbody></table>`;
      root.querySelectorAll('[data-matrix-branch]').forEach(button=>button.addEventListener('click',()=>{
        const cell=data.cells[button.dataset.matrixBranch][Number(button.dataset.matrixDay)],branch=data.branches.find(item=>item.id===button.dataset.matrixBranch);
        const rows=cell.records.map(record=>`<tr><td>${escapeHtml(record[8]||record[10]||'-')}</td><td>${escapeHtml(record[10]||record[7]||'-')}</td><td>${escapeHtml(rupiah(record[5]))}</td></tr>`).join('');
        Swal.fire({title:`${escapeHtml(branch.name)} · ${button.dataset.matrixDay} ${new Date(data.month+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'})}`,width:720,html:`<div class="portal-history-detail"><table><thead><tr><th>Keterangan</th><th>Jenis</th><th>Nominal</th></tr></thead><tbody>${rows}</tbody></table><p><strong>Total ${escapeHtml(rupiah(cell.total))}</strong></p></div>`,confirmButtonText:'Tutup'});
      }));
      renderPagination(document.getElementById(type==='umum'?'umumMatrixPagination':'listrikMatrixPagination'),data.page,data.totalBranches,data.limit,next=>{Portal[pageKey]=next;loadExpenseMatrix(type);});
    } catch(error) {root.innerHTML=`<div class="portal-expense-matrix-state is-error"><i class="bi bi-exclamation-triangle"></i><strong>Matriks gagal dimuat</strong><span>${escapeHtml(error.message)}</span></div>`;}
    finally {root.removeAttribute('aria-busy');}
  }

  function lockApprovedBankActions(tableBodyId) {
    const body=document.getElementById(tableBodyId);if(!body||body.dataset.approvedRowsLocked==='true')return;
    body.dataset.approvedRowsLocked='true';
    const apply=()=>body.querySelectorAll('[data-listrik-action="edit"][data-listrik-value^="APR-"]').forEach(button=>{const cell=button.closest('td');if(cell)cell.innerHTML='<span class="portal-bank-readonly"><i class="bi bi-shield-check"></i> Hasil ACC</span>';});
    new MutationObserver(apply).observe(body,{childList:true});apply();
  }

  function compactRupiah(value) {
    const amount=Number(value)||0;if(amount>=1000000000)return 'Rp '+(amount/1000000000).toLocaleString('id-ID',{maximumFractionDigits:1})+' M';if(amount>=1000000)return 'Rp '+(amount/1000000).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt';if(amount>=1000)return 'Rp '+(amount/1000).toLocaleString('id-ID',{maximumFractionDigits:0})+' rb';return 'Rp '+amount.toLocaleString('id-ID');
  }

  window.portalShowPage = showPage;
  window.portalGetMasterLinks = function(period) {
    return api('GET_MASTER_LINKS', { period: String(period || monthNow().replace('-', '')).replace('-', '') });
  };

  Object.assign(window.PortalFeatures, {
    applyTaxFilterChange, changeTaxPhotoZoom, closeTaxPhotoPanel, confirmLeaveTaxEdit, downloadAccountTemplate, downloadBranchTemplate,
    fitTaxPhoto,
    importAccountsFile, importBranchBulkFile, loadAccounts, loadMasterLinks, loadTaxBank,
    ensureExpenseMatrixUi, loadTaxEntryReceipts, openManualAccountDialog, openMasterBranchDialog, openTaxPhotoPanel, closeTaxReviewWorkspace,
    clearTaxBulkSelection, reloadTaxBankWithGuard, renderAccounts, renderMasterLinks, requestTaxReceiptSelection, resetTaxPhotoViewer, rotateTaxPhoto, saveTaxEdit,
    restoreDiscardedReceipt, selectTaxReceipt, setTaxQueueDrawer, setTaxQueueQuery, setTaxReviewTab, stageTaxBulkDecision, stageTaxDecision,
    submitTaxDecisions, toggleTaxBatchMode, toggleTaxPhotoFullscreen
  });
})(window.PortalCore);
window.PORTAL_MODULES_READY = true;
</script>
