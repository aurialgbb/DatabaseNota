      Swal.fire({ toast:true, position:'top-end', icon:result.success ? 'success' : 'warning', title:result.success ? 'Foto berhasil dibaca' : 'Foto masih belum terbaca', showConfirmButton:false, timer:2200 });
    } catch (error) {
      Swal.fire('Retry gagal', error.message, 'error');
    } finally { setBusy(button, false); }
  }

  async function processStoreOcr() {
    const button = document.getElementById('tokoProcessOcr');
    setBusy(button, true, 'Membaca nota...');
    try {
      const files = Portal.selectedFiles.slice(0, 5);
      if (!files.length) throw new Error('Pilih minimal satu foto nota.');
      Portal.removedReceiptIds = {};
      renderStoreOcrProgress(files);
      const batch = await withTimeout(api('START_STORE_OCR', { photoCount:files.length }), 20000, 'Batch OCR gagal dimulai. Periksa koneksi lalu coba kembali.');
      Portal.uploadId = batch.uploadId;
      const photos = new Array(files.length);
      let nextIndex = 0;
      let completed = 0;
      const worker = async () => {
        while (nextIndex < files.length) {
          const index = nextIndex++;
          try { photos[index] = await processStoreOcrPhoto(batch.uploadId, files[index], index, files.length); }
          catch (error) { photos[index] = { success:false, index, fileName:files[index].name, receipts:[], warnings:['Foto gagal diproses.'], error:error.message }; }
          completed++;
          updateStoreOcrProgress(index, photos[index].success ? 'done' : 'failed', photos[index].success ? `${(photos[index].receipts || []).length} nota ditemukan` : (photos[index].error || 'Gunakan input manual'), completed, files.length);
        }
      };
      await Promise.all(Array.from({ length:Math.min(2,files.length) }, worker));
      try {
        const finalized = await withTimeout(api('FINALIZE_STORE_OCR', { uploadId:batch.uploadId }), 20000, 'Finalisasi OCR terlalu lama.');
        (finalized.photos || []).forEach(photo => { if (photo && photo.clientPhotoId) { const i = photos.findIndex(item => item && item.clientPhotoId === photo.clientPhotoId); if (i >= 0) photos[i] = photo; } });
      } catch (error) {}
      Portal.resubmitId = '';
      Portal.ocrPhotoResults = photos;
      Portal.ocrReceipts = [];
      Portal.activeReceiptIndex = 0;
      rebuildReceiptsFromOcrPhotos();
      setStoreDraftDirty(true, 'Hasil OCR belum dikirim');
      renderStoreOcrFeedback();
      renderStoreEditors();
      document.getElementById('tokoOcrReview').classList.remove('portal-hidden');
      document.getElementById('tokoOcrReview').scrollIntoView({behavior:'smooth'});
    } catch (error) { Swal.fire('Pembacaan gagal', error.message, 'error'); }
    finally { setBusy(button, false); }
  }

  function discountText(value) {
    return String(value || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
  }

  function normalizeDraftAdjustment(adjustment) {
    adjustment = adjustment || {};
    const amount = Math.abs(Math.round(parseIdNumber(adjustment.amount || 0)));
    const targetHint = String(adjustment.targetHint || '').trim();
    const targetItemIndex = adjustment.targetItemIndex == null || adjustment.targetItemIndex === '' ? null : Number(adjustment.targetItemIndex);
    return {
      type:'DISCOUNT',
      description:String(adjustment.description || 'DISKON').trim() || 'DISKON',
      amount,
      targetType:String(adjustment.targetType || (targetHint ? 'ITEM' : 'RECEIPT')).toUpperCase() === 'ITEM' ? 'ITEM' : 'RECEIPT',
      targetHint,
      targetItemIndex:Number.isInteger(targetItemIndex) && targetItemIndex >= 0 ? targetItemIndex : null
    };
  }

  function allocateReceiptDraft(source) {
    const receipt = Object.assign({}, source || {});
    const sourceItems = Array.isArray(receipt.items) ? receipt.items : [];
    const explicitAdjustments = Array.isArray(receipt.adjustments) ? receipt.adjustments : [];
    const adjustments = explicitAdjustments.map(normalizeDraftAdjustment).filter(Boolean);
    const items = sourceItems.map((item, index) => {
      const legacyDiscount = Math.max(0, Math.round(parseIdNumber(item && item.discountAllocated || 0)));
      const grossValue = item && item.grossAmount != null && item.grossAmount !== '' ? item.grossAmount : parseIdNumber(item && item.amount || 0) + legacyDiscount;
      if (!explicitAdjustments.length && legacyDiscount) adjustments.push(normalizeDraftAdjustment({type:'DISCOUNT',description:'DISKON ITEM',amount:legacyDiscount,targetType:'ITEM',targetItemIndex:index,targetHint:item.description || ''}));
      return Object.assign({}, item || {}, { grossAmount:Math.max(0, Math.round(parseIdNumber(grossValue))), discountAllocated:0, amount:Math.max(0, Math.round(parseIdNumber(grossValue))) });
    });
    const warnings = [];
    const general = [];
    let valid = items.length > 0;
    adjustments.forEach(adjustment => {
      let targetIndex = Number.isInteger(adjustment.targetItemIndex) ? adjustment.targetItemIndex : -1;
      if (targetIndex < 0 && adjustment.targetType === 'ITEM' && adjustment.targetHint) {
        const hint = discountText(adjustment.targetHint);
        const matches = [];
        items.forEach((item, index) => {
          const description = discountText(item.description || '');
          if (description && hint && (description.includes(hint) || hint.includes(description))) matches.push(index);
        });
        if (matches.length === 1) targetIndex = matches[0];
      }
      if (adjustment.targetType === 'ITEM' && targetIndex >= 0 && items[targetIndex]) {
        const available = Math.max(0, items[targetIndex].grossAmount - items[targetIndex].discountAllocated);
        if (adjustment.amount > available) { valid = false; warnings.push(`Diskon ${adjustment.description} melebihi nominal item.`); }
        items[targetIndex].discountAllocated += Math.min(adjustment.amount, available);
        adjustment.targetItemIndex = targetIndex;
      } else {
        if (adjustment.targetType === 'ITEM') warnings.push(`Target ${adjustment.description} tidak pasti; dialokasikan proporsional.`);
        general.push(adjustment);
      }
    });
    const bases = items.map(item => Math.max(0, item.grossAmount - item.discountAllocated));
    const availableTotal = bases.reduce((sum, value) => sum + value, 0);
    const requestedGeneral = general.reduce((sum, adjustment) => sum + adjustment.amount, 0);
    if (requestedGeneral > availableTotal) { valid = false; warnings.push('Total diskon melebihi subtotal nota.'); }
    const allocatable = Math.min(requestedGeneral, availableTotal);
    if (allocatable && availableTotal) {
      const allocations = bases.map((base, index) => {
        const exact = allocatable * base / availableTotal;
        return {index, amount:Math.floor(exact), remainder:exact - Math.floor(exact)};
      });
      let distributed = allocations.reduce((sum, allocation) => sum + allocation.amount, 0);
      allocations.slice().sort((a,b) => b.remainder - a.remainder || bases[b.index] - bases[a.index] || a.index - b.index).forEach(allocation => {
        if (distributed < allocatable && allocation.amount < bases[allocation.index]) { allocation.amount++; distributed++; }
      });
      allocations.forEach(allocation => { items[allocation.index].discountAllocated += allocation.amount; });
    }
    items.forEach(item => {
      item.discountAllocated = Math.max(0, Math.round(item.discountAllocated));
      item.amount = Math.max(0, item.grossAmount - item.discountAllocated);
    });
    const grossTotal = items.reduce((sum,item) => sum + item.grossAmount, 0);
    const discountTotal = items.reduce((sum,item) => sum + item.discountAllocated, 0);
    const requestedDiscount = adjustments.reduce((sum,adjustment) => sum + adjustment.amount, 0);
    receipt.items = items;
    receipt.adjustments = adjustments;
    receipt.grossTotal = grossTotal;
    receipt.discountTotal = discountTotal;
    receipt.receiptTotal = grossTotal - discountTotal;
    receipt.calculationWarnings = warnings;
    receipt.calculationValid = valid && discountTotal === requestedDiscount;
    return receipt;
  }

  function setStoreDraftDirty(dirty, message) {
    Portal.storeDraftDirty = Boolean(dirty);
    const status = document.getElementById('tokoDraftStatus');
    if (status) status.textContent = message || (Portal.storeDraftDirty ? 'Perubahan tersimpan di draft' : 'Draft siap diperiksa');
    if (Portal.storeDraftDirty) scheduleStoreDraftRecoverySave();
    else clearStoreDraftRecovery();
  }

  function storeDraftRecoveryKey(userId) {
    return 'gbb_store_draft_' + String(userId || Portal.user && Portal.user.uid || '');
  }

  function clearStoreDraftRecovery(userId) {
    const key = storeDraftRecoveryKey(userId);
    if (!key.endsWith('_')) storageRemove(key);
    if (Portal.storeDraftPersistTimer) window.clearTimeout(Portal.storeDraftPersistTimer);
    Portal.storeDraftPersistTimer = null;
  }

  function sanitizeStoreDraftRecovery(value) {
    return JSON.parse(JSON.stringify(value, (key, entry) => /^(dataUrl|base64|bytes|previewUrl|token|password)$/i.test(key) ? undefined : entry));
  }

  function scheduleStoreDraftRecoverySave() {
    if (!Portal.user || Portal.user.role !== 'TOKO') return;
    if (Portal.storeDraftPersistTimer) window.clearTimeout(Portal.storeDraftPersistTimer);
    Portal.storeDraftPersistTimer = window.setTimeout(() => {
      try {
        const editorRoot = document.getElementById('tokoReceiptEditors');
        if (editorRoot && !editorRoot.classList.contains('portal-hidden') && Portal.ocrReceipts.length) {
          Portal.ocrReceipts = collectReceiptEditors('tokoReceiptEditors', Portal.ocrReceipts);
        }
        const snapshot = sanitizeStoreDraftRecovery({
          savedAt:Date.now(), uploadId:Portal.uploadId || '', resubmitId:Portal.resubmitId || '',
          activeReceiptIndex:Number(Portal.activeReceiptIndex || 0), ocrReceipts:Portal.ocrReceipts.slice(0, 20),
          ocrPhotoResults:Portal.ocrPhotoResults.slice(0, 5), removedReceiptIds:Portal.removedReceiptIds || {}
        });
        if (snapshot.ocrReceipts.length) window.sessionStorage.setItem(storeDraftRecoveryKey(), JSON.stringify(snapshot));
      } catch (error) {}
    }, 350);
  }

  function restoreStoreDraftRecovery() {
    if (!Portal.user || Portal.user.role !== 'TOKO' || Portal.storeDraftRecoveryChecked) return;
    Portal.storeDraftRecoveryChecked = true;
    try {
      const raw = window.sessionStorage.getItem(storeDraftRecoveryKey());
      if (!raw) return;
      const snapshot = JSON.parse(raw);
      if (!snapshot || Date.now() - Number(snapshot.savedAt || 0) > 12 * 60 * 60 * 1000 || !Array.isArray(snapshot.ocrReceipts) || !snapshot.ocrReceipts.length) {
        clearStoreDraftRecovery();
        return;
      }
      Portal.uploadId = String(snapshot.uploadId || '');
      Portal.resubmitId = String(snapshot.resubmitId || '');
      Portal.ocrReceipts = snapshot.ocrReceipts.slice(0, 20).map(receipt => allocateReceiptDraft(receipt));
      Portal.ocrPhotoResults = Array.isArray(snapshot.ocrPhotoResults) ? snapshot.ocrPhotoResults.slice(0, 5) : [];
      Portal.removedReceiptIds = snapshot.removedReceiptIds || {};
      Portal.activeReceiptIndex = Math.max(0, Math.min(Number(snapshot.activeReceiptIndex || 0), Portal.ocrReceipts.length - 1));
      renderStoreOcrFeedback();
      renderStoreEditors();
      const review = document.getElementById('tokoOcrReview');
      if (review) review.classList.remove('portal-hidden');
      Portal.storeDraftDirty = true;
      const status = document.getElementById('tokoDraftStatus');
      if (status) status.textContent = 'Draft dipulihkan dari sesi browser ini';
      Swal.fire({ toast:true, position:'top-end', icon:'info', title:'Draft nota dipulihkan', showConfirmButton:false, timer:2200 });
    } catch (error) { clearStoreDraftRecovery(); }
  }

  function markStoreDraftDirty(dirty, message) {
    setStoreDraftDirty(dirty, message);
  }

  function blankReceipt(photoId = '') {
    return allocateReceiptDraft({ photoId, supplier:'', date:isoToday(), adjustments:[], receiptTotal:0, items:[{description:'',category:'LAIN-LAIN',quantity:1,unit:'',grossAmount:0,amount:0}] });
  }

  function categoryOptions(selected) {
    return Portal.categories.map(c => `<option value="${escapeHtml(c.name)}" ${c.name === selected ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
  }

  function syncStoreEditorState() {
    const root = document.getElementById('tokoReceiptEditors');
    if (!root || !root.querySelector('[data-receipt-index]')) return;
    Portal.ocrReceipts = collectReceiptEditors('tokoReceiptEditors', Portal.ocrReceipts);
  }

  function updateStoreBatchSummary(receiptsOverride) {
    const root = document.getElementById('tokoReceiptEditors');
    let receipts = receiptsOverride || Portal.ocrReceipts;
    if (!receiptsOverride && root && root.querySelector('[data-receipt-index]')) receipts = collectReceiptEditors('tokoReceiptEditors', Portal.ocrReceipts);
    const itemCount = receipts.reduce((sum, receipt) => sum + (receipt.items || []).length, 0);
    const total = receipts.reduce((sum, receipt) => sum + parseIdNumber(receipt.receiptTotal), 0);
    const gross = receipts.reduce((sum, receipt) => sum + parseIdNumber(receipt.grossTotal), 0);
    const discount = receipts.reduce((sum, receipt) => sum + parseIdNumber(receipt.discountTotal), 0);
    const valid = receipts.length > 0 && receipts.every(receipt => receipt.calculationValid !== false && (receipt.items || []).length > 0);
    const receiptCount = document.getElementById('tokoBatchReceiptCount');
    const items = document.getElementById('tokoBatchItemCount');
    const amount = document.getElementById('tokoBatchTotal');
    const grossAmount = document.getElementById('tokoBatchGross');
    const discountAmount = document.getElementById('tokoBatchDiscount');
    const submit = document.getElementById('tokoSubmitReceipts');
    if (receiptCount) receiptCount.textContent = `${receipts.length} nota`;
    if (items) items.textContent = `${itemCount} item`;
    if (amount) amount.textContent = rupiah(total);
    if (grossAmount) grossAmount.textContent = rupiah(gross);
    if (discountAmount) discountAmount.textContent = discount ? `−${rupiah(discount)}` : rupiah(0);
    if (submit) {
      submit.disabled = !valid;
      submit.innerHTML = `<i class="bi bi-send-fill"></i> Konfirmasi & Kirim${receipts.length ? ` ${receipts.length} Nota` : ''}`;
      submit.title = valid ? 'Periksa ringkasan lalu kirim nota' : 'Perbaiki item atau diskon yang belum valid';
    }
  }

  function updateStoreReceiptSummaries() {
    const root = document.getElementById('tokoReceiptEditors');
    if (!root) return;
    const receipts = collectReceiptEditors('tokoReceiptEditors', Portal.ocrReceipts);
    Portal.ocrReceipts = receipts;
    root.querySelectorAll('[data-receipt-index]').forEach((card, receiptIndex) => {
      const receipt = receipts[receiptIndex] || blankReceipt();
      const supplier = receipt.supplier || 'Supplier belum terbaca';
      const date = receipt.date ? formatDisplayDate(receipt.date) : 'Tanggal belum dipilih';
      const supplierTarget = card.querySelector('[data-summary-supplier]');
      const dateTarget = card.querySelector('[data-summary-date]');
      const totalTarget = card.querySelector('[data-summary-total]');
      const totalInput = card.querySelector('[data-receipt-field="receiptTotal"]');
      if (supplierTarget) supplierTarget.textContent = supplier;
      if (dateTarget) dateTarget.textContent = date;
      if (totalTarget) totalTarget.textContent = rupiah(receipt.receiptTotal);
      if (totalInput) totalInput.value = money(receipt.receiptTotal);
      const grossTarget = card.querySelector('[data-receipt-gross]');
      const discountTarget = card.querySelector('[data-receipt-discount]');
      const netTarget = card.querySelector('[data-receipt-net]');
      const warningTarget = card.querySelector('[data-calculation-warning]');
      if (grossTarget) grossTarget.textContent = rupiah(receipt.grossTotal);
      if (discountTarget) discountTarget.textContent = receipt.discountTotal ? `−${rupiah(receipt.discountTotal)}` : rupiah(0);
      if (netTarget) netTarget.textContent = rupiah(receipt.receiptTotal);
      if (warningTarget) {
        warningTarget.textContent = (receipt.calculationWarnings || []).join(' ');
        warningTarget.classList.toggle('portal-hidden', !(receipt.calculationWarnings || []).length);
      }
      (receipt.items || []).forEach((item, itemIndex) => {
        const row = card.querySelector(`[data-store-item-row="${itemIndex}"]`);
        if (!row) return;
        const discountNodes = row.querySelectorAll('[data-item-discount-value]');
        const netDetails = row.querySelectorAll('.portal-item-net-detail');
        const netNodes = row.querySelectorAll('[data-item-net-value]');
        discountNodes.forEach(discountNode => {
          discountNode.textContent = item.discountAllocated ? `Diskon ${rupiah(item.discountAllocated)}` : '';
          discountNode.classList.toggle('portal-hidden', !item.discountAllocated);
        });
        netDetails.forEach(detail => { detail.classList.toggle('portal-hidden', !item.discountAllocated); });
        netNodes.forEach(netNode => { netNode.textContent = rupiah(item.amount); });
      });
    });
    updateStoreBatchSummary(receipts);
  }

  function renderStoreEditors() {
    const root = document.getElementById('tokoReceiptEditors');
    Portal.activeReceiptIndex = Math.min(Math.max(0, Portal.activeReceiptIndex), Math.max(0, Portal.ocrReceipts.length - 1));
    root.innerHTML = Portal.ocrReceipts.map((receipt, ri) => receiptEditorHtml(receipt, ri, 'store')).join('');
    root.querySelectorAll('[data-remove-receipt]').forEach(btn => btn.addEventListener('click', () => {
      syncStoreEditorState();
      const index = Number(btn.dataset.removeReceipt);
      const removed = Portal.ocrReceipts[index];
      if (removed && removed.tempReceiptId) Portal.removedReceiptIds[removed.tempReceiptId] = true;
      Portal.ocrReceipts.splice(index, 1);
      Portal.activeReceiptIndex = Math.max(0, Math.min(index, Portal.ocrReceipts.length - 1));
      setStoreDraftDirty(true);
      renderStoreEditors();
    }));
    root.querySelectorAll('[data-add-item]').forEach(btn => btn.addEventListener('click', () => {
      syncStoreEditorState();
      const index = Number(btn.dataset.addItem);
      Portal.ocrReceipts[index].items.push({description:'',category:'LAIN-LAIN',quantity:1,unit:'',grossAmount:0,amount:0});
      Portal.activeReceiptIndex = index;
      setStoreDraftDirty(true);
      renderStoreEditors();
    }));
    root.querySelectorAll('[data-remove-item]').forEach(btn => btn.addEventListener('click', () => {
      syncStoreEditorState();
      const [ri, ii] = btn.dataset.removeItem.split(':').map(Number);
      Portal.ocrReceipts[ri].items.splice(ii, 1);
      Portal.activeReceiptIndex = ri;
      setStoreDraftDirty(true);
      renderStoreEditors();
    }));
    root.querySelectorAll('[data-add-discount]').forEach(btn => btn.addEventListener('click', () => {
      syncStoreEditorState();
      const index = Number(btn.dataset.addDiscount);
      Portal.ocrReceipts[index].adjustments = Array.isArray(Portal.ocrReceipts[index].adjustments) ? Portal.ocrReceipts[index].adjustments : [];
      Portal.ocrReceipts[index].adjustments.push({type:'DISCOUNT',description:'DISKON',amount:0,targetType:'RECEIPT',targetHint:''});
      Portal.activeReceiptIndex = index;
      setStoreDraftDirty(true);
      renderStoreEditors();
      const inputs = root.querySelectorAll(`[data-receipt-index="${index}"] [data-adjustment-amount]`);
      inputs[inputs.length - 1]?.focus({ preventScroll:false });
    }));
    root.querySelectorAll('[data-remove-discount]').forEach(btn => btn.addEventListener('click', () => {
      syncStoreEditorState();
      const [ri, ai] = btn.dataset.removeDiscount.split(':').map(Number);
      Portal.ocrReceipts[ri].adjustments.splice(ai, 1);
      Portal.activeReceiptIndex = ri;
      setStoreDraftDirty(true);
      renderStoreEditors();
    }));
    root.querySelectorAll('[data-edit-store-item]').forEach(btn => btn.addEventListener('click', () => {
      const [ri, ii] = btn.dataset.editStoreItem.split(':').map(Number);
      openStoreItemEditor(ri, ii);
    }));
    root.querySelectorAll('[data-toggle-receipt]').forEach(button => button.addEventListener('click', () => {
      const nextIndex = Number(button.dataset.toggleReceipt);
      const wasOpen = button.getAttribute('aria-expanded') === 'true';
      root.querySelectorAll('.portal-receipt-editor').forEach((card, index) => {
        const open = index === nextIndex && !wasOpen;
        card.classList.toggle('is-open', open);
        card.querySelector('[data-toggle-receipt]')?.setAttribute('aria-expanded', open ? 'true' : 'false');
        card.querySelector('.portal-receipt-body')?.setAttribute('aria-hidden', open ? 'false' : 'true');
      });
      Portal.activeReceiptIndex = wasOpen ? -1 : nextIndex;
    }));
    setupPortalControls(root);
    root.querySelectorAll('input,select').forEach(input => {
      const handleDraftChange = () => { if (!input.readOnly && !input.disabled) setStoreDraftDirty(true); scheduleStoreReceiptSummaryUpdate(); };
      input.addEventListener('input', handleDraftChange);
      input.addEventListener('change', handleDraftChange);
    });
    root.querySelectorAll('.portal-money-input').forEach(input => {
      input.addEventListener('focus', () => input.select());
      input.addEventListener('blur', () => { formatMoneyInput(input); updateStoreReceiptSummaries(); });
    });
    updateStoreReceiptSummaries();
  }

  function scheduleStoreReceiptSummaryUpdate() {
    if (Portal.storeSummaryFrame) return;
    Portal.storeSummaryFrame = window.requestAnimationFrame(() => {
      Portal.storeSummaryFrame = null;
      updateStoreReceiptSummaries();
    });
  }

  function openStoreItemEditor(receiptIndex, itemIndex) {
    syncStoreEditorState();
    const receipt = Portal.ocrReceipts[receiptIndex];
    const item = receipt && receipt.items && receipt.items[itemIndex];
    const sheet = document.getElementById('storeItemEditorSheet');
    if (!item || !sheet) return;
    if (sheet.parentElement !== document.body) document.body.appendChild(sheet);
    Portal.mobileItemEditing = { receiptIndex, itemIndex };
    document.getElementById('storeItemEditorTitle').textContent = `Item ${itemIndex + 1} · Nota ${receiptIndex + 1}`;
    document.getElementById('storeItemDescription').value = item.description || '';
    const categorySelect = document.getElementById('storeItemCategory');
    categorySelect.innerHTML = categoryOptions(item.category || 'LAIN-LAIN');
    refreshPortalCombo(categorySelect);
    document.getElementById('storeItemQuantity').value = item.quantity == null ? 1 : item.quantity;
    document.getElementById('storeItemUnit').value = item.unit || '';
    document.getElementById('storeItemAmount').value = money(item.grossAmount == null ? item.amount || 0 : item.grossAmount);
    Portal.mobileItemSnapshot = JSON.stringify({
      description:item.description || '', category:item.category || 'LAIN-LAIN', quantity:Number(item.quantity == null ? 1 : item.quantity),
      unit:item.unit || '', grossAmount:parseIdNumber(item.grossAmount == null ? item.amount || 0 : item.grossAmount)
    });
    sheet.classList.remove('portal-hidden');
    sheet.setAttribute('aria-hidden', 'false');
    document.body.classList.add('portal-item-editor-open');
    requestAnimationFrame(() => {
      sheet.classList.add('open');
      setTimeout(() => document.getElementById('storeItemDescription')?.focus({ preventScroll:true }), 180);
    });
  }

  function currentStoreItemEditorValue() {
    return {
      description:document.getElementById('storeItemDescription')?.value.trim() || '',
      category:document.getElementById('storeItemCategory')?.value || 'LAIN-LAIN',
      quantity:Number(document.getElementById('storeItemQuantity')?.value || 0),
      unit:document.getElementById('storeItemUnit')?.value.trim() || '',
      grossAmount:parseIdNumber(document.getElementById('storeItemAmount')?.value || 0)
    };
  }

  async function closeStoreItemEditor(options = {}) {
    const sheet = document.getElementById('storeItemEditorSheet');
    if (!sheet || sheet.classList.contains('portal-hidden')) return true;
    if (!options.force && Portal.mobileItemSnapshot && JSON.stringify(currentStoreItemEditorValue()) !== Portal.mobileItemSnapshot) {
      const result = await Swal.fire({
        title:'Buang perubahan item?',
        text:'Perubahan pada item ini belum disimpan ke draft.',
        icon:'warning', showCancelButton:true, confirmButtonText:'Buang perubahan', cancelButtonText:'Lanjut mengedit', confirmButtonColor:'#ef5d67'
      });
      if (!result.isConfirmed) return false;
    }
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('portal-item-editor-open');
    clearTimeout(sheet.__hideTimer);
    sheet.__hideTimer = setTimeout(() => {
      if (!sheet.classList.contains('open')) {
        sheet.classList.add('portal-hidden');
        Portal.mobileItemEditing = null;
        Portal.mobileItemSnapshot = '';
      }
    }, 320);
    return true;
  }

  async function saveStoreItemEditor(event) {
    event.preventDefault();
    const editing = Portal.mobileItemEditing;
    const receipt = editing && Portal.ocrReceipts[editing.receiptIndex];
    const item = receipt && receipt.items && receipt.items[editing.itemIndex];
    if (!item) return closeStoreItemEditor({force:true});
    const value = currentStoreItemEditorValue();
    item.description = value.description;
    item.category = value.category;
    item.quantity = value.quantity;
    item.unit = value.unit;
    item.grossAmount = value.grossAmount;
    item.amount = value.grossAmount;
    Portal.ocrReceipts[editing.receiptIndex] = allocateReceiptDraft(receipt);

  function resizeTaxWorkspace(which, deltaPercent) {
    const layout = document.getElementById('taxBankLayout');
    const columns = String(layout && layout.dataset.columns || '25,37,38').split(',').map(Number);
    const available = Math.max(1,(layout ? layout.clientWidth : 1000) - 20);
    const minQueue = Math.min(25,215 / available * 100);
    const minEditor = Math.min(37,320 / available * 100);
    const minPhoto = Math.min(38,280 / available * 100);
    if (which === 'queue') {
      const nextQueue = Math.max(minQueue, Math.min(100 - minEditor - columns[2], columns[0] + deltaPercent));
      columns[0] = nextQueue; columns[1] = 100 - nextQueue - columns[2];
    } else {
      const nextPhoto = Math.max(minPhoto, Math.min(100 - minEditor - columns[0], columns[2] - deltaPercent));
      columns[2] = nextPhoto; columns[1] = 100 - columns[0] - nextPhoto;
    }
    applyTaxWorkspaceColumns(columns, true);

  function bindTaxWorkspaceResizer(id, which) {

    });
    handle.addEventListener('pointermove', event => {
      if (!handle.classList.contains('dragging')) return;
      const delta = (event.clientX - lastX) / Math.max(1, layout.clientWidth) * 100;
      lastX = event.clientX; resizeTaxWorkspace(which, delta);
    });
    const stop = event => { handle.classList.remove('dragging'); try { handle.releasePointerCapture(event.pointerId); } catch (error) {} };
    handle.addEventListener('pointerup', stop); handle.addEventListener('pointercancel', stop);
    handle.addEventListener('dblclick', () => { applyTaxWorkspaceColumns([25,37,38], true); recalculateTaxPhotoFit(true); });
    handle.addEventListener('keydown', event => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;

    });

  function setTaxPhotoControlsEnabled(enabled) {

  function taxPhotoBounds() {
    const stage = document.getElementById('taxPhotoStage');
    const viewer = Portal.taxPhotoViewer;
    const image = viewer.image;
    if (!stage || !image) return { x:0, y:0 };
    const quarterTurn = Math.abs(viewer.rotation % 180) === 90;
    const actualScale = viewer.fitScale * viewer.scale;
    const width = (quarterTurn ? image.naturalHeight : image.naturalWidth) * actualScale;
    const height = (quarterTurn ? image.naturalWidth : image.naturalHeight) * actualScale;
    return { x:Math.max(0,(width - stage.clientWidth) / 2), y:Math.max(0,(height - stage.clientHeight) / 2) };
  }

  function applyTaxPhotoTransform() {
    const viewer = Portal.taxPhotoViewer;
    const image = viewer.image;
    const stage = document.getElementById('taxPhotoStage');
    if (!image || !stage) { setTaxPhotoControlsEnabled(false); return; }
    const bounds = taxPhotoBounds();
    viewer.x = Math.max(-bounds.x, Math.min(bounds.x, viewer.x));
    viewer.y = Math.max(-bounds.y, Math.min(bounds.y, viewer.y));
    const actualScale = viewer.fitScale * viewer.scale;
    image.style.transform = `translate(calc(-50% + ${viewer.x}px),calc(-50% + ${viewer.y}px)) rotate(${viewer.rotation}deg) scale(${actualScale})`;
    stage.classList.toggle('can-pan', bounds.x > 0 || bounds.y > 0);
    const label = document.getElementById('taxPhotoZoomLabel');
    if (label) label.value = Math.round(viewer.scale * 100) + '%';
    setTaxPhotoControlsEnabled(true);
  }

  function recalculateTaxPhotoFit(keepRelativeZoom) {
    const viewer = Portal.taxPhotoViewer;
    const image = viewer.image;
    const stage = document.getElementById('taxPhotoStage');
    if (!image || !stage || !image.naturalWidth || !stage.clientWidth) return;
    const quarterTurn = Math.abs(viewer.rotation % 180) === 90;
    const naturalWidth = quarterTurn ? image.naturalHeight : image.naturalWidth;
    const naturalHeight = quarterTurn ? image.naturalWidth : image.naturalHeight;
    const widthScale = Math.max(.01,(stage.clientWidth - 8) / naturalWidth);
    const pageScale = Math.min(widthScale, Math.max(.01,(stage.clientHeight - 8) / naturalHeight));
    viewer.fitScale = viewer.fitMode === 'width' ? widthScale : pageScale;
    if (!keepRelativeZoom) viewer.scale = 1;
    applyTaxPhotoTransform();
  }

  function fitTaxPhoto(mode) {
    const viewer = Portal.taxPhotoViewer;
    if (!viewer.image) return;
    viewer.fitMode = mode === 'width' ? 'width' : 'page'; viewer.x = 0; viewer.y = 0; viewer.scale = 1;
    recalculateTaxPhotoFit(false);
  }

  function changeTaxPhotoZoom(delta, anchor) {
    const viewer = Portal.taxPhotoViewer;
    if (!viewer.image) return;
    const previous = viewer.scale;
    viewer.scale = Math.max(.5, Math.min(4, Math.round((previous + Number(delta || 0)) * 100) / 100));
    if (anchor && previous) {
      viewer.x = anchor.x - (anchor.x - viewer.x) * (viewer.scale / previous);
      viewer.y = anchor.y - (anchor.y - viewer.y) * (viewer.scale / previous);
    }
    applyTaxPhotoTransform();
  }

  function resetTaxPhotoViewer() {
    const viewer = Portal.taxPhotoViewer;
    viewer.scale = 1; viewer.rotation = 0; viewer.x = 0; viewer.y = 0; viewer.fitMode = 'page';
    recalculateTaxPhotoFit(false);
  }

  function rotateTaxPhoto() {
    const viewer = Portal.taxPhotoViewer;
    if (!viewer.image) return;
    viewer.rotation = (viewer.rotation + 90) % 360; viewer.x = 0; viewer.y = 0;
    recalculateTaxPhotoFit(true);
  }

  function mountTaxPhoto(dataUrl, alt, imageKey, reset) {
    const stage = document.getElementById('taxPhotoStage');
    if (!stage || !dataUrl) return;
    const request = ++Portal.taxPhotoViewer.imageRequest;
    const image = new Image();
    image.alt = alt || 'Foto nota'; image.draggable = false;
    image.onload = () => {
      if (Portal.taxPhotoViewer.imageKey !== imageKey || Portal.taxPhotoViewer.imageRequest !== request) return;
      stage.replaceChildren(image);
      Portal.taxPhotoViewer.image = image;
      if (reset) resetTaxPhotoViewer(); else recalculateTaxPhotoFit(true);
      renderTaxPhotoQualityState();
    };
    image.onerror = () => {
      if (Portal.taxPhotoViewer.imageKey === imageKey && Portal.taxPhotoViewer.imageRequest === request && !Portal.taxPhotoViewer.image) stage.innerHTML = '<div class="portal-photo-empty">Foto tidak dapat ditampilkan.</div>';
    };
    image.src = dataUrl;
  }

  function clearTaxPhotoViewer(message, imageKey) {
    const stage = document.getElementById('taxPhotoStage');
    const viewer = Portal.taxPhotoViewer;
    viewer.image = null; viewer.imageKey = imageKey || ''; viewer.imageRequest += 1; viewer.scale = 1; viewer.fitScale = 1; viewer.rotation = 0; viewer.x = 0; viewer.y = 0; viewer.pointers = {}; viewer.qualityState = ''; viewer.qualityReceipt = null; viewer.qualityIndex = -1;
    if (stage) { stage.classList.remove('can-pan','is-panning'); stage.innerHTML = `<div class="portal-photo-empty">${escapeHtml(message || 'Pilih nota untuk melihat foto.')}</div>`; }
    const label = document.getElementById('taxPhotoZoomLabel'); if (label) label.value = '100%';
    setTaxPhotoControlsEnabled(false);
  }

  function bindTaxPhotoGestures() {
    const stage = document.getElementById('taxPhotoStage');
    if (!stage) return;
    stage.addEventListener('wheel', event => {
      if (!event.ctrlKey || !Portal.taxPhotoViewer.image) return;
      event.preventDefault();
      const rect = stage.getBoundingClientRect();
      changeTaxPhotoZoom(event.deltaY < 0 ? .15 : -.15, { x:event.clientX - rect.left - rect.width / 2, y:event.clientY - rect.top - rect.height / 2 });
    }, { passive:false });
    stage.addEventListener('pointerdown', event => {
      if (!Portal.taxPhotoViewer.image) return;
      const viewer = Portal.taxPhotoViewer;
      viewer.pointers[event.pointerId] = { x:event.clientX, y:event.clientY, lastX:event.clientX, lastY:event.clientY };
      stage.setPointerCapture(event.pointerId); stage.classList.add('is-panning');
      const points = Object.values(viewer.pointers);
      if (points.length === 2) { viewer.pinchDistance = Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y); viewer.pinchScale = viewer.scale; }
      event.preventDefault();
    });
    stage.addEventListener('pointermove', event => {
      const viewer = Portal.taxPhotoViewer;
      const point = viewer.pointers[event.pointerId]; if (!point) return;
      point.x = event.clientX; point.y = event.clientY;
      const points = Object.values(viewer.pointers);
      if (points.length >= 2 && viewer.pinchDistance) {
        const distance = Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);
        viewer.scale = Math.max(.5,Math.min(4,viewer.pinchScale * distance / viewer.pinchDistance));
      } else {
        viewer.x += point.x - point.lastX; viewer.y += point.y - point.lastY;
      }
      point.lastX = point.x; point.lastY = point.y; applyTaxPhotoTransform(); event.preventDefault();
    });
    const finish = event => {
      const viewer = Portal.taxPhotoViewer; delete viewer.pointers[event.pointerId];
      const remaining = Object.values(viewer.pointers); if (remaining.length === 1) { remaining[0].lastX = remaining[0].x; remaining[0].lastY = remaining[0].y; }
      if (remaining.length < 2) viewer.pinchDistance = 0;
      if (!remaining.length) stage.classList.remove('is-panning');
    };
    stage.addEventListener('pointerup', finish); stage.addEventListener('pointercancel', finish);
  }

  function initializeTaxWorkspace() {
    if (Portal.taxWorkspaceReady) return;
    Portal.taxWorkspaceReady = true;
    bindTaxEditorDirtyTracking(); bindTaxPhotoGestures(); setTaxPhotoControlsEnabled(false);
    if (window.ResizeObserver) {
      Portal.taxPhotoViewer.resizeObserver = new ResizeObserver(() => recalculateTaxPhotoFit(true));
      Portal.taxPhotoViewer.resizeObserver.observe(document.getElementById('taxPhotoStage'));

  async function performTaxBankLoad(options = {}) {
    initializeTaxWorkspace();
    const reloadBtn = document.getElementById('taxBankReload');
    if (reloadBtn) setIconBusy(reloadBtn, true);
    const page = document.getElementById('taxBankPage');
    if (page && (options.manualRefresh || options.background)) {
      page.classList.add('portal-page-refreshing');
      page.setAttribute('aria-busy', 'true');
    }
    const previousRows = Portal.taxRows.slice();
    const previousActiveIndex = Portal.taxActiveIndex;
    try {
      if (!Portal.pageRendered.taxBankPage && !options.background) showTaxBankSkeleton();
      const cursor = Portal.taxCursor;
      const sequence = ++Portal.taxLoadSequence;
      const payload = Object.assign(currentTaxFilters(), { cursor, limit:Portal.taxLimit });
      const applyData = data => {
        if (!data || sequence !== Portal.taxLoadSequence || cursor !== Portal.taxCursor) return;
        const reviewOpen = Boolean(document.getElementById('taxReviewWorkspace') && !document.getElementById('taxReviewWorkspace').classList.contains('portal-hidden'));
        const activeId = reviewOpen && Portal.taxRows[Portal.taxActiveIndex] && Portal.taxRows[Portal.taxActiveIndex].id;
        Portal.taxRows = data.rows || [];
        Portal.taxBranches = data.branches || Portal.taxBranches || [];
        Portal.taxHasNext = Boolean(data.hasNext);
        Portal.taxLimit = Number(data.limit || Portal.taxLimit || 10);
        const visibleVersions = Portal.taxRows.reduce((map, row) => { map[row.id] = Number(row.version || 1); return map; }, {});
        Portal.taxStaleDecisionIds = {};
        Object.keys(Portal.taxDecisions).forEach(id => {
          if (visibleVersions[id] && Number(Portal.taxDecisions[id].expectedVersion || 0) !== visibleVersions[id]) Portal.taxStaleDecisionIds[id] = true;
        });
        Portal.taxSelectedIds = Object.keys(Portal.taxSelectedIds || {}).reduce((map, id) => {
          if (Portal.taxRows.some(row => row.id === id && row.status === 'PENDING')) map[id] = true;
          return map;
        }, {});
        const branchSelect = document.getElementById('taxBankBranch');
        const selected = branchSelect.value;
        branchSelect.innerHTML = '<option value="">Semua Cabang</option>' + Portal.taxBranches.map(b => `<option value="${escapeHtml(b.id)}">${escapeHtml(b.name)}</option>`).join('');
        branchSelect.value = selected;
        refreshPortalCombo(branchSelect);
        Portal.taxFilterSnapshot = currentTaxFilters();
        setTaxEditDirty(false);
        renderTaxQueue();
        renderTaxBankPagination(data);
        const activeIndex = activeId ? Portal.taxRows.findIndex(row => row.id === activeId) : -1;
        if (reviewOpen && activeIndex >= 0 && Portal.taxReviewMode === 'review') selectTaxReceipt(activeIndex);
        else if (reviewOpen && activeIndex < 0) closeTaxReviewWorkspace({ force:true });
        else Portal.taxActiveIndex = -1;
        const empty = document.getElementById('taxBankEmptyState');
        const queuePanel = document.getElementById('taxQueuePanel');
        if (empty) empty.classList.toggle('portal-hidden', Portal.taxRows.length > 0);
        if (queuePanel) queuePanel.classList.toggle('portal-hidden', Portal.taxRows.length === 0);
        updateTaxDecisionCount();
      };
      const data = await swrApi('GET_TAX_RECEIPTS', payload, { useCached:options.manualRefresh !== true && options.forceFresh !== true, onCached:applyData });
      applyData(data);
      Portal.pageLoadedAt.taxBankPage = Date.now();
      Portal.pageRendered.taxBankPage = true;
      restoreActiveApprovalJobs();
    } catch (error) {
      if (options.manualRefresh && previousRows.length) {
        Portal.taxRows = previousRows;
        Portal.taxActiveIndex = previousActiveIndex;
        renderTaxQueue();
        renderTaxBankPagination({ hasNext:Portal.taxHasNext });
        if (Portal.taxReviewMode === 'review' && previousActiveIndex >= 0) selectTaxReceipt(Math.max(0, Math.min(previousActiveIndex, previousRows.length - 1)));
      }
      throw error;
    } finally {
      if (reloadBtn) setIconBusy(reloadBtn, false);
      if (page) { page.classList.remove('portal-page-refreshing'); page.removeAttribute('aria-busy'); }
    }
  }

  function loadTaxBank(options = {}) {
    if (options.manualRefresh && Portal.taxRefreshPromise) return Portal.taxRefreshPromise;
    const request = performTaxBankLoad(options);

    Portal.taxRefreshPromise = request

      .finally(() => { Portal.taxRefreshPromise = null; });
    return Portal.taxRefreshPromise;

  function renderTaxQueue() {
    const root = document.getElementById('taxQueueList');
    if (!Portal.taxRows.length) { root.innerHTML = ''; return; }
    const query = Portal.taxQueueQuery.trim().toLocaleLowerCase('id-ID');
    const visible = Portal.taxRows.map((row,index) => ({ row,index })).filter(entry => {
      if (!query) return true;
      const row = entry.row;
      return `${row.branchName || ''} ${row.displayNumber || ''} ${row.supplier || ''} ${row.date || ''} ${row.receiptTotal || ''}`.toLocaleLowerCase('id-ID').includes(query);
    });
    const panel = document.getElementById('taxQueuePanel');
    if (panel) panel.classList.toggle('batch-mode', Portal.taxBatchMode);
    if (!visible.length) root.innerHTML = '<div class="portal-queue-no-results"><i class="bi bi-search"></i><strong>Tidak ada nota yang cocok</strong><span>Coba nomor nota, cabang, atau supplier lain.</span></div>';
    else root.innerHTML = `<div class="portal-tax-queue-cards">${visible.map((entry, visibleIndex) => {
      const r = entry.row; const i = entry.index;
      const rowNumber = (Portal.taxCursorStack.length * Portal.taxLimit) + visibleIndex + 1;
      const pending = Portal.taxDecisions[r.id];
      const stale = Portal.taxStaleDecisionIds[r.id];
      const badgeClass = pending ? (pending.decision === 'APPROVE' ? 'portal-badge-approved' : pending.decision === 'DISCARD' ? 'portal-badge-discarded' : 'portal-badge-correction') : (r.status === 'APPROVED' ? 'portal-badge-approved' : r.status === 'PENDING' ? 'portal-badge-pending' : r.status === 'REJECTED' ? 'portal-badge-discarded' : 'portal-badge-correction');
      const statusText = stale ? 'Perlu review ulang' : pending ? (pending.decision === 'APPROVE' ? 'Ditandai setuju' : pending.decision === 'DISCARD' ? 'Ditandai tidak digunakan' : 'Ditandai perlu perbaikan') : statusLabel(r.status);
      const confidence = taxConfidenceValue(r);
      const confidenceClass = confidence == null ? 'is-missing' : taxOcrNeedsReview(r) ? 'is-warning' : 'is-good';
      const confidenceText = confidence == null ? '-' : `${Math.round(confidence * 100)}%`;
      const itemCount = Number(r.itemCount == null ? (r.items || []).length : r.itemCount);
      return `<article class="portal-tax-queue-card ${i === Portal.taxActiveIndex && Portal.taxReviewMode ? 'active' : ''}" data-tax-row="${i}" aria-selected="${i === Portal.taxActiveIndex && Portal.taxReviewMode ? 'true' : 'false'}"><input class="portal-tax-checkbox portal-queue-check" data-tax-select="${escapeHtml(r.id)}" type="checkbox" aria-label="Pilih nota ${escapeHtml(r.displayNumber || '-') }" ${Portal.taxSelectedIds[r.id] ? 'checked' : ''} ${r.status !== 'PENDING' ? 'disabled' : ''}><button class="portal-tax-queue-open" type="button" data-tax-review="${i}" aria-label="Review nota ${escapeHtml(r.displayNumber || '-')}"><span class="portal-tax-queue-main"><span class="portal-tax-queue-copy"><strong>#${escapeHtml(r.displayNumber || '-')}</strong><small>${escapeHtml(r.branchName || 'Tanpa cabang')}</small><small>${escapeHtml(r.supplier || 'Tanpa supplier')} | ${itemCount} item</small></span></span><span class="portal-tax-queue-side"><strong>${escapeHtml(rupiah(r.receiptTotal))}</strong><small>${escapeHtml(formatQueueDate(r.date))}</small></span><span class="portal-tax-queue-meta"><span>Urutan ${rowNumber}</span><span class="portal-badge ${stale ? 'portal-badge-correction' : badgeClass}">${escapeHtml(statusText)}</span><span class="portal-tax-confidence ${confidenceClass}">OCR ${escapeHtml(confidenceText)}</span></span></button></article>`;
    }).join('')}</div>`;
    root.querySelectorAll('[data-tax-review]').forEach(button => button.addEventListener('click', () => requestTaxReceiptSelection(Number(button.dataset.taxReview))));
    root.querySelectorAll('[data-tax-select]').forEach(checkbox => checkbox.addEventListener('click', event => {
      event.stopPropagation();
      if (checkbox.checked) Portal.taxSelectedIds[checkbox.dataset.taxSelect] = true;
      else delete Portal.taxSelectedIds[checkbox.dataset.taxSelect];
      updateTaxBulkToolbar();
    }));
    updateTaxBulkToolbar();
    const summary = document.getElementById('taxQueuePageSummary');
    if (summary) summary.textContent = `Halaman ${Portal.taxCursorStack.length + 1} · ${visible.length}${visible.length !== Portal.taxRows.length ? '/' + Portal.taxRows.length : ''} nota`;
  }

  function updateTaxBulkToolbar() {
    const count = Object.keys(Portal.taxSelectedIds || {}).length;
    const toolbar = document.getElementById('taxBulkToolbar');
    if (toolbar) toolbar.classList.toggle('portal-hidden', count === 0);
    const label = document.getElementById('taxBulkSelectedCount');
    if (label) label.textContent = count + ' nota dipilih';
  }

  function clearTaxBulkSelection() {
    Portal.taxSelectedIds = {};
    renderTaxQueue();
  }

  async function stageTaxBulkDecision(decision) {
    const selected = Portal.taxRows.filter(row => Portal.taxSelectedIds[row.id] && row.status === 'PENDING');
    if (!selected.length) return Swal.fire('Belum ada nota dipilih', '', 'info');
    let reason = '';
    if (decision === 'REQUEST_CORRECTION') {
      const result = await Swal.fire({ title:'Alasan perbaikan massal', text:`Alasan ini akan dipakai untuk ${selected.length} nota.`, input:'textarea', inputPlaceholder:'Tuliskan koreksi yang diperlukan...', showCancelButton:true, inputValidator:value=>!String(value || '').trim()?'Alasan wajib diisi.':undefined });
      if (!result.isConfirmed) return;
      reason = String(result.value || '').trim();
    }
    selected.forEach(row => {
      Portal.taxDecisions[row.id] = { receiptId:row.id, displayNumber:row.displayNumber || '', decision, reason, expectedVersion:Number(row.version || 1) };
      delete Portal.taxStaleDecisionIds[row.id];
    });
    Portal.taxSelectedIds = {};
    Portal.taxBatchMode = false;
    updateTaxDecisionCount();
    renderTaxQueue();
  }

  function renderTaxBankPagination(data) {
    renderCursorPagination(document.getElementById('taxBankPagination'), {
      count:Portal.taxRows.length,
      hasPrevious:Portal.taxCursorStack.length > 0,
      hasNext:Boolean(data && data.hasNext),
      onPrevious:async () => {
        if (!(await confirmTaxDirtyAction())) return;
        Portal.taxCursor = Portal.taxCursorStack.pop() || '';
        loadTaxBank({ background:true });
      },
      onNext:async () => {
        if (!(await confirmTaxDirtyAction())) return;
        Portal.taxCursorStack.push(Portal.taxCursor);
        Portal.taxCursor = String(data && data.nextCursor || '');
        loadTaxBank({ background:true });
      }
    });
  }

  function cacheTaxPhoto(photoId, photo) {
    Portal.taxPhotoCache[photoId] = photo;
    Portal.taxPhotoOrder = Portal.taxPhotoOrder.filter(id => id !== photoId);
    Portal.taxPhotoOrder.push(photoId);
    while (Portal.taxPhotoOrder.length > 12) delete Portal.taxPhotoCache[Portal.taxPhotoOrder.shift()];
  }

  function cacheTaxThumbnail(photoId, thumbnail) {
    if (!thumbnail || !thumbnail.available || !thumbnail.dataUrl) return;
    Portal.taxThumbnailCache[photoId] = thumbnail;
    Portal.taxThumbnailOrder = Portal.taxThumbnailOrder.filter(id => id !== photoId);
    Portal.taxThumbnailOrder.push(photoId);
    while (Portal.taxThumbnailOrder.length > 12) delete Portal.taxThumbnailCache[Portal.taxThumbnailOrder.shift()];
  }

  async function prefetchTaxThumbnail(photoId, generation) {
    if (!photoId || Portal.taxThumbnailCache[photoId] || Portal.taxPhotoCache[photoId]) return;
    try {
      const thumbnail = await api('GET_PHOTO_THUMBNAIL', { photoId });
      if (generation === Portal.taxPrefetchGeneration) cacheTaxThumbnail(photoId, thumbnail);
    } catch (error) {}
  }

  function scheduleTaxThumbnailPrefetch() {
    const generation = ++Portal.taxPrefetchGeneration;
    const start = Math.max(0, Portal.taxActiveIndex);
    const photoIds = Portal.taxRows.slice(start, start + 2).map(row => row.photoId).filter((id, index, list) => id && list.indexOf(id) === index);
    const run = async () => {
      for (const photoId of photoIds) {
        if (generation !== Portal.taxPrefetchGeneration || Portal.activePage !== 'taxBankPage') return;
        await prefetchTaxThumbnail(photoId, generation);
      }
    };
    if (window.requestIdleCallback) window.requestIdleCallback(() => run(), { timeout:1200 });
    else setTimeout(run, 300);
  }

  function renderTaxReceiptDetail(receipt, index) {
    if (!receipt || index !== Portal.taxActiveIndex || !Portal.taxRows[index] || Portal.taxRows[index].id !== receipt.id) return;
    const editor = document.getElementById('taxReceiptEditor');
    if (editor) cleanupPortalControls(editor);
    Portal.taxRows[index] = Object.assign({}, Portal.taxRows[index], receipt, { itemCount:(receipt.items || []).length });
    Portal.taxDetailCache[receipt.id] = { version:Number(receipt.version || 1), receipt:JSON.parse(JSON.stringify(receipt)) };
    const ocrWarnings = Array.isArray(receipt.ocrWarnings) ? receipt.ocrWarnings : [];
    const warningHtml = ocrWarnings.length ? `<div class="portal-alert portal-alert-warning" style="margin-bottom:10px"><i class="bi bi-exclamation-triangle"></i><span>${escapeHtml(ocrWarnings.join(' '))}</span></div>` : '';
    editor.innerHTML = warningHtml + receiptEditorHtml(receipt, 0, 'tax');
    setupPortalControls(editor);
    const confidence = taxConfidenceValue(receipt);
    const needsReview = taxOcrNeedsReview(receipt);
    const ocrSummary = document.getElementById('taxOcrSummary');
    if (ocrSummary) ocrSummary.innerHTML = `<span class="portal-ocr-chip ${confidence == null ? '' : needsReview ? 'is-warning' : 'is-good'}"><i class="bi bi-stars"></i>${confidence == null ? 'Confidence tidak tersedia' : `Confidence ${Math.round(confidence * 100)}%`}</span>${needsReview ? '<span class="portal-ocr-chip is-warning"><i class="bi bi-exclamation-circle"></i>Perlu diperiksa</span>' : ''}`;
    if (receipt.status !== 'PENDING') editor.querySelectorAll('input,select,textarea').forEach(control => { control.disabled = true; });
    Portal.taxEditorSnapshot = JSON.stringify(receipt);
    setTaxEditDirty(false);
    ['taxApproveButton','taxRejectButton','taxDiscardButton','taxSaveEditButton'].forEach(id => {
      const button = document.getElementById(id);
      if (button) button.disabled = receipt.status !== 'PENDING' || (id === 'taxSaveEditButton' && !Portal.taxEditDirty);
    });
    const restore = document.getElementById('taxRestoreDiscardedButton');
    if (restore) restore.classList.toggle('portal-hidden', !(Portal.user && Portal.user.role === 'ADMIN' && receipt.status === 'REJECTED' && receipt.review && receipt.review.decision === 'DISCARD'));
  }

  async function loadTaxReceiptDetail(summary, index) {
    const cached = Portal.taxDetailCache[summary.id];
    if (cached && Number(cached.version) === Number(summary.version || 1)) {
      renderTaxReceiptDetail(cached.receipt, index);
      return cached.receipt;
    }
    const editor = document.getElementById('taxReceiptEditor');
    if (editor) editor.innerHTML = '<div style="padding:10px"><div class="portal-skeleton" style="height:39px"></div><div class="portal-skeleton" style="height:170px;margin-top:12px"></div></div>';
    const detail = await api('GET_RECEIPT_DETAIL', { receiptId:summary.id });
    renderTaxReceiptDetail(detail, index);
    return detail;
  }

  function renderTaxPhotoQualityState() {
    const stage = document.getElementById('taxPhotoStage');
    if (!stage) return;
    const previous = stage.querySelector('.portal-photo-quality-state');
    if (previous) previous.remove();
    const state = Portal.taxPhotoViewer.qualityState;
    const receipt = Portal.taxPhotoViewer.qualityReceipt;
    const index = Portal.taxPhotoViewer.qualityIndex;
    if (!state) return;
    const badge = document.createElement('div');
    badge.className = `portal-photo-quality-state is-${state}`;
    if (state === 'loading') badge.innerHTML = '<i class="bi bi-arrow-repeat"></i><span>Memuat foto...</span>';
    else if (state === 'high') badge.innerHTML = '<i class="bi bi-check2-circle"></i><span>Kualitas tinggi</span>';
    else {
      badge.innerHTML = '<i class="bi bi-exclamation-triangle"></i><span>Foto jelas gagal dimuat</span><button type="button">Coba lagi</button>';
      const retry = badge.querySelector('button');
      if (retry) retry.addEventListener('click', event => {
        event.stopPropagation();
        if (receipt && index === Portal.taxActiveIndex) loadTaxSelectedPhoto(receipt, index, { forceFull:true });
      });
    }
    stage.appendChild(badge);
  }

  function setTaxPhotoQualityState(state, receipt, index) {
    Portal.taxPhotoViewer.qualityState = state || '';
    Portal.taxPhotoViewer.qualityReceipt = receipt || null;
    Portal.taxPhotoViewer.qualityIndex = Number.isFinite(index) ? index : -1;
    renderTaxPhotoQualityState();
  }

  async function loadTaxSelectedPhoto(receipt, index, options = {}) {
    if (!receipt.photoId) { clearTaxPhotoViewer('Nota manual tanpa foto.', 'manual-' + receipt.id); return; }
    const imageKey = receipt.photoId;
    if (options.forceFull) delete Portal.taxPhotoCache[receipt.photoId];
    if (!Portal.taxPhotoViewer.image || Portal.taxPhotoViewer.imageKey !== imageKey) clearTaxPhotoViewer('Memuat foto...', imageKey);
    const full = Portal.taxPhotoCache[receipt.photoId];
    const thumbnail = Portal.taxThumbnailCache[receipt.photoId];
    if (full) {
      mountTaxPhoto(full.dataUrl, full.fileName || 'Foto nota', imageKey, true);
      setTaxPhotoQualityState('high', receipt, index);
      return;
    }
    if (thumbnail) {
      mountTaxPhoto(thumbnail.dataUrl, `Preview ${thumbnail.fileName || 'foto nota'}`, imageKey, true);
      setTaxPhotoQualityState('loading', receipt, index);
    }
    const thumbnailPromise = thumbnail
      ? Promise.resolve(thumbnail)
      : api('GET_PHOTO_THUMBNAIL', { photoId:receipt.photoId }).then(value => {
          cacheTaxThumbnail(receipt.photoId, value);
          if (value && value.available && value.dataUrl && index === Portal.taxActiveIndex && !Portal.taxPhotoCache[receipt.photoId]) {
            mountTaxPhoto(value.dataUrl, `Preview ${value.fileName || 'foto nota'}`, imageKey, true);
            setTaxPhotoQualityState('loading', receipt, index);
          }
          return value;
        }).catch(() => null);
    const fullPromise = api('GET_PHOTO', { photoId:receipt.photoId });
    try {
      const photo = await fullPromise;
      cacheTaxPhoto(receipt.photoId, photo);
      if (index === Portal.taxActiveIndex && Portal.taxRows[index] && Portal.taxRows[index].photoId === receipt.photoId) {
        mountTaxPhoto(photo.dataUrl, photo.fileName || 'Foto nota', imageKey, !Portal.taxPhotoViewer.image);
        setTaxPhotoQualityState('high', receipt, index);
      }
    } catch (error) {
      await thumbnailPromise;
      if (index === Portal.taxActiveIndex) {
        if (!Portal.taxThumbnailCache[receipt.photoId]) clearTaxPhotoViewer(error.message, imageKey);
        setTaxPhotoQualityState('failed', receipt, index);
      }
    }
  }

  async function selectTaxReceipt(index) {
    Portal.taxActiveIndex = index;
    const queueList = document.getElementById('taxQueueList');
    if (queueList) {
      queueList.querySelectorAll('[data-tax-row]').forEach(row => {
        const rowIdx = Number(row.dataset.taxRow);
        if (rowIdx === index) {
          row.classList.add('active');
          row.setAttribute('aria-selected', 'true');
        } else {
          row.classList.remove('active');
          row.setAttribute('aria-selected', 'false');
        }
      });
    }

    const editor = document.getElementById('taxReceiptEditor');
    if (editor) cleanupPortalControls(editor);

    const stage = document.getElementById('taxPhotoStage');
    const bar = document.getElementById('taxDecisionBar');
    if (index < 0 || !Portal.taxRows[index]) {
      releaseTaxReceiptClaim();
      editor.innerHTML = ''; clearTaxPhotoViewer('Pilih nota untuk melihat foto.', ''); bar.classList.add('portal-hidden');
      const ocrSummary = document.getElementById('taxOcrSummary'); if (ocrSummary) ocrSummary.innerHTML = '';
      setTaxEditDirty(false); return;
    }
    const receipt = Portal.taxRows[index];

    const eyebrow = document.getElementById('taxReviewEyebrow');

    if (title) title.textContent = `${receipt.branchName || 'Tanpa cabang'} · Nota #${receipt.displayNumber || '-'}`;
    if (eyebrow) eyebrow.textContent = 'REVIEW NOTA';
    if (position) position.textContent = `Nota ${index + 1} dari ${Portal.taxRows.length}`;
    const previous = document.getElementById('taxReviewPrevious');
    const next = document.getElementById('taxReviewNext');
    if (previous) previous.disabled = index <= 0;
    if (next) next.disabled = index >= Portal.taxRows.length - 1;
    claimTaxReceiptReview(receipt).catch(() => {});
    bar.classList.remove('portal-hidden');
    const caption = document.getElementById('taxPhotoCaption');
    if (caption) caption.textContent = `${receipt.branchName || 'Tanpa cabang'} · Nota #${receipt.displayNumber || '-'}`;
    scheduleTaxThumbnailPrefetch();
    loadTaxReceiptDetail(receipt, index).catch(error => { if (index === Portal.taxActiveIndex) editor.innerHTML = `<div class="portal-empty">${escapeHtml(error.message)}</div>`; });
    loadTaxSelectedPhoto(receipt, index);
    updateTaxDecisionCount();
  }

  async function claimTaxReceiptReview(receipt) {
    if (!receipt) return;
    if (receipt.status !== 'PENDING') {
      if (Portal.reviewClaimReceiptId) api('RELEASE_RECEIPT_REVIEW', { receiptId:Portal.reviewClaimReceiptId }).catch(() => {});
      Portal.reviewClaimReceiptId = '';
      if (Portal.reviewClaimTimer) window.clearInterval(Portal.reviewClaimTimer);
      Portal.reviewClaimTimer = null;
      return;
    }
    if (Portal.reviewClaimReceiptId === receipt.id) return;
    const previousId = Portal.reviewClaimReceiptId;
    Portal.reviewClaimReceiptId = receipt.id;
    if (previousId) api('RELEASE_RECEIPT_REVIEW', { receiptId:previousId }).catch(() => {});
    if (Portal.reviewClaimTimer) window.clearInterval(Portal.reviewClaimTimer);
    let result = await api('CLAIM_RECEIPT_REVIEW', { receiptId:receipt.id });
    if (Portal.reviewClaimReceiptId !== receipt.id) return;
    if (result && result.occupied) {
      const takeover = await Swal.fire({ title:'Nota sedang direview', text:result.message || 'Pengguna lain sedang membuka nota ini.', icon:'warning', showCancelButton:true, confirmButtonText:'Ambil alih review', cancelButtonText:'Lihat saja' });
      if (takeover.isConfirmed && Portal.reviewClaimReceiptId === receipt.id) result = await api('CLAIM_RECEIPT_REVIEW', { receiptId:receipt.id, takeover:true });
    }
    if (!result || !result.success) return;
    Portal.reviewClaimTimer = window.setInterval(() => {
      if (Portal.reviewClaimReceiptId !== receipt.id || Portal.activePage !== 'taxBankPage') return;
      api('CLAIM_RECEIPT_REVIEW', { receiptId:receipt.id }).catch(() => {});
    }, 45000);
  }

    setTaxReviewTab('photo');
  }

  function closeTaxPhotoPanel() {
    const panel = document.getElementById('taxPhotoPanel');
    if (panel && panel.classList.contains('is-fullscreen')) toggleTaxPhotoFullscreen(false);
    else closeTaxReviewWorkspace({ force:true });

  async function persistTaxEdit(showSuccess) {
    const receipt = Portal.taxRows[Portal.taxActiveIndex]; if (!receipt) return;
    const edited = collectReceiptEditors('taxReceiptEditor', [receipt])[0];
    const response = await api('SAVE_TAX_RECEIPT', { receiptId:receipt.id, receipt:edited });
    const nextVersion = Number(response && response.version) || (Number(receipt.version || 1) + 1);
    const savedReceipt = Object.assign({}, receipt, edited, { version:nextVersion });
    Portal.taxRows[Portal.taxActiveIndex] = savedReceipt;
    Portal.taxDetailCache[receipt.id] = { version:nextVersion, receipt:JSON.parse(JSON.stringify(savedReceipt)) };
    Portal.taxEditorSnapshot = JSON.stringify(savedReceipt);
    setTaxEditDirty(false);
    await clearPortalDataCache();
    if (Portal.taxDecisions[receipt.id]) Portal.taxDecisions[receipt.id].expectedVersion = nextVersion;
    renderTaxQueue();
    if (showSuccess) Swal.fire('Tersimpan', 'Perubahan data nota sudah disimpan.', 'success');
    return savedReceipt;
  }

  async function saveTaxEdit() {
    const button = document.getElementById('taxSaveEditButton');
    if (!Portal.taxEditDirty || !button || button.disabled) return;
    setBusy(button, true, 'Menyimpan...');
    try { await persistTaxEdit(true); }
    catch (error) { Swal.fire('Gagal menyimpan', error.message, 'error'); }
    finally { setBusy(button, false); }
  }

  async function stageTaxDecision(decision) {
    const receipt = Portal.taxRows[Portal.taxActiveIndex]; if (!receipt || receipt.status !== 'PENDING') return;
    const button = document.getElementById(decision === 'APPROVE' ? 'taxApproveButton' : decision === 'DISCARD' ? 'taxDiscardButton' : 'taxRejectButton');
    setBusy(button, true, decision === 'REQUEST_CORRECTION' ? 'Menyiapkan...' : 'Menandai...');
    let reason = '';
    if (decision === 'REQUEST_CORRECTION') {
      const result = await Swal.fire({title:'Alasan perbaikan',input:'textarea',inputPlaceholder:'Tuliskan bagian yang perlu diperbaiki...',showCancelButton:true,inputValidator:v=>!v?'Alasan wajib diisi.':undefined});
      if (!result.isConfirmed) { setBusy(button, false); return; } reason = result.value;
    }
    try {
      const savedReceipt = Portal.taxEditDirty ? await persistTaxEdit(false) : receipt;
      Portal.taxDecisions[savedReceipt.id] = {
        receiptId:savedReceipt.id,
        decision,
        reason,
        expectedVersion:Number(savedReceipt.version || 1)
      };
      updateTaxDecisionCount(); renderTaxQueue();
      if (Portal.taxActiveIndex < Portal.taxRows.length - 1) selectTaxReceipt(Portal.taxActiveIndex + 1);
    } catch (error) {
      Swal.fire('Data belum dapat disimpan', error.message, 'error');
    } finally {
      setBusy(button, false);
    }
  }

    const receipt = Portal.taxRows[Portal.taxActiveIndex];

  function updateTaxDecisionCount() {
    const count = Object.keys(Portal.taxDecisions).length;
    const progress = document.getElementById('taxDecisionCount');
    if (progress) progress.textContent = `${count} nota ditandai`;
    const summary = document.getElementById('taxQueueDecisionSummary');
    if (summary) summary.textContent = count + ' ditandai';
    const globalBar = document.getElementById('taxGlobalDecisionBar');
    if (globalBar) globalBar.classList.toggle('portal-hidden', count === 0);
    const submit = document.getElementById('taxSubmitDecisions');
    if (submit) { submit.disabled = count === 0; submit.innerHTML = `<i class="bi bi-send-check"></i> Kirim ${count} Keputusan`; }
    const current = document.getElementById('taxCurrentDecision');

    if (current) {
      current.classList.toggle('is-marked', Boolean(marked));
      current.textContent = !marked ? 'Pilih keputusan untuk nota ini.' : marked.decision === 'APPROVE' ? 'Ditandai disetujui. Keputusan belum dikirim.' : marked.decision === 'DISCARD' ? 'Ditandai tidak digunakan. Keputusan belum dikirim.' : 'Ditandai perlu perbaikan. Keputusan belum dikirim.';
    }
  }

  async function submitTaxDecisions() {
    const decisions = Object.values(Portal.taxDecisions).filter(decision => !Portal.taxStaleDecisionIds[decision.receiptId]);
    const staleCount = Object.keys(Portal.taxStaleDecisionIds || {}).length;
    if (!decisions.length) return Swal.fire(staleCount ? 'Keputusan perlu direview ulang' : 'Belum ada keputusan', staleCount ? 'Nota berubah setelah refresh dan tidak akan dikirim otomatis.' : '', 'info');
    const decisionCounts = decisions.reduce((counts, item) => { counts[item.decision] = (counts[item.decision] || 0) + 1; return counts; }, {});
    const decisionSummary = [`${Number(decisionCounts.APPROVE || 0)} disetujui`, `${Number(decisionCounts.REQUEST_CORRECTION || 0)} perlu perbaikan`, `${Number(decisionCounts.DISCARD || 0)} tidak digunakan`].join(' · ');
    const result = await Swal.fire({title:'Submit keputusan?',text:decisionSummary,icon:'question',showCancelButton:true,confirmButtonText:'Submit'});
    if (!result.isConfirmed) return;
    const button = document.getElementById('taxSubmitDecisions');
    setBusy(button, true, 'Memproses...');
    try {
      const clientRequestId = `WEB-${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
      const job = await api('CREATE_APPROVAL_JOB', { clientRequestId, decisions });
      Portal.activeApprovalJobs[job.id] = job;
      job.items.forEach(item => { delete Portal.taxDecisions[item.receiptId]; delete Portal.taxStaleDecisionIds[item.receiptId]; });
      renderApprovalJobs();
      clearPortalActionCache(['GET_TAX_RECEIPTS','GET_STORE_DASHBOARD','GET_STORE_HISTORY']).catch(() => {});
      updateTaxDecisionCount();
      renderTaxQueue();
      kickApprovalJob(job.id);
      Swal.fire('Masuk antrean', `${decisions.length} nota diproses di latar belakang. Anda tetap dapat memakai halaman lain.`, 'success');
    } catch (error) { Swal.fire('Proses gagal', error.message, 'error'); }
    finally { setBusy(button, false); }
  }

  function approvalJobDone(job) {
    if (!job) return false;
    if (['SUCCEEDED','FAILED','CANCELLED','RECOVERY_REQUIRED'].includes(job.status)) return true;
    const counts = job.counts || {};
    return job.status === 'PARTIAL' && Number(counts.queued || 0) === 0 && Number(counts.processing || 0) === 0;
  }

  function applyApprovalJobResultsToTaxBank(job) {
    const succeeded = (job && job.items || []).filter(item => item && item.status === 'SUCCEEDED' && item.receiptId);
    if (!succeeded.length || !Portal.taxRows.length) return;
    const outcomes = succeeded.reduce((map, item) => {
      map[item.receiptId] = item.decision === 'APPROVE' ? 'APPROVED' : item.decision === 'DISCARD' ? 'REJECTED' : 'NEEDS_CORRECTION';
      return map;
    }, {});
    const filterStatus = String(currentTaxFilters().status || 'PENDING').toUpperCase();
    const activeReceipt = Portal.taxRows[Portal.taxActiveIndex];
    const activeId = activeReceipt && activeReceipt.id;
    Portal.taxRows = Portal.taxRows.reduce((rows, row) => {
      const nextStatus = outcomes[row.id];
      if (!nextStatus) { rows.push(row); return rows; }
      delete Portal.taxDetailCache[row.id];
      delete Portal.taxSelectedIds[row.id];
      delete Portal.taxDecisions[row.id];
      delete Portal.taxStaleDecisionIds[row.id];
      const next = Object.assign({}, row, { status:nextStatus });
      if (filterStatus === 'ALL' || filterStatus === nextStatus) rows.push(next);
      return rows;
    }, []);
    Portal.taxActiveIndex = activeId ? Portal.taxRows.findIndex(row => row.id === activeId) : -1;
    if (activeId && Portal.taxActiveIndex < 0) closeTaxReviewWorkspace({ force:true });
    renderTaxQueue();
    renderTaxBankPagination({ hasNext:Portal.taxHasNext });
    const empty = document.getElementById('taxBankEmptyState');
    const queuePanel = document.getElementById('taxQueuePanel');
    if (empty) empty.classList.toggle('portal-hidden', Portal.taxRows.length > 0);
    if (queuePanel) queuePanel.classList.toggle('portal-hidden', Portal.taxRows.length === 0);
    updateTaxDecisionCount();
  }

  function reconcileApprovalJobWithTaxBank(job) {
    if (!job || !approvalJobDone(job)) return Promise.resolve();
    applyApprovalJobResultsToTaxBank(job);
    if (Portal.approvalReconciledJobs[job.id]) return Promise.resolve();
    if (Portal.approvalReconcilePromises[job.id]) return Portal.approvalReconcilePromises[job.id];
    const request = clearPortalActionCache(['GET_TAX_RECEIPTS','GET_STORE_DASHBOARD','GET_STORE_HISTORY'])
      .then(() => {
        Portal.taxCursor = '';
        Portal.taxCursorStack = [];
        return loadTaxBank({ background:true, forceFresh:true });
      })
      .then(() => { Portal.approvalReconciledJobs[job.id] = true; })
      .catch(error => {
        Swal.fire({
          toast:true,
          position:'top-end',
          icon:'warning',
          title:'Proses selesai, daftar belum tersinkron',
          text:(error && error.message) || 'Gunakan tombol refresh untuk mencoba kembali.',
          showConfirmButton:false,
          timer:6500,
          timerProgressBar:true
        });
      })
      .finally(() => { delete Portal.approvalReconcilePromises[job.id]; });
    Portal.approvalReconcilePromises[job.id] = request;
    return request;
  }

  async function retryApprovalJob(jobId, button) {
    const current = Portal.activeApprovalJobs[jobId];
    if (!current) return;
    const itemIds = (current.items || [])
      .filter(item => ['FAILED','RECOVERY_REQUIRED'].includes(item.status))
      .map(item => item.id);
    if (!itemIds.length) return;
    setBusy(button, true, Number(current.counts && current.counts.recoveryRequired || 0) > 0 ? 'Melanjutkan...' : 'Mencoba...');
    try {
      const job = await api('RETRY_APPROVAL_JOB_ITEMS', { jobId, itemIds });
      Portal.activeApprovalJobs[jobId] = job;
      renderApprovalJobs();
      kickApprovalJob(jobId);
    } catch (error) {
      Swal.fire('Recovery belum dapat dilanjutkan', error.message, 'error');
    } finally {
      if (button && button.isConnected) setBusy(button, false);
    }
  }

  function renderApprovalJobs() {
    const root = document.getElementById('taxApprovalJobs');
    if (!root) return;
    const jobs = Object.values(Portal.activeApprovalJobs || {}).sort((a,b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
    root.classList.toggle('portal-hidden', jobs.length === 0);
    if (!jobs.length) { root.innerHTML = ''; return; }
    root.innerHTML = jobs.map(job => {
      const counts = job.counts || {};
      const completed = Number(counts.succeeded || 0) + Number(counts.failed || 0) + Number(counts.recoveryRequired || 0) + Number(counts.cancelled || 0);
      const total = Math.max(1, Number(counts.total || (job.items || []).length || 1));
      const errors = (job.items || []).filter(item => item.error).slice(0, 4);
      const settled = Number(counts.queued || 0) === 0 && Number(counts.processing || 0) === 0;
      const retryable = settled && (job.items || []).some(item => ['FAILED','RECOVERY_REQUIRED'].includes(item.status));
      const recoveryLabel = Number(counts.recoveryRequired || 0) > 0 ? 'Lanjutkan recovery' : 'Coba lagi';
      const actions = `${retryable ? '<button class="portal-btn portal-btn-primary portal-btn-compact" data-job-retry="'+escapeHtml(job.id)+'"><i class="bi bi-arrow-repeat"></i> '+recoveryLabel+'</button>' : ''}${approvalJobDone(job) ? '<button class="portal-btn portal-btn-soft portal-btn-compact" data-job-dismiss="'+escapeHtml(job.id)+'">Tutup</button>' : ''}`;
      return `<div class="portal-approval-job" data-approval-job="${escapeHtml(job.id)}"><div class="portal-approval-job-head"><strong>Approval ${escapeHtml(job.id)}</strong><span class="portal-badge ${job.status === 'SUCCEEDED' ? 'portal-badge-approved' : /FAILED|RECOVERY/.test(job.status) ? 'portal-badge-correction' : 'portal-badge-pending'}">${escapeHtml(job.status)}</span></div><div class="portal-approval-progress"><span style="width:${Math.round(completed / total * 100)}%"></span></div><div class="portal-approval-job-meta"><span>${completed}/${total} selesai · ${Number(counts.queued || 0)} antre · ${Number(counts.processing || 0)} diproses</span><div class="portal-approval-job-actions">${actions}</div></div>${errors.length ? `<ul class="portal-approval-errors">${errors.map(item=>`<li>Nota ${escapeHtml(item.displayNumber || item.receiptId)}: ${escapeHtml(item.error)}</li>`).join('')}</ul>` : ''}</div>`;
    }).join('');
    root.querySelectorAll('[data-job-retry]').forEach(button => button.addEventListener('click', () => retryApprovalJob(button.dataset.jobRetry, button)));
    root.querySelectorAll('[data-job-dismiss]').forEach(button => button.addEventListener('click', () => {
      stopApprovalJobPolling(button.dataset.jobDismiss);
      delete Portal.activeApprovalJobs[button.dataset.jobDismiss];
      renderApprovalJobs();
    }));
  }

  function stopApprovalJobPolling(jobId) {
    const timer = Portal.approvalPollTimers[jobId];
    if (timer) window.clearTimeout(timer);
    delete Portal.approvalPollTimers[jobId];
    delete Portal.approvalPollAttempts[jobId];
  }

  function scheduleApprovalJobPoll(jobId) {
    const job = Portal.activeApprovalJobs[jobId];
    if (!job || approvalJobDone(job)) {
      stopApprovalJobPolling(jobId);
      return;
    }
    const currentTimer = Portal.approvalPollTimers[jobId];
    if (currentTimer) window.clearTimeout(currentTimer);
    delete Portal.approvalPollTimers[jobId];
    if (document.hidden) return;
    const attempts = Number(Portal.approvalPollAttempts[jobId] || 0);
    const delays = [3000, 5000, 10000];
    const delay = delays[Math.min(attempts, delays.length - 1)];
    Portal.approvalPollAttempts[jobId] = attempts + 1;
    Portal.approvalPollTimers[jobId] = window.setTimeout(() => {
      delete Portal.approvalPollTimers[jobId];
      pollApprovalJob(jobId);
    }, delay);
  }

  function handleApprovalVisibilityChange() {
    if (document.hidden) {
      Object.keys(Portal.approvalPollTimers).forEach(jobId => {
        window.clearTimeout(Portal.approvalPollTimers[jobId]);
        delete Portal.approvalPollTimers[jobId];
      });
      return;
    }
    Object.keys(Portal.activeApprovalJobs || {}).forEach(jobId => {
      const job = Portal.activeApprovalJobs[jobId];
      if (!approvalJobDone(job)) kickApprovalJob(jobId);
    });
  }

  async function pollApprovalJob(jobId) {
    if (document.hidden) return;
    try {
      const wasRunning = Boolean(Portal.activeApprovalJobs[jobId] && Portal.activeApprovalJobs[jobId].running);
      const job = await api('GET_APPROVAL_JOB', { jobId });
      job.running = wasRunning;
      Portal.activeApprovalJobs[jobId] = job;
      applyApprovalJobResultsToTaxBank(job);
      renderApprovalJobs();
      if (approvalJobDone(job)) {
        stopApprovalJobPolling(jobId);
        reconcileApprovalJobWithTaxBank(job);
        return;
      }
      const counts = job.counts || {};
      if (!job.running && Number(counts.queued || 0) > 0 && Number(counts.processing || 0) === 0) {
        kickApprovalJob(jobId);
        return;
      }
      scheduleApprovalJobPoll(jobId);
    } catch (error) {
      scheduleApprovalJobPoll(jobId);
    }
  }

  async function kickApprovalJob(jobId) {
    const tracked = Portal.activeApprovalJobs[jobId];
    if (!tracked || tracked.running || approvalJobDone(tracked)) {
      if (tracked && approvalJobDone(tracked)) stopApprovalJobPolling(jobId);
      return;
    }
    const existingTimer = Portal.approvalPollTimers[jobId];
    if (existingTimer) window.clearTimeout(existingTimer);
    delete Portal.approvalPollTimers[jobId];
    if (document.hidden) return;
    tracked.running = true;
    scheduleApprovalJobPoll(jobId);
    try {
      const response = await api('RUN_APPROVAL_JOB', { jobId });
      if (response && response.job) {
        response.job.running = true;
        Portal.activeApprovalJobs[jobId] = response.job;
        applyApprovalJobResultsToTaxBank(response.job);
      }
      renderApprovalJobs();
    } catch (error) {
      tracked.lastError = error.message;
    } finally {
      const current = Portal.activeApprovalJobs[jobId];
      if (current) current.running = false;
    }
    const latest = Portal.activeApprovalJobs[jobId];
    if (latest && approvalJobDone(latest)) reconcileApprovalJobWithTaxBank(latest);
    else scheduleApprovalJobPoll(jobId);
  }

  async function restoreActiveApprovalJobs() {
    if (Portal.approvalJobsRestored) return;
    Portal.approvalJobsRestored = true;
    if (!Portal.approvalVisibilityBound) {
      Portal.approvalVisibilityBound = true;
      document.addEventListener('visibilitychange', handleApprovalVisibilityChange);
    }
    try {
      const jobs = await api('LIST_ACTIVE_APPROVAL_JOBS', {});
      (jobs || []).forEach(job => { Portal.activeApprovalJobs[job.id] = job; });
      renderApprovalJobs();
      (jobs || []).forEach(job => { if (!approvalJobDone(job)) kickApprovalJob(job.id); });
    } catch (error) { Portal.approvalJobsRestored = false; }
  }

  function renderMasterLinks() {
    const body = document.getElementById('taxLinksBody');

    const rows = Portal.taxBranches.filter(branch => !filter || [branch.name,branch.id,branch.type].some(value => String(value || '').toLocaleLowerCase('id-ID').includes(filter)));
    const total = Portal.taxBranches.length;
    const connected = Portal.taxBranches.filter(branch => {
      const link = Portal.taxLinks[branch.id] || {};
      return !!strictSpreadsheetUrl(link.url || link.spreadsheetUrl || '');
    }).length;
    const central = Portal.taxBranches.filter(branch => branch.type === 'Central Kitchen').length;
    const setStat = (id, value) => { const target = document.getElementById(id); if (target) target.textContent = String(value); };
    setStat('taxLinkStatTotal', total);
    setStat('taxLinkStatConnected', connected);

    const pageSize = 12;

    }
    body.innerHTML = visible.map((branch, localIndex) => {
      const link = Portal.taxLinks[branch.id] || {}; const url = link.url || link.spreadsheetUrl || '';
      const safeUrl = strictSpreadsheetUrl(url);
      const invalidUrl = !!url && !safeUrl;
