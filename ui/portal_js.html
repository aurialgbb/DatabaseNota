<script>
(function installPortalStartupGuard() {
  function showStartupError(message, details) {
    if (window.PORTAL_ACTIVE || window.PORTAL_INIT_FINISHED) {
      console.error('Portal runtime error:', message);
      return;
    }
    const diagnostic = Object.assign({
      message: String(message || 'Kesalahan JavaScript tidak diketahui.'),
      filename: '', source: 'inline-script', line: 0, column: 0, stack: '',
      buildId: String(window.PORTAL_BUILD_ID || 'unknown'),
      state: String(window.PORTAL_INIT_STATE || 'script-loading'),
      timestamp: new Date().toISOString()
    }, details || {});
    window.__portalLastStartupError = diagnostic;
    window.__portalEarlyErrors = window.__portalEarlyErrors || [];
    window.__portalEarlyErrors.push(diagnostic);
    const splash = document.getElementById('portalSessionSplash');
    const gate = document.getElementById('portalGate');
    const warning = document.getElementById('portalSetupWarning');
    if (splash) {
      splash.classList.remove('portal-session-active');
      splash.classList.add('portal-session-leaving');
    }
    if (gate) gate.classList.remove('portal-hidden');
    if (warning) {
      warning.textContent = 'Komponen aplikasi gagal dijalankan: ' + diagnostic.message +
        ' (' + diagnostic.source + ':' + diagnostic.line + ':' + diagnostic.column + ').';
      warning.classList.remove('portal-hidden');
    }
    window.PORTAL_INIT_STATE = 'error';
    window.PORTAL_INIT_FINISHED = true;
    if (window.__portalStartupWatchdog) {
      clearTimeout(window.__portalStartupWatchdog);
      window.__portalStartupWatchdog = null;
    }
  }
  window.addEventListener('error', event => showStartupError(event && event.message, {
    filename: event && event.filename ? String(event.filename) : '',
    source: event && event.filename ? String(event.filename).split('/').pop() : 'inline-script',
    line: Number(event && event.lineno || 0),
    column: Number(event && event.colno || 0),
    stack: event && event.error && event.error.stack ? String(event.error.stack) : ''
  }));
  window.addEventListener('unhandledrejection', event => {
    const reason = event && event.reason;
    showStartupError(reason && reason.message ? reason.message : reason, {
      source: 'unhandled-promise',
      stack: reason && reason.stack ? String(reason.stack) : ''
    });
  });
})();

'use strict';
  window.PORTAL_SCRIPT_LOADED = true;
  window.PORTAL_INIT_STATE = 'script-loaded';
  window.PORTAL_MANAGES_NAV = true;
  window.PortalFeatures = window.PortalFeatures || {};

  function runPortalFeature(name, ...args) {
    const feature = window.PortalFeatures && window.PortalFeatures[name];
    if (typeof feature !== 'function') throw new Error(`Fitur ${name} belum siap. Silakan muat ulang halaman.`);
    return feature(...args);
  }

  function completePortalStartup(state) {
    window.PORTAL_INIT_STATE = state;
    window.PORTAL_INIT_FINISHED = true;
    if (window.__portalStartupWatchdog) {
      clearTimeout(window.__portalStartupWatchdog);
      window.__portalStartupWatchdog = null;
    }
  }

  const portalMemoryStorage = {};
  const PORTAL_SESSION_STORAGE_KEY = 'gbb_portal_session';
  const PORTAL_SESSION_PERSIST_KEY = 'gbb_portal_session_persist_v1';
  const PORTAL_SESSION_CLIENT_MAX_MS = 4 * 60 * 60 * 1000;

  function readPersistedPortalSession() {
    try {
      if (!window.localStorage) return '';
      const raw = window.localStorage.getItem(PORTAL_SESSION_PERSIST_KEY);
      if (!raw) return '';
      const saved = JSON.parse(raw);
      const expiresAt = Number(saved && saved.expiresAt || 0);
      const now = Date.now();
      if (!saved || !saved.token || expiresAt <= now || expiresAt > now + PORTAL_SESSION_CLIENT_MAX_MS + 60000) {
        window.localStorage.removeItem(PORTAL_SESSION_PERSIST_KEY);
        return '';
      }
      return String(saved.token);
    } catch (error) {
      try { if (window.localStorage) window.localStorage.removeItem(PORTAL_SESSION_PERSIST_KEY); } catch (cleanupError) {}
      return '';
    }
  }

  function storageGet(key) {
    try {
      const sessionValue = window.sessionStorage ? window.sessionStorage.getItem(key) : '';
      if (sessionValue) return sessionValue;
      if (key === PORTAL_SESSION_STORAGE_KEY) {
        const persisted = readPersistedPortalSession();
        if (persisted) {
          portalMemoryStorage[key] = persisted;
          if (window.sessionStorage) window.sessionStorage.setItem(key, persisted);
          return persisted;
        }
      }
      return portalMemoryStorage[key] || '';
    } catch (error) { return portalMemoryStorage[key] || ''; }
  }

  function storageSet(key, value, expiresAt) {
    portalMemoryStorage[key] = String(value == null ? '' : value);
    try {
      if (window.sessionStorage) window.sessionStorage.setItem(key, portalMemoryStorage[key]);
      if (window.localStorage && key === PORTAL_SESSION_STORAGE_KEY) {
        const now = Date.now();
        const boundedExpiry = Math.min(Number(expiresAt || 0) || now + PORTAL_SESSION_CLIENT_MAX_MS, now + PORTAL_SESSION_CLIENT_MAX_MS);
        window.localStorage.setItem(PORTAL_SESSION_PERSIST_KEY, JSON.stringify({
          token:portalMemoryStorage[key],
          savedAt:now,
          expiresAt:boundedExpiry
        }));
        window.localStorage.removeItem(key);
      }
    }
    catch (error) {}
  }

  function storageRemove(key) {
    delete portalMemoryStorage[key];
    try {
      if (window.sessionStorage) window.sessionStorage.removeItem(key);
      if (window.localStorage) {
        window.localStorage.removeItem(key);
        if (key === PORTAL_SESSION_STORAGE_KEY) window.localStorage.removeItem(PORTAL_SESSION_PERSIST_KEY);
      }
    }
    catch (error) {}
  }

  const Portal = {
    token: storageGet(PORTAL_SESSION_STORAGE_KEY) || '',
    user: null,
    categories: [],
    selectedFiles: [],
    previewUrls: [],
    compressedImages: {},
    uploadId: '',
    ocrPhotoResults: [],
    ocrReceipts: [],
    removedReceiptIds: {},
    activeReceiptIndex: 0,
    profileSheetHistoryPushed: false,
    resubmitId: '',
    taxRows: [],
    taxBranches: [],
    taxActiveIndex: -1,
    taxLimit: 10,
    taxCursor: '',
    taxCursorStack: [],
    taxHasNext: false,
    taxDecisions: {},
    taxSelectedIds: {},
    taxStaleDecisionIds: {},
    taxEditDirty: false,
    taxEditorSnapshot: '',
    taxEditNavigationPending: false,
    allowTaxEditNavigation: false,
    taxBatchMode: false,
    taxQueueQuery: '',
    taxFilterSnapshot: null,
    taxWorkspaceReady: false,
    taxReviewMode: '',
    taxReviewReturnFocus: null,
    taxRefreshPromise: null,
    activeApprovalJobs: {},
    approvalReconcilePromises: {},
    approvalReconciledJobs: {},
    approvalPollTimers: {},
    approvalPollAttempts: {},
    approvalVisibilityBound: false,
    approvalJobsRestored: false,
    reviewClaimReceiptId: '',
    reviewClaimTimer: null,
    taxPhotoCache: {},
    taxPhotoOrder: [],
    taxThumbnailCache: {},
    taxThumbnailOrder: [],
    taxPrefetchGeneration: 0,
    taxLoadSequence: 0,
    taxDetailCache: {},
    taxPhotoViewer: {
      scale:1, fitScale:1, rotation:0, x:0, y:0, fitMode:'page',
      image:null, imageKey:'', imageRequest:0, pointers:{}, pinchDistance:0, pinchScale:1,
      resizeObserver:null
    },
    storeHistoryCursor: '',
    storeHistoryCursorStack: [],
    storeHistoryHasNext: false,
    mobileItemEditing: null,
    mobileItemSnapshot: '',
    storeDraftDirty: false,
    storeDraftPersistTimer: null,
    storeDraftRecoveryChecked: false,
    storeDraftNavigationPending: false,
    allowStoreDraftNavigation: false,
    taxLinks: {},
    taxLinksRevision: '',
    masterLinkPage: 1,
    masterEditingId: '',
    masterEditingPeriod: '',
    taxEntryPage: 1,
    taxEntryStatus: 'ALL',
    taxEntryLoadSequence: 0,
    accounts: [],
    accountPage: 1,
    accountImportRunning: false,
    pageLoadedAt: {},
    pageRendered: {},
    pageLoadPromises: {},
    refreshPromises: {},
    cacheGeneration: 0,
    inflightRequests: {},
    floatingPopover: null,
    activePage: '',
    activeNavItems: [],
    navigationSequence: 0,
    loginRunning: false,
    loggingOut: false,
    logoutToastTimer: null,
    inputWorkTimers: {},
    storeSummaryFrame: null
  };

  function portalCallError(error) {
    const detail = typeof error === 'string' ? error : error && (
      error.message || error.details || (typeof error.error === 'string' ? error.error : error.error && error.error.message)
    );
    return new Error(typeof detail === 'string' && detail.trim() && detail !== 'undefined'
      ? detail
      : 'Panggilan ke Google Apps Script gagal tanpa rincian. Muat ulang halaman dengan akun Google yang memiliki akses ke aplikasi.');
  }

  function publicCall(functionName, ...args) {
    return new Promise((resolve, reject) => {
      if (!(window.google && google.script && google.script.run)) {
        reject(new Error('Fungsi ini hanya tersedia dari Google Apps Script.'));
        return;
      }
      const timer = setTimeout(() => reject(new Error(functionName === 'portalLogin'
        ? 'Login melewati batas waktu 120 detik. Hasil belum diterima. Silakan coba login kembali; halaman ini belum menyimpan sesi dari percobaan tersebut.'
        : 'Server belum merespons. Periksa status atau coba kembali dengan permintaan yang sama.')), 120000);
      try {
        const runner = google.script.run.withSuccessHandler(value => { clearTimeout(timer); resolve(value); }).withFailureHandler(error => { clearTimeout(timer); reject(portalCallError(error)); });
        runner[functionName](...args);
      } catch (error) {
        clearTimeout(timer);
        reject(portalCallError(error));
      }
    });
  }

  function withTimeout(promise, timeoutMs, message) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error(message || 'Server terlalu lama merespons.')), timeoutMs);
      Promise.resolve(promise).then(
        value => { clearTimeout(timer); resolve(value); },
        error => { clearTimeout(timer); reject(error); }
      );
    });
  }

  function isTransientPortalReadError(error) {
    const message = String(error && error.message || error || '');
    return /layanan sesi sedang tidak tersedia|profil akun tidak dapat dimuat karena layanan data terganggu|koneksi ke firebase sementara gagal|firebase (?:read|query) error \((?:429|5\d\d)\)|server terlalu lama merespons|tidak merespons/i.test(message);
  }

  async function runPortalReadWithRetry(requestFactory) {
    try {
      return await requestFactory();
    } catch (error) {
      if (!isTransientPortalReadError(error)) throw error;
      await new Promise(resolve => setTimeout(resolve, 850));
      return requestFactory();
    }
  }

  async function api(action, payload) {
    try {
      const mutating = ['MOVE_RECEIPT_DATE','ELIMINATE_RECEIPT'].includes(action);
      const pendingKey = 'nota-request-' + String(Portal.user && Portal.user.uid || '') + '|' + action + '|' + JSON.stringify(stableCacheValue(payload || {}));
      let requestPayload = payload || {};
      if (mutating) {
        let requestId = window.sessionStorage.getItem(pendingKey);
        if (!requestId) { requestId = window.crypto.randomUUID(); window.sessionStorage.setItem(pendingKey, requestId); }
        requestPayload = { ...requestPayload, clientRequestId:requestId };
      }
      const result = await publicCall('portalApi', Portal.token, action, requestPayload);
      if (mutating && result && result.success === false) throw new Error(result.message || 'Perlu dilanjutkan.');
      if (mutating) window.sessionStorage.removeItem(pendingKey);
      return result;
    } catch (error) {
      const message = error && error.message ? error.message : String(error);
      const sessionIsPermanentlyInvalid = /sesi login tidak ditemukan|sesi telah berakhir|akun sudah dinonaktifkan|sesi firebase tidak valid/i.test(message);
      if (sessionIsPermanentlyInvalid) await logout(false);
      throw new Error(message);
    }
  }

  const PORTAL_CACHE_DB = 'gbb_portal_cache_v1';
  const PORTAL_CACHE_STORE = 'responses';

  function stableCacheValue(value) {
    if (Array.isArray(value)) return value.map(stableCacheValue);
    if (value && typeof value === 'object') return Object.keys(value).sort().reduce((out, key) => { out[key] = stableCacheValue(value[key]); return out; }, {});
    return value;
  }

  function openPortalCacheDb() {
    if (!window.indexedDB) return Promise.resolve(null);
    return new Promise(resolve => {
      const request = window.indexedDB.open(PORTAL_CACHE_DB, 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(PORTAL_CACHE_STORE)) {
          const store = db.createObjectStore(PORTAL_CACHE_STORE, { keyPath:'key' });
          store.createIndex('userId', 'userId', { unique:false });
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => resolve(null);
      request.onblocked = () => resolve(null);
    });
  }

  function portalCacheKey(action, payload) {
    const userId = Portal.user && Portal.user.uid || 'anonymous';
    return [window.PORTAL_BUILD_ID || 'unknown', userId, Portal.user && Portal.user.role || '', action, JSON.stringify(stableCacheValue(payload || {}))].join('|');
  }

  async function portalCacheGet(action, payload) {
    if (!Portal.user || !Portal.user.uid) return null;
    const db = await openPortalCacheDb();
    if (!db) return null;
    return new Promise(resolve => {
      const request = db.transaction(PORTAL_CACHE_STORE, 'readonly').objectStore(PORTAL_CACHE_STORE).get(portalCacheKey(action, payload));
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => resolve(null);
    });
  }

  async function portalCachePut(action, payload, data, generation = Portal.cacheGeneration) {
    if (!data || data.error || data.success === false || !Portal.user || !Portal.user.uid || /PHOTO|OCR|PASSWORD/.test(String(action))) return;
    const db = await openPortalCacheDb();
    if (!db) return;
    return new Promise(resolve => {
      const tx = db.transaction(PORTAL_CACHE_STORE, 'readwrite');
      tx.objectStore(PORTAL_CACHE_STORE).put({
        key:portalCacheKey(action, payload), userId:String(Portal.user.uid), action:String(action), createdAt:Date.now(), data:data
      });
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
      tx.onabort = () => resolve();
    });
  }

  async function clearPortalDataCache(userId) {
    Portal.cacheGeneration += 1;
    const targetUserId = String(userId || Portal.user && Portal.user.uid || '');
    if (!targetUserId) return;
    const db = await openPortalCacheDb();
    if (!db) return;
    return new Promise(resolve => {
      const tx = db.transaction(PORTAL_CACHE_STORE, 'readwrite');
      const index = tx.objectStore(PORTAL_CACHE_STORE).index('userId');
      const request = index.openKeyCursor(window.IDBKeyRange.only(targetUserId));
      request.onsuccess = event => {
        const cursor = event.target.result;
        if (!cursor) return;
        tx.objectStore(PORTAL_CACHE_STORE).delete(cursor.primaryKey);
        cursor.continue();
      };
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
      tx.onabort = () => resolve();
    });
  }

  async function clearPortalActionCache(actions, userId) {
    Portal.cacheGeneration += 1;
    const targetUserId = String(userId || Portal.user && Portal.user.uid || '');
    const targets = (Array.isArray(actions) ? actions : [actions]).map(String);
    if (!targetUserId || !targets.length) return;
    const db = await openPortalCacheDb();
    if (!db) return;
    return new Promise(resolve => {
      const tx = db.transaction(PORTAL_CACHE_STORE, 'readwrite');
      const store = tx.objectStore(PORTAL_CACHE_STORE);
      const request = store.openCursor();
      request.onsuccess = event => {
        const cursor = event.target.result;
        if (!cursor) return;
        const value = cursor.value || {};
        if (String(value.userId || '') === targetUserId && targets.includes(String(value.action || ''))) cursor.delete();
        cursor.continue();
      };
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
      tx.onabort = () => resolve();
    });
  }

  function portalRequestOnce(key, requestFactory) {
    const requestKey = String(key || '');
    if (Portal.inflightRequests[requestKey]) return Portal.inflightRequests[requestKey];
    const request = Promise.resolve().then(requestFactory);
    Portal.inflightRequests[requestKey] = request;
    request.finally(() => {
      if (Portal.inflightRequests[requestKey] === request) delete Portal.inflightRequests[requestKey];
    }).catch(() => {});
    return request;
  }

  async function swrApi(action, payload, options = {}) {
    const generation = Portal.cacheGeneration;
    const freshMs = Number(options.freshMs == null ? 2 * 60 * 1000 : options.freshMs);
    const staleMs = Number(options.staleMs || 15 * 60 * 1000);
    const cached = options.useCached === false ? null : await portalCacheGet(action, payload);
    const age = cached ? Date.now() - Number(cached.createdAt || 0) : Number.POSITIVE_INFINITY;
    if (cached && age <= freshMs) {
      if (typeof options.onCached === 'function') options.onCached(cached.data, { stale:false });
      return cached.data;
    }
    if (cached && age <= staleMs && typeof options.onCached === 'function') {
      options.onCached(cached.data, { stale:true });
    }
    const requestKey = 'API|' + generation + '|' + portalCacheKey(action, payload);
    const data = await portalRequestOnce(requestKey, () => api(action, payload));
    if (generation !== Portal.cacheGeneration) return swrApi(action, payload, { ...options, useCached:false });
    if (!data || data.error || data.success === false) throw new Error(data && (data.error || data.message) || 'Data gagal dimuat.');
    if (generation === Portal.cacheGeneration) await portalCachePut(action, payload, data);
    return data;
  }

  async function cachedLegacyCall(action, args) {
    const generation = Portal.cacheGeneration;
    const payload = { args:Array.isArray(args) ? args : [] };
    const cached = await portalCacheGet('LEGACY_' + action, payload);
    if (generation !== Portal.cacheGeneration) return cachedLegacyCall(action, args);
    const requestKey = 'LEGACY|' + generation + '|' + portalCacheKey('LEGACY_' + action, payload);
    const request = () => portalRequestOnce(requestKey, () => publicCall('portalLegacyApi', Portal.token, action, payload.args)).then(async data => {
      if (generation !== Portal.cacheGeneration) return cachedLegacyCall(action, args);
      if (!data || data.error || data.success === false) throw new Error(data && (data.error || data.message) || 'Data gagal dimuat.');
      if (generation === Portal.cacheGeneration) await portalCachePut('LEGACY_' + action, payload, data);
      return data;
    });
    const age = cached ? Date.now() - Number(cached.createdAt || 0) : Number.POSITIVE_INFINITY;
    if (cached && age <= 2 * 60 * 1000) return cached.data;
    if (cached && age <= 15 * 60 * 1000) {
      request().catch(() => {});
      return cached.data;
    }
    return request();
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }

  function safeCssEscape(value) {
    const text = String(value == null ? '' : value);
    if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(text);
    return text.replace(/[^a-zA-Z0-9_-]/g, character => '\\' + character.codePointAt(0).toString(16) + ' ');
  }

  function strictSpreadsheetUrl(value) {
    const text = String(value || '').trim();
    if (!text) return '';
    try {
      const parsed = new URL(text);
      if (parsed.username || parsed.password) return '';
      if (parsed.protocol !== 'https:' || parsed.hostname.toLowerCase() !== 'docs.google.com') return '';
      if (!/^\/spreadsheets\/(?:u\/\d+\/)?d\/[a-zA-Z0-9_-]+(?:\/|$)/.test(parsed.pathname)) return '';
      return parsed.href;
    } catch (error) {
      return '';
    }
  }

  // Dipakai modul legacy saat membangun markup dinamis. encodeURIComponent
  // adalah format aman untuk nilai data-* yang kemudian didekode saat event.
  window.legacyEscapeHtml = escapeHtml;
  window.legacyEncodeData = value => encodeURIComponent(String(value == null ? '' : value));
  window.legacyDecodeData = value => decodeURIComponent(String(value == null ? '' : value));
  window.legacySafeImageUrl = value => {
    const text = String(value || '').trim();
    if (/^data:image\/(?:png|jpe?g|webp|gif);base64,[a-z0-9+/=\s]+$/i.test(text)) return text;
    try {
      const parsed = new URL(text);
      return parsed.protocol === 'https:' ? parsed.href : '';
    } catch (error) { return ''; }
  };

  function portalDependencyStatus() {
    const deferredLoaderAvailable = !window.PORTAL_ACTIVE && typeof window.loadGbbVendorRuntime === 'function';
    return {
      sweetAlert: deferredLoaderAvailable || typeof window.Swal !== 'undefined',
      jquery: deferredLoaderAvailable || typeof window.jQuery !== 'undefined',
      flatpickr: deferredLoaderAvailable || typeof window.flatpickr !== 'undefined',
      xlsx: deferredLoaderAvailable || typeof window.XLSX !== 'undefined' || typeof window.loadGbbXlsxRuntime === 'function'
    };
  }

  async function ensureVendorRuntime() {
    if (typeof window.loadGbbVendorRuntime !== 'function') {
      throw new Error('Loader komponen portal tidak tersedia.');
    }
    await window.loadGbbVendorRuntime();
    const dependencies = portalDependencyStatus();
    const missing = Object.keys(dependencies).filter(name => !dependencies[name]);
    if (missing.length) throw new Error('Komponen portal belum aktif: ' + missing.join(', '));
    window.PORTAL_DEPENDENCIES = dependencies;
    setupPortalControls(document);
    return true;
  }

  async function ensureLegacyRuntime(pageId) {
    await ensureVendorRuntime();
    if (typeof window.loadGbbLegacyRuntime !== 'function') {
      throw new Error('Loader fitur transaksi lama tidak tersedia.');
    }
    const groupByPage = {
      inputPage: 'legacy-input',
      historyPage: 'legacy-history',
      listrikPage: 'legacy-expenses',
      umumPage: 'legacy-expenses'
    };
    const group = groupByPage[pageId];
    if (!group) throw new Error('Grup runtime halaman tidak dikenal: ' + pageId);
    await window.loadGbbLegacyRuntime(group);
    if (!window.__gbbLegacyAppStarted) {
      if (typeof window.startLegacyTaxApp !== 'function') {
        throw new Error('Fitur transaksi lama tidak berhasil diaktifkan.');
      }
      window.startLegacyTaxApp();
      window.__gbbLegacyAppStarted = true;
    }
    return true;
  }

  async function ensureXlsxRuntime() {
    if (window.XLSX) return true;
    if (typeof window.loadGbbXlsxRuntime !== 'function') throw new Error('Loader XLSX tidak tersedia.');
    await window.loadGbbXlsxRuntime();
    if (!window.XLSX) throw new Error('Pembaca Excel gagal diaktifkan.');
    return true;
  }

  function portalNotifyError(title, error) {
    const message = error && error.message ? error.message : String(error || 'Kesalahan tidak diketahui.');
    console.error(String(title || 'Kesalahan'), error);
    if (window.Swal && typeof window.Swal.fire === 'function') return window.Swal.fire(title, message, 'error');
    const warning = document.getElementById('portalSetupWarning');
    if (warning) {
      warning.textContent = String(title || 'Kesalahan') + ': ' + message;
      warning.classList.remove('portal-hidden');
    }
  }

  function portalNotifyReadError(error) {
    const message = error && error.message ? error.message : String(error || 'Kesalahan tidak diketahui.');
    console.error('Data belum dapat diperbarui', error);
    if (window.Swal && typeof window.Swal.fire === 'function') {
      return window.Swal.fire({
        toast:true,
        position:'top-end',
        icon:'error',
        title:'Data belum dapat diperbarui',
        text:message,
        showConfirmButton:false,
        timer:7000,
        timerProgressBar:true
      });
    }
    return portalNotifyError('Data belum dapat diperbarui', error);
  }

  function parseIdNumber(value) {
    if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
    let text = String(value == null ? '' : value).trim().replace(/\s+/g, '');
    if (!text) return 0;
    text = text.replace(/[^0-9,.-]/g, '');
    if (text.includes(',')) text = text.replace(/\./g, '').replace(',', '.');
    else {
      const dots = (text.match(/\./g) || []).length;
      if (dots > 1 || (dots === 1 && /^-?\d{1,3}\.\d{3}$/.test(text))) text = text.replace(/\./g, '');
    }
    const number = Number(text);
    return Number.isFinite(number) ? number : 0;
  }

  function formatMoneyInput(input, preserveCaret) {
    if (!input) return;
    const selectionEnd = preserveCaret && typeof input.selectionEnd === 'number' ? input.selectionEnd : null;
    const digitsAfterCaret = selectionEnd == null ? 0 : (input.value.slice(selectionEnd).match(/\d/g) || []).length;
    input.value = money(parseIdNumber(input.value));
    if (selectionEnd == null || document.activeElement !== input) return;
    let nextCaret = input.value.length;
    let remainingDigits = digitsAfterCaret;
    while (remainingDigits > 0 && nextCaret > 0) {

    input.setSelectionRange(nextCaret, nextCaret);

  function portalLoginFailure(error) {
    const raw = portalCallError(error).message;
    let message = raw;
    const credentialError = /username atau password|invalid_login|invalid_password|email_not_found|password wajib|username wajib/i.test(raw);
    if (/username atau password|invalid_login|invalid_password|email_not_found/i.test(raw)) message = 'Username atau password salah. Periksa kembali data login Anda.';
    else if (/tidak aktif|belum terdaftar/i.test(raw)) message = 'Akun tidak aktif atau belum terdaftar. Hubungi administrator.';
    else if (/(?:NetworkError|Connection failure).*HTTP\s*(401|403)\b/i.test(raw)) {
      const status = raw.match(/HTTP\s*(401|403)\b/i)[1];
      message = 'Google menolak akses ke server aplikasi (HTTP ' + status + '). Buka ulang halaman dengan akun Google yang memiliki akses. Untuk HEAD /dev, akun harus memiliki akses editor project. Ini belum menunjukkan password Database Nota salah.';
    } else if (/batas waktu 120 detik/i.test(raw)) message = raw;
    else if (/terlalu lama|timeout|tidak merespons/i.test(raw)) message = 'Server belum merespons dalam batas waktu. Silakan coba lagi setelah beberapa saat.';
    else if (/network|connection|http 0/i.test(raw)) {
      const status = raw.match(/HTTP\s*(\d{3})\b/i);
      message = 'Koneksi ke server aplikasi terputus' + (status ? ' (HTTP ' + status[1] + ')' : '') + '. Periksa koneksi lalu coba kembali.';

  function positionPortalFloatingPopover() {
    const state = Portal.floatingPopover;
    if (!state || !state.anchor || !state.menu || !state.anchor.isConnected) return closePortalFloatingPopover();
    const viewport = window.visualViewport;
    const viewportWidth = viewport ? viewport.width : window.innerWidth;
    const viewportHeight = viewport ? viewport.height : window.innerHeight;
    const viewportLeft = viewport ? viewport.offsetLeft : 0;
    const viewportTop = viewport ? viewport.offsetTop : 0;
    const rect = state.anchor.getBoundingClientRect();
    const margin = 12;
    const width = state.kind === 'month'
      ? Math.min(230, viewportWidth - margin * 2)
      : Math.min(Math.max(rect.width, 220), viewportWidth - margin * 2);
    state.menu.style.width = `${Math.round(width)}px`;
    state.menu.style.maxHeight = `${Math.max(132, Math.min(300, viewportHeight - margin * 2))}px`;
    state.menu.style.visibility = 'hidden';
    state.menu.style.display = 'block';
    const menuHeight = state.menu.getBoundingClientRect().height;
    const roomBelow = viewportTop + viewportHeight - rect.bottom - margin;
    const roomAbove = rect.top - viewportTop - margin;
    const openUp = roomBelow < Math.min(menuHeight, 210) && roomAbove > roomBelow;
    const top = openUp
      ? Math.max(viewportTop + margin, rect.top - menuHeight - 7)
      : Math.min(viewportTop + viewportHeight - menuHeight - margin, rect.bottom + 7);
    const left = Math.max(viewportLeft + margin, Math.min(rect.left, viewportLeft + viewportWidth - width - margin));
    state.menu.style.left = `${Math.round(left)}px`;
    state.menu.style.top = `${Math.round(top)}px`;
    state.menu.style.visibility = 'visible';
    state.menu.classList.toggle('opens-up', openUp);
  }

  function closePortalFloatingPopover(owner) {
    const state = Portal.floatingPopover;
    if (!state || (owner && state.owner !== owner)) return;
    window.removeEventListener('resize', state.reposition);
    window.removeEventListener('scroll', state.onScroll, true);
    if (window.visualViewport) {
      window.visualViewport.removeEventListener('resize', state.reposition);
      window.visualViewport.removeEventListener('scroll', state.reposition);

    else if (state.originalParent && state.originalParent.isConnected) state.originalParent.appendChild(state.menu);

  function openPortalFloatingPopover(owner, anchor, menu, kind) {
    if (Portal.floatingPopover && Portal.floatingPopover.owner === owner) {

    }
    closePortalFloatingPopover();
    const originalParent = menu.parentNode;
    const nextSibling = menu.nextSibling;
    const startScrollY = window.scrollY;
    const state = {
      owner, anchor, menu, kind:kind || 'combo', originalParent, nextSibling, startScrollY,
      reposition:() => requestAnimationFrame(positionPortalFloatingPopover),

    window.addEventListener('scroll', state.onScroll, true);

    document.addEventListener('click', handleDocumentClick);
    if (!Array.isArray(instance.config.onDestroy)) instance.config.onDestroy = [];
    instance.config.onDestroy.push(() => document.removeEventListener('click', handleDocumentClick));
    refresh();
  }

  function cleanupPortalControls(root) {

  function formatDisplayDate(dateStr) {
    if (!dateStr || dateStr === '-') return '-';
    const parts = String(dateStr).split('-');
    if (parts.length !== 3) return dateStr;
    const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const d = String(Number(parts[2]));
    const m = months[parseInt(parts[1], 10) - 1];
    return m && /^\d{4}$/.test(parts[0]) ? `${d} ${m} ${parts[0]}` : dateStr;
  }

  function formatQueueDate(dateStr) {
    return formatDisplayDate(dateStr);
  }

  function setupPortalControls(root) {

  function portalMonthLabel(value) {
    const match = String(value || '').match(/^(\d{4})-(\d{2})$/);
    if (!match) return 'Pilih periode';
    return new Intl.DateTimeFormat('id-ID', { month:'long', year:'numeric' }).format(new Date(Number(match[1]), Number(match[2]) - 1, 1));

  function refreshPortalMonth(source) {
    if (!source || !source.__portalMonth) return;
    const picker = source.__portalMonth;
    const value = source.value || '';
    picker.label.textContent = portalMonthLabel(value);
    const selectedYear = value ? Number(value.slice(0, 4)) : new Date().getFullYear();
    if (!picker.year) picker.year = selectedYear;
    picker.yearLabel.textContent = picker.year;
    const selectedMonth = value && Number(value.slice(0, 4)) === picker.year ? Number(value.slice(5, 7)) : 0;
    const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    picker.grid.innerHTML = months.map((month, index) => `<button type="button" class="portal-month-option ${selectedMonth === index + 1 ? 'active' : ''}" data-month="${index + 1}">${month}</button>`).join('');
    picker.grid.querySelectorAll('[data-month]').forEach(button => button.addEventListener('click', () => {
      source.value = `${picker.year}-${String(button.dataset.month).padStart(2, '0')}`;
      source.dispatchEvent(new Event('change', { bubbles:true }));
      closePortalMonth(picker.root);
    }));

  function enhancePortalMonth(source) {
    if (!source || source.__portalMonth) return;
    const root = document.createElement('div'); root.className = 'portal-month-picker';
    const trigger = document.createElement('button'); trigger.type = 'button'; trigger.className = 'portal-month-trigger';
    const label = document.createElement('span');
    const icon = document.createElement('i'); icon.className = 'bi bi-calendar3'; trigger.append(label, icon);
    const menu = document.createElement('div'); menu.className = 'portal-month-menu';
    const head = document.createElement('div'); head.className = 'portal-month-head';
    const previous = document.createElement('button'); previous.type = 'button'; previous.className = 'portal-month-nav'; previous.innerHTML = '<i class="bi bi-chevron-left"></i>'; previous.setAttribute('aria-label','Tahun sebelumnya');
    const yearLabel = document.createElement('strong');
    const next = document.createElement('button'); next.type = 'button'; next.className = 'portal-month-nav'; next.innerHTML = '<i class="bi bi-chevron-right"></i>'; next.setAttribute('aria-label','Tahun berikutnya');
    const grid = document.createElement('div'); grid.className = 'portal-month-grid'; head.append(previous, yearLabel, next); menu.append(head, grid);
    source.parentNode.insertBefore(root, source); root.append(source, trigger, menu);
    const picker = { root, label, menu, trigger, yearLabel, grid, year:0 }; source.__portalMonth = picker; root.__portalMonthRoot = picker;
    trigger.setAttribute('aria-haspopup', 'dialog');
    trigger.setAttribute('aria-expanded', 'false');
    const open = event => {
      event.stopPropagation();
      closeOpenPortalMenus(root);
      if (root.classList.contains('open')) return closePortalMonth(root);
      root.classList.add('open');
      trigger.setAttribute('aria-expanded', 'true');
      openPortalFloatingPopover(picker, trigger, menu, 'month');
    };
    trigger.addEventListener('click', open);
    previous.addEventListener('click', event => { event.stopPropagation(); picker.year -= 1; refreshPortalMonth(source); });
    next.addEventListener('click', event => { event.stopPropagation(); picker.year += 1; refreshPortalMonth(source); });
    source.addEventListener('change', () => refreshPortalMonth(source));
    trigger.addEventListener('keydown', event => {
      if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closePortalMonth(root); return; }
      if (event.key === 'Enter' || event.key === ' ' || event.key === 'ArrowDown') { event.preventDefault(); open(event); }
    });
    refreshPortalMonth(source);
  }

  function renderPagination(root, page, totalItems, pageSize, onPageChange) {
    if (!root) return;
    const pages = Math.max(1, Math.ceil(totalItems / pageSize));
    const safePage = Math.min(Math.max(1, page), pages);
    const start = totalItems ? (safePage - 1) * pageSize + 1 : 0;
    const end = Math.min(totalItems, safePage * pageSize);
    const nearby = Array.from(new Set([1, safePage - 1, safePage, safePage + 1, pages])).filter(n => n >= 1 && n <= pages).sort((a,b) => a-b);
    root.innerHTML = `<span class="portal-pagination-info">${start}-${end} dari ${totalItems} data</span><button class="portal-page-button" data-page="${safePage - 1}" ${safePage === 1 ? 'disabled' : ''}><i class="bi bi-chevron-left"></i></button>${nearby.map((n,i) => `${i && n - nearby[i-1] > 1 ? '<span class="portal-row-muted">…</span>' : ''}<button class="portal-page-button ${n === safePage ? 'active' : ''}" data-page="${n}">${n}</button>`).join('')}<button class="portal-page-button" data-page="${safePage + 1}" ${safePage === pages ? 'disabled' : ''}><i class="bi bi-chevron-right"></i></button>`;
    root.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => onPageChange(Number(button.dataset.page))));
    return safePage;
  }

  function renderCursorPagination(root, options) {
    if (!root) return;
    options = options || {};
    const hasPrevious = Boolean(options.hasPrevious);
    const hasNext = Boolean(options.hasNext);
    const count = Math.max(0, Number(options.count || 0));
    root.innerHTML = `<span class="portal-pagination-info">${count} data pada halaman ini</span><button class="portal-page-button" data-cursor-nav="previous" ${hasPrevious ? '' : 'disabled'}><i class="bi bi-chevron-left"></i><span>Sebelumnya</span></button><button class="portal-page-button" data-cursor-nav="next" ${hasNext ? '' : 'disabled'}><span>Berikutnya</span><i class="bi bi-chevron-right"></i></button>`;
    root.querySelector('[data-cursor-nav="previous"]')?.addEventListener('click', () => options.onPrevious && options.onPrevious());
    root.querySelector('[data-cursor-nav="next"]')?.addEventListener('click', () => options.onNext && options.onNext());
  }

  function setPageRefreshing(pageId, refreshing) {
    const page = document.getElementById(pageId);
    if (!page) return;

  function runManualPortalRefresh(key, pageId, buttonId, task, successLabel) {
    if (Portal.refreshPromises[key]) return Portal.refreshPromises[key];
    const button = document.getElementById(buttonId);
    setPageRefreshing(pageId, true);
    setIconBusy(button, true);
    const request = Promise.resolve()
      .then(task)
      .then(result => {
        if (successLabel !== false) Swal.fire({ toast:true, position:'top-end', icon:'success', title:successLabel || 'Data diperbarui', showConfirmButton:false, timer:1300 });
        return result;
      })
      .catch(error => {
        Swal.fire({ toast:true, position:'top-end', icon:'error', title:'Data gagal diperbarui', text:error.message || String(error), showConfirmButton:false, timer:6500, timerProgressBar:true });
        return null;
      })
      .finally(() => {
        setPageRefreshing(pageId, false);
        setIconBusy(button, false);
        delete Portal.refreshPromises[key];
      });
    Portal.refreshPromises[key] = request;
    return request;
  }

  function showPage(pageId) {
    const page = document.getElementById(pageId);
    if (!page || !page.classList.contains('page-section')) return;
    if (Portal.activePage === pageId) return;
    closePortalFloatingPopover();
    if (Portal.user && Portal.user.role === 'TOKO' && Portal.activePage === 'tokoUploadPage' && pageId !== 'tokoUploadPage' && Portal.storeDraftDirty && !Portal.allowStoreDraftNavigation) {
      const confirmLeave = window.PortalFeatures && window.PortalFeatures.confirmLeaveStoreDraft;
      if (typeof confirmLeave === 'function' && !Portal.storeDraftNavigationPending) confirmLeave(pageId);
      return;
    }
    if (Portal.activePage === 'taxBankPage' && pageId !== 'taxBankPage' && Portal.taxEditDirty && !Portal.allowTaxEditNavigation) {
      const confirmLeaveTax = window.PortalFeatures && window.PortalFeatures.confirmLeaveTaxEdit;
      if (typeof confirmLeaveTax === 'function' && !Portal.taxEditNavigationPending) confirmLeaveTax(pageId);
      return;
    }
    Portal.allowStoreDraftNavigation = false;
    Portal.allowTaxEditNavigation = false;
    setStoreProfileSheet(false);
    // Fitur toko dan tax hidup di IIFE terpisah. Panggil melalui registry
    // bersama agar navigasi tidak melempar ReferenceError setelah login.
    const closeStoreEditor = window.PortalFeatures && window.PortalFeatures.closeStoreItemEditor;
    const closeTaxPanel = window.PortalFeatures && window.PortalFeatures.closeTaxPhotoPanel;
    if (typeof closeStoreEditor === 'function') closeStoreEditor({ force:true });
    if (typeof closeTaxPanel === 'function') closeTaxPanel();
    const legacySkeleton = document.getElementById('skeleton-loader');
    if (legacySkeleton) legacySkeleton.style.display = 'none';

    if (!Portal.activePage) {
      document.querySelectorAll('.page-section').forEach(section => {
        if (section !== page) {
          section.style.display = 'none';
          section.classList.add('portal-hidden');
        }
      });
    } else if (Portal.activePage !== pageId) {
      const previousPage = document.getElementById(Portal.activePage);
      if (previousPage) {
        previousPage.style.display = 'none';
        previousPage.classList.add('portal-hidden');
      }
    }
    page.classList.remove('portal-hidden');
    page.style.display = 'block';
    Portal.activePage = pageId;

    if (!Portal.activeNavItems.length) {
      Portal.activeNavItems = Array.from(document.querySelectorAll('.nav-item.active-page, .nav-item[aria-current="page"]'));
    }
    Portal.activeNavItems.forEach(button => {
      button.classList.remove('active-page', 'bg-brand-black', 'text-white', 'shadow-md');
      button.classList.add('text-brand-muted');
      button.setAttribute('aria-current', 'false');
    });
    const selectorPage = window.CSS && typeof window.CSS.escape === 'function' ? window.CSS.escape(pageId) : pageId.replace(/[^a-zA-Z0-9_-]/g, '');
    const nextNavItems = Array.from(document.querySelectorAll('.nav-item[data-page="' + selectorPage + '"]'));
    nextNavItems.forEach(button => {
      button.classList.add('active-page', 'bg-brand-black', 'text-white', 'shadow-md');
      button.classList.remove('text-brand-muted');
      button.setAttribute('aria-current', 'page');
    });
    Portal.activeNavItems = nextNavItems;

    const navigationSequence = ++Portal.navigationSequence;
    const beginLoad = () => {
      if (Portal.navigationSequence !== navigationSequence || Portal.activePage !== pageId) return;
      onPageOpen(pageId);
    };
    if (typeof window.requestAnimationFrame === 'function') {
      window.requestAnimationFrame(() => setTimeout(beginLoad, 0));
    }
    else setTimeout(beginLoad, 0);

  async function onPageOpen(pageId) {
    const loaders = {
      tokoDashboardPage: options => runPortalFeature('loadStoreDashboard', options),
      tokoUploadPage: () => runPortalFeature('restoreStoreDraftRecovery'),
      tokoHistoryPage: options => runPortalFeature('loadStoreHistory', options),
      taxBankPage: options => runPortalFeature('loadTaxBank', options),
      taxReceiptEntryPage: options => runPortalFeature('loadTaxEntryReceipts', options),
      taxMasterLinksPage: options => runPortalFeature('loadMasterLinks', options),
      taxAccountsPage: options => runPortalFeature('loadAccounts', options),
      inputPage: async () => {
        await ensureLegacyRuntime(pageId);
        if (typeof window.populateTarikPeriode === 'function') window.populateTarikPeriode();
        return typeof window.prepareTarikCentralKitchens === 'function' ? window.prepareTarikCentralKitchens() : undefined;
      },
      historyPage: async options => {
        await ensureLegacyRuntime(pageId);
        return typeof window.fetchHistoryPage === 'function' ? window.fetchHistoryPage(1, true, options) : undefined;
      },
      listrikPage: async options => {
        await ensureLegacyRuntime(pageId);
        runPortalFeature('ensureExpenseMatrixUi', 'listrik');
        return typeof window.fetchExpensePage === 'function' ? window.fetchExpensePage('listrik', 1, false, options) : undefined;
      },
      umumPage: async options => {
        await ensureLegacyRuntime(pageId);
        runPortalFeature('ensureExpenseMatrixUi', 'umum');
        return typeof window.fetchExpensePage === 'function' ? window.fetchExpensePage('umum', 1, false, options) : undefined;
      }
    };
    const loader = loaders[pageId];
    if (!loader) return;
    const cacheWindow = pageId === 'taxBankPage' ? 15000 : 45000;
    if (Date.now() - Number(Portal.pageLoadedAt[pageId] || 0) < cacheWindow) return;
    if (Portal.pageLoadPromises[pageId]) return Portal.pageLoadPromises[pageId];
    const background = Boolean(Portal.pageRendered[pageId]);
    const options = { background };
    if (background) setPageRefreshing(pageId, true);
    try {
      // Hanya loader halaman yang bersifat baca yang boleh dicoba sekali lagi.
      // api() sengaja tidak memiliki retry client agar mutasi tidak terkirim dua kali.
      Portal.pageLoadPromises[pageId] = runPortalReadWithRetry(() => Promise.resolve().then(() => loader(options)));
      await Portal.pageLoadPromises[pageId];
      Portal.pageLoadedAt[pageId] = Date.now();
      Portal.pageRendered[pageId] = true;
    } catch (error) {
      portalNotifyReadError(error);
    } finally {
      if (background) setPageRefreshing(pageId, false);
      delete Portal.pageLoadPromises[pageId];
    }
  }

  function scheduleLegacyCoreWarmup() {

      if (!window.PORTAL_ACTIVE || !Portal.user || Portal.user.role === 'TOKO') return;
      window.warmGbbLegacyRuntime().catch(error => console.warn('Legacy core warmup skipped:', error));
    };
    if (typeof window.requestIdleCallback === 'function') window.requestIdleCallback(warm, { timeout: 2500 });
    else setTimeout(warm, 1200);
  }

  async function init() {
    if (window.PORTAL_INIT_STARTED) return;
    window.PORTAL_INIT_STARTED = true;
    window.PORTAL_INIT_STATE = 'initializing';
    setSessionSplash(true, 'Menghubungkan workspace…', 'Menyiapkan konfigurasi aplikasi');
    try {
      const dependencies = portalDependencyStatus();
      window.PORTAL_DEPENDENCIES = dependencies;
      bindEvents();
      const entryNavLabel = document.querySelector('.nav-item[data-page="taxReceiptEntryPage"] .nav-text');
      if (entryNavLabel) entryNavLabel.textContent = 'Riwayat Pengajuan';
      document.querySelectorAll('#taxBankBranch,#taxBankStatus,#taxEntryBranch').forEach(select => select.setAttribute('data-portal-combo', ''));
      const linkPeriodInput = document.getElementById('taxLinkPeriod');
      if (linkPeriodInput) linkPeriodInput.value = monthNow();
      const entryMonthInput = document.getElementById('taxEntryMonth');
      if (entryMonthInput) entryMonthInput.value = monthNow();
      setupPortalControls(document);
      const missing = Object.keys(dependencies).filter(name => !dependencies[name]);
      if (missing.length) {
        const warning = document.getElementById('portalSetupWarning');
        const labels = { sweetAlert:'SweetAlert', jquery:'jQuery', flatpickr:'Kalender', xlsx:'Pembaca Excel' };
        if (warning) {
          warning.textContent = 'Sebagian komponen halaman belum termuat: ' + missing.map(name => labels[name]).join(', ') +
            '. Login tetap ditampilkan; muat ulang sebelum memakai fitur terkait.';
          warning.classList.remove('portal-hidden');
        }
      }
      window.PORTAL_INIT_STATE = 'checking-setup';
      const setup = await withTimeout(
        publicCall('getPortalSetupStatus'),
        25000,
        'Pemeriksaan awal membutuhkan waktu lebih lama. Silakan muat ulang lalu coba kembali.'
      );
      if (Portal.user) return;
      renderSetup(setup);
      if (Portal.token && setup.ready) {
        try {
          window.PORTAL_INIT_STATE = 'restoring-session';
          setSessionSplash(true, 'Selamat datang kembali', 'Memulihkan sesi aman Anda');
          Portal.user = await withTimeout(
            publicCall('portalGetSession', Portal.token),
            10000,
            'Pemulihan sesi terlalu lama.'
          );
          storageSet(PORTAL_SESSION_STORAGE_KEY, Portal.token, Portal.user && Portal.user.sessionExpiresAt);
          await activatePortal();
          return;
        } catch (error) {
          Portal.user = null;
          if (/sesi .*berakhir|sesi .*tidak valid|sesi login tidak ditemukan/i.test(portalCallError(error).message)) {
            storageRemove(PORTAL_SESSION_STORAGE_KEY);
            Portal.token = '';
          }
          throw error;
        }
      }
    } catch (error) {
      if (Portal.user) return;
      document.getElementById('portalSetupWarning').textContent = 'Setup belum dapat diperiksa: ' + portalLoginFailure(error).message;
      document.getElementById('portalSetupWarning').classList.remove('portal-hidden');
    }
    if (Portal.user) return;
    setSessionSplash(false);
    document.getElementById('portalGate').classList.remove('portal-hidden');
    completePortalStartup('login-ready');
  }

  function renderSetup(setup) {
    if (!setup || typeof setup !== 'object' || typeof setup.ready !== 'boolean') {
      throw new Error('Respons pemeriksaan awal dari server tidak lengkap. Muat ulang halaman lalu coba kembali.');
    }
    const warning = document.getElementById('portalSetupWarning');
    const loginForm = document.getElementById('portalLoginForm');
    const bootstrapForm = document.getElementById('portalBootstrapForm');
    if (setup.missingProperties && setup.missingProperties.length) {
      warning.textContent = 'Script Properties belum lengkap: ' + setup.missingProperties.join(', ');
      warning.classList.remove('portal-hidden');
      // Mode Setup DEV harus tetap dapat dibuka justru ketika konfigurasi rusak.
      loginForm.classList.remove('portal-hidden');
      bootstrapForm.classList.add('portal-hidden');
      const loginButton = document.getElementById('portalLoginButton');
      if (loginButton) loginButton.disabled = true;
      return;
    }
    const loginButton = document.getElementById('portalLoginButton');
    if (loginButton) loginButton.disabled = false;
    if (setup.databaseReady !== true) {
      warning.textContent = setup.diagnostic || 'Data akun belum dapat diperiksa karena layanan database belum tersedia. Coba login kembali setelah beberapa saat.';
      warning.classList.remove('portal-hidden');
      loginForm.classList.remove('portal-hidden');
      bootstrapForm.classList.add('portal-hidden');
      return;
    }
    const missingDependencies = window.PORTAL_DEPENDENCIES
      ? Object.keys(window.PORTAL_DEPENDENCIES).filter(name => !window.PORTAL_DEPENDENCIES[name])
      : [];
    if (!missingDependencies.length && !window.__portalLastStartupError) warning.classList.add('portal-hidden');
    if (!setup.hasAdmin) {
      loginForm.classList.add('portal-hidden');
      bootstrapForm.classList.remove('portal-hidden');
      document.getElementById('portalLoginSubtitle').textContent = setup.recoveryMode
        ? 'Buat akun administrator pemulihan untuk mendapatkan kembali akses.'
        : 'Selesaikan setup akun administrator pertama untuk environment pengembangan.';
      document.getElementById('portalBootstrapNotice').textContent = setup.recoveryMode
        ? 'Mode pemulihan aktif. Buat akun administrator baru; mode ini akan mati otomatis setelah berhasil.'
        : 'Belum ada akun administrator. Buat satu akun pertama untuk menyiapkan environment pengembangan.';
    } else {
      loginForm.classList.remove('portal-hidden');
      bootstrapForm.classList.add('portal-hidden');
    }
  }

  function updatePortalPasswordChecklist() {
    const password = document.getElementById('portalNewPassword')?.value || '';
    const confirmation = document.getElementById('portalConfirmPassword')?.value || '';
    const checks = {
      length:password.length >= 6,
      uppercase:/[A-Z]/.test(password),
      lowercase:/[a-z]/.test(password),
      number:/\d/.test(password),
      symbol:/[^A-Za-z0-9]/.test(password)
    };
    Object.entries(checks).forEach(([rule, valid]) => {
      const item = document.querySelector(`[data-password-rule="${rule}"]`);
      if (!item) return;
      item.classList.toggle('is-valid', valid);
      item.dataset.valid = valid ? 'true' : 'false';
      const icon = item.querySelector('i');
      if (icon) icon.className = valid ? 'bi bi-check-circle-fill' : 'bi bi-check-circle';
    });
    const matchHint = document.getElementById('portalPasswordMatchHint');
    if (matchHint) {
      const hasConfirmation = confirmation.length > 0;
      const matches = hasConfirmation && password === confirmation;
      matchHint.textContent = matches ? 'Password cocok.' : hasConfirmation ? 'Password belum sama.' : 'Pastikan nilainya sama dengan password baru.';
      matchHint.classList.toggle('is-valid', matches);
      matchHint.classList.toggle('is-invalid', hasConfirmation && !matches);
    }
    return Object.values(checks).every(Boolean) && password === confirmation;
  }

    if (!Portal.user) return;

      ? ['Review dan keputusan Bank Nota', 'Kelola Master Link dan tujuan Spreadsheet', 'Kelola akun dan akses pengguna']

  async function activatePortal(startPage) {
    try {
      window.PORTAL_INIT_STATE = 'activating-portal';
      setSessionSplash(true, 'Menyiapkan ruang kerja…', 'Menyusun menu dan data utama');
      const uName = document.getElementById('portalUserName');
      if (uName) uName.textContent = Portal.user.displayName || Portal.user.username;

      const uRole = document.getElementById('portalUserRole');
      if (uRole) uRole.textContent = Portal.user.role === 'TOKO' ? (Portal.user.branchName || 'Toko') : Portal.user.role;

      renderPortalAccountWorkspace();

      const isStore = Portal.user.role === 'TOKO';
      document.body.classList.toggle('portal-store-active', isStore);
      document.querySelectorAll('[data-portal-role="STORE"]').forEach(el => el.classList.toggle('portal-hidden', !isStore));
      document.querySelectorAll('[data-portal-role="TAX"]').forEach(el => el.classList.toggle('portal-hidden', isStore));
      document.querySelectorAll('[data-portal-role="ADMIN"]').forEach(el => el.classList.toggle('portal-hidden', Portal.user.role !== 'ADMIN'));

      const sb = document.getElementById('sidebar');
      if (sb) sb.classList.toggle('portal-store-sidebar', isStore);
      const mobileBranch = document.getElementById('storeMobileBranchName');
      const mobileProfileName = document.getElementById('storeMobileProfileName');
      const mobileProfileUsername = document.getElementById('storeMobileProfileUsername');
      const mobileProfileRole = document.getElementById('storeMobileProfileRole');
      const mobileProfileBranch = document.getElementById('storeMobileProfileBranch');
      if (mobileBranch) mobileBranch.textContent = Portal.user.branchName || 'Cabang';
      if (mobileProfileName) mobileProfileName.textContent = Portal.user.displayName || Portal.user.username;
      if (mobileProfileUsername) mobileProfileUsername.textContent = '@' + (Portal.user.username || 'pengguna');
      if (mobileProfileRole) mobileProfileRole.textContent = Portal.user.role === 'TOKO' ? 'TIM TOKO' : Portal.user.role;
      if (mobileProfileBranch) mobileProfileBranch.textContent = Portal.user.branchName || 'Akun cabang';

      // TAX/ADMIN masuk ke halaman modern. Runtime transaksi lama baru dimuat
      // ketika pengguna membuka salah satu halaman legacy, sehingga kegagalannya
      // tidak dapat membatalkan login maupun seluruh portal.
      const targetPage = startPage || (isStore ? 'tokoDashboardPage' : 'taxBankPage');
      const gate = document.getElementById('portalGate');
      document.body.classList.add('portal-authenticated');
      window.PORTAL_ACTIVE = true;
      if (gate) gate.classList.add('portal-hidden');
      const focusedControl = document.activeElement;
      if (focusedControl && typeof focusedControl.blur === 'function') focusedControl.blur();
      const skel = document.getElementById('skeleton-loader');
      if (skel && !['inputPage', 'historyPage', 'listrikPage', 'umumPage'].includes(targetPage)) {
        skel.style.display = 'none';
      }
      setSessionSplash(false);
      showPage(targetPage);
      completePortalStartup('active');

      // Vendor juga dimuat sesudah portal aktif. Bila sandbox Apps Script menolak
      // salah satu vendor, portal tetap terbuka dan error dibatasi ke fitur terkait.
      try {
        await ensureVendorRuntime();
        scheduleLegacyCoreWarmup();
      } catch (vendorError) {
        window.PORTAL_DEPENDENCIES = portalDependencyStatus();
        console.error('Deferred vendor runtime error:', vendorError);
        const warning = document.getElementById('portalSetupWarning');
        if (warning) {
          warning.textContent = 'Sebagian komponen tambahan gagal dimuat. Portal utama tetap dapat digunakan. Detail: ' + (vendorError.message || vendorError);
          warning.classList.remove('portal-hidden');
        }
      }

      try { Portal.categories = await api('GET_CATEGORIES'); }
      catch (error) { Portal.categories = []; }

      if (skel) skel.style.display = 'none';

    } catch (activateError) {
      console.error('activatePortal error:', activateError);
      document.body.classList.remove('portal-authenticated');
      const gate = document.getElementById('portalGate');
      setSessionSplash(false);
      if (gate) gate.classList.remove('portal-hidden');
      completePortalStartup('activation-error');
      // Biarkan pemanggil menampilkan error di dalam login gate. Popup Swal
      // berada di bawah z-index gate sehingga sebelumnya tidak terlihat.
      throw new Error('Login berhasil, tetapi halaman gagal dibuka. Muat ulang lalu coba lagi. Detail: ' + (activateError.message || activateError));
    }
  }

  async function logout(showMessage = true, triggerButton = null) {
    if (Portal.loggingOut) return;
    Portal.loggingOut = true;
    const button = triggerButton || document.getElementById('portalLogoutButton');
    const gate = document.getElementById('portalGate');
    const password = document.getElementById('portalPassword');
    const token = Portal.token;
    const cacheUserId = Portal.user && Portal.user.uid || '';
    let serverRevoked = true;
    const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

    setStoreProfileSheet(false);
    button?.classList.add('portal-logout-busy');
    setBusy(button, true, 'Mengamankan sesi...');
    document.body.classList.add('portal-logging-out');
    await pause(180);
    setSessionSplash(true, 'Mengamankan sesi...', 'Menutup akses dan membersihkan sesi Anda');
    await pause(260);

    try {
      if (token) await withTimeout(publicCall('portalLogout', token), 6500, 'Logout server terlalu lama.');
    } catch (error) {
      serverRevoked = false;
      console.warn('Server logout tidak merespons; sesi lokal tetap dibersihkan.', error);
    }

    if (cacheUserId) storageRemove('gbb_store_draft_' + cacheUserId);
    if (Portal.storeDraftPersistTimer) window.clearTimeout(Portal.storeDraftPersistTimer);
    Portal.storeDraftPersistTimer = null;
    await clearPortalDataCache(cacheUserId);

    Portal.token = '';
    Portal.user = null;
    Portal.pageLoadedAt = {};
    Portal.pageRendered = {};
    Portal.pageLoadPromises = {};
    Portal.taxPhotoCache = {};
    Portal.taxPhotoOrder = [];
    Portal.taxThumbnailCache = {};
    Portal.taxThumbnailOrder = [];
    Portal.taxDetailCache = {};
    Portal.taxPrefetchGeneration += 1;
    Portal.storeDraftRecoveryChecked = false;
    Portal.storeDraftDirty = false;
    window.PORTAL_ACTIVE = false;
    document.body.classList.remove('portal-authenticated', 'portal-store-active', 'portal-store-sheet-open');
    storageRemove(PORTAL_SESSION_STORAGE_KEY);
    if (password) password.value = '';
    if (gate) gate.classList.remove('portal-hidden');
    setSessionSplash(true, 'Sesi berhasil ditutup', 'Workspace Anda sudah aman');
    await pause(420);

    document.body.classList.remove('portal-logging-out');
    setSessionSplash(false);
    setBusy(button, false);
    button?.classList.remove('portal-logout-busy');
    Portal.loggingOut = false;

    if (showMessage) {
      if (Portal.logoutToastTimer) clearTimeout(Portal.logoutToastTimer);
      Portal.logoutToastTimer = setTimeout(() => {
        Portal.logoutToastTimer = null;
        Swal.fire({
        toast: true,
        position: 'top-end',
        icon: serverRevoked ? 'success' : 'warning',
        title: serverRevoked ? 'Berhasil keluar' : 'Keluar dari perangkat ini',
        text: serverRevoked ? 'Sesi Anda telah ditutup dengan aman.' : 'Sesi lokal sudah dibersihkan, tetapi server belum mengonfirmasi pencabutan token. Hubungi administrator bila perangkat ini tidak tepercaya.',
        showConfirmButton: false,
        timer: 2200,
        timerProgressBar: true
        });
      }, 340);
    }
  }

        clearTimeout(Portal.logoutToastTimer);

      }
      if (window.Swal && typeof window.Swal.close === 'function') window.Swal.close();
      const button = document.getElementById('portalLoginButton');
      setBusy(button, true, 'Memverifikasi...');
      const loginStageTimers = [
        setTimeout(() => { if (Portal.loginRunning) setBusy(button, true, 'Masih memverifikasi...'); }, 12000),
        setTimeout(() => { if (Portal.loginRunning) setBusy(button, true, 'Menyiapkan sesi...'); }, 30000)
      ];
      let loginEstablished = false;
      try {
        const result = await publicCall('portalLogin', {
          username: document.getElementById('portalUsername').value,
          password: document.getElementById('portalPassword').value
        });
        if (!result || !result.sessionToken || !result.user || !result.user.uid) {
          throw new Error('Respons login dari server tidak lengkap. Silakan coba login kembali.');
        }
        Portal.token = result.sessionToken;
        Portal.user = result.user;
        storageSet(PORTAL_SESSION_STORAGE_KEY, Portal.token, result.user && result.user.sessionExpiresAt);
        loginEstablished = true;
        document.getElementById('portalPassword').value = '';
        await activatePortal();
        event.target.reset();
      } catch (error) {
        Portal.user = null;
        if (!loginEstablished) {
          Portal.token = '';
          storageRemove(PORTAL_SESSION_STORAGE_KEY);
        }
        const gate = document.getElementById('portalGate');
        if (gate) gate.classList.remove('portal-hidden');
        showLoginError(error);
      } finally {
        loginStageTimers.forEach(timer => clearTimeout(timer));
        Portal.loginRunning = false;
        setBusy(button, false);
      }
    });

      if (status) status.textContent = 'Menghubungkan ke Firebase Authentication…';

      const bootstrapSecretInput = document.getElementById('portalBootstrapSecret');
      try {
        const result = await withTimeout(
          publicCall('bootstrapPortalAdmin', {
            displayName: document.getElementById('portalBootstrapName').value,
            username: document.getElementById('portalBootstrapUsername').value,

        );
        if (status) status.textContent = 'Akun ' + (result.username || 'administrator') + ' berhasil dibuat.';
        // Setup harus tetap berhasil walaupun vendor UI belum dimuat. Pada gate
        // awal, runtime SweetAlert memang sengaja masih deferred.
        if (window.Swal && typeof window.Swal.fire === 'function') {

      } catch (error) {
        if (status) status.textContent = error.message;
        portalNotifyError('Setup gagal', error);

      finally {
        // The setup secret is deliberately never retained in the DOM after a request.
        if (bootstrapSecretInput) bootstrapSecretInput.value = '';
