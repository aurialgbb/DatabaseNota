limit_req_zone $binary_remote_addr zone=nota_login:10m rate=5r/m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __VPS_IP__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nota-acme; }
    location / { return 308 https://__VPS_IP__$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __VPS_IP__;
    ssl_certificate /etc/letsencrypt/live/nota-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nota-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location ^~ /.well-known/workflow/ { return 404; }
    location ^~ /api/internal/ { return 404; }
    location ~ /\. { return 404; }
    location = /api/auth/login {
        limit_req zone=nota_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/nota-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/nota-proxy.conf;
    }
}
